<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primstav - Acesso Organização</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4">

    <div id="app-container" class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-100 max-w-md w-full fade-in relative">
        <div class="text-center mb-6 flex flex-col items-center">
            <img src="image_cbdce4.png" alt="Logo Primstav" class="h-20 sm:h-24 w-auto object-contain mb-2">
            <p class="text-sm text-slate-500 font-medium">Portal da Organização</p>
        </div>

        <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
            <button id="tab-login" class="flex-1 py-2.5 text-sm font-medium rounded-lg bg-white text-amber-600 shadow-sm transition-all">Entrar</button>
            <button id="tab-register" class="flex-1 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-800 transition-all">Criar Empresa</button>
        </div>

        <div id="error-msg" class="hidden mb-4 p-3 bg-rose-50 text-rose-600 text-sm rounded-lg border border-rose-100 text-center font-medium"></div>

        <form id="auth-form" class="space-y-4">
            <div id="box-empresa" class="hidden">
                <label class="block text-xs font-semibold mb-1 text-slate-700">Nome da Empresa</label>
                <input type="text" id="inp-empresa" class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-700">E-mail</label>
                <input type="email" id="inp-email" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-700">Senha</label>
                <input type="password" id="inp-pass" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm outline-none focus:border-amber-500">
            </div>
            <div id="box-confirm" class="hidden">
                <label class="block text-xs font-semibold mb-1 text-slate-700">Repetir Senha</label>
                <input type="password" id="inp-confirm" class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm outline-none focus:border-amber-500">
                <p class="text-[11px] text-slate-400 mt-1">Mínimo de 6 caracteres.</p>
            </div>
            <div id="box-forgot" class="text-right -mt-2"><button type="button" id="btn-forgot" class="text-xs font-bold text-amber-600 hover:text-amber-700 underline">Esqueci minha senha</button></div>
            <button type="submit" id="btn-submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl shadow-md mt-2 transition-all">Acessar Painel</button>
        </form>

        <div class="mt-4 pt-4 border-t border-slate-100 text-center">
            <button id="btn-google" class="w-full bg-white hover:bg-slate-50 text-slate-700 font-bold py-3 px-4 border border-slate-200 rounded-xl shadow-sm flex items-center justify-center space-x-2 transition-all">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Entrar com o Google</span>
            </button>
        </div>
    </div>

    <script type="module">
        // Remove .html da barra de endereço
        if (window.location.pathname.endsWith('.html')) {
            window.history.replaceState(null, '', window.location.pathname.replace(/\.html$/, '') + window.location.search);
        }

        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";
        import { 
            auth, 
            googleProvider, 
            rtdb, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInWithPopup, 
            ref, 
            get, 
            set 
        } from './firebase-config.js';

        const TENANTS = 'agendapro_saas/tenants';

        let mode = 'login';
        const tabLogin = document.getElementById('tab-login');
        const tabReg = document.getElementById('tab-register');
        const boxEmpresa = document.getElementById('box-empresa');
        const boxConfirm = document.getElementById('box-confirm');
        const btnSubmit = document.getElementById('btn-submit');
        const btnGoogle = document.getElementById('btn-google');
        const errorMsg = document.getElementById('error-msg');

        const ON = 'flex-1 py-2.5 text-sm font-medium rounded-lg bg-white text-amber-600 shadow-sm transition-all';
        const OFF = 'flex-1 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-800 transition-all';

        function showError(msg) { errorMsg.className = 'mb-4 p-3 bg-rose-50 text-rose-600 text-sm rounded-lg border border-rose-100 text-center font-medium'; errorMsg.textContent = msg; errorMsg.classList.remove('hidden'); }

        function setMode(m) {
            mode = m;
            const reg = m === 'register';
            tabLogin.className = reg ? OFF : ON;
            tabReg.className = reg ? ON : OFF;
            boxEmpresa.classList.toggle('hidden', !reg);
            boxConfirm.classList.toggle('hidden', !reg);
            document.getElementById('inp-empresa').required = reg;
            document.getElementById('inp-confirm').required = reg;
            btnSubmit.textContent = reg ? 'Criar Conta' : 'Acessar Painel';
            document.getElementById('box-forgot').classList.toggle('hidden', reg);
            errorMsg.classList.add('hidden');
        }
        tabLogin.onclick = () => setMode('login');
        tabReg.onclick = () => setMode('register');

        // Recuperar senha (administrador e profissionais usam este mesmo acesso)
        document.getElementById('btn-forgot').onclick = async () => {
            errorMsg.classList.add('hidden');
            const email = document.getElementById('inp-email').value.trim();
            if (!email) return showError('Digite seu e-mail no campo acima e clique em "Esqueci minha senha".');
            try {
                await sendPasswordResetEmail(auth, email);
            } catch (err) {
                if (err && err.code === 'auth/too-many-requests') return showError('Muitas tentativas. Aguarde alguns minutos e tente de novo.');
                if (err && err.code === 'auth/invalid-email') return showError('E-mail inválido.');
            }
            errorMsg.className = 'mb-4 p-3 bg-emerald-50 text-emerald-700 text-sm rounded-lg border border-emerald-100 text-center font-medium';
            errorMsg.textContent = 'Se existir uma conta com este e-mail, enviamos um link para criar uma nova senha. Olhe também o spam.';
        };

        // Pede à Cloud Function para conferir o cadastro no servidor e gravar o papel no login (custom claims).
        async function syncRole(slug) {
            const r = await httpsCallable(getFunctions(getApp()), 'syncRole')(slug ? { slug } : {});
            await auth.currentUser.getIdToken(true);
            return r.data;
        }

        function generateSlug(text) {
            return text.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
        }

        // Autenticação com Google
        btnGoogle.onclick = async () => {
            errorMsg.classList.add('hidden');
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                const email = user.email;
                const slug = email.replace(/[^a-zA-Z0-9]/g, '_');

                const tenantRef = ref(rtdb, `${TENANTS}/${slug}`);
                const snapshot = await get(tenantRef);

                if (!snapshot.exists()) {
                    await set(tenantRef, {
                        name: user.displayName || 'Minha Empresa',
                        admin: { id: user.uid, name: user.displayName || 'Administrador', email: user.email }
                    });
                }

                try { await syncRole(slug); } catch (e) { console.warn('syncRole:', e && e.message); }
                localStorage.setItem('agendaProSession', JSON.stringify({ slug, id: user.uid, role: 'admin' }));
                window.location.href = 'painel_do_profissional.html';
            } catch (err) {
                showError("Erro com o Google: " + err.message);
            }
        };

        // Form Submit (E-mail e Senha)
        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            btnSubmit.textContent = 'Aguarde...';
            btnSubmit.disabled = true;

            const email = document.getElementById('inp-email').value.trim();
            const pass = document.getElementById('inp-pass').value;

            try {
                if (mode === 'register') {
                    const empresa = document.getElementById('inp-empresa').value.trim();
                    const confirm = document.getElementById('inp-confirm').value;

                    if (pass !== confirm) throw new Error('As senhas não coincidem.');
                    if (pass.length < 6) throw new Error('A senha deve ter pelo menos 6 caracteres.');

                    const slug = generateSlug(empresa);
                    if (!slug) throw new Error('Informe um nome de empresa válido.');

                    const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                    const user = userCred.user;

                    await set(ref(rtdb, `${TENANTS}/${slug}`), {
                        name: empresa,
                        admin: { id: user.uid, name: 'Administrador', email: email }
                    });

                    try { await syncRole(slug); } catch (e) { console.warn('syncRole:', e && e.message); }
                    localStorage.setItem('agendaProSession', JSON.stringify({ slug, id: user.uid, role: 'admin' }));
                    window.location.href = 'painel_do_profissional.html';
                } else {
                    const userCred = await signInWithEmailAndPassword(auth, email, pass);
                    const user = userCred.user;

                    let found = null;
                    // 1) caminho seguro: o servidor descobre a organização e grava o papel no login
                    try {
                        const r = await syncRole();
                        if (r && r.slug && (r.role === 'admin' || r.role === 'employee')) found = { slug: r.slug, id: r.id, role: r.role };
                    } catch (e) { console.warn('syncRole indisponível, usando busca antiga:', e && e.message); }

                    // 2) alternativa (enquanto a Cloud Function não estiver publicada): busca no banco como antes
                    let tenants = {};
                    if (!found) { try { tenants = (await get(ref(rtdb, TENANTS))).val() || {}; } catch (e) { tenants = {}; } }

                    for (const slug in tenants) {
                        const t = tenants[slug];
                        if (t.admin && (t.admin.email || '').toLowerCase() === email.toLowerCase()) {
                            found = { slug, id: user.uid, role: 'admin' };
                            break;
                        }
                        const emps = Array.isArray(t.employees) ? t.employees : Object.values(t.employees || {});
                        for (const emp of emps) {
                            if (emp && (emp.email || '').toLowerCase() === email.toLowerCase()) {
                                found = { slug, id: emp.id, role: 'employee' };
                                break;
                            }
                        }
                        if (found) break;
                    }

                    if (!found) {
                        found = { slug: email.replace(/[^a-zA-Z0-9]/g, '_'), id: user.uid, role: 'admin' };
                    }

                    localStorage.setItem('agendaProSession', JSON.stringify(found));
                    window.location.href = 'painel_do_profissional.html';
                }
            } catch (err) {
                showError(err.message);
                btnSubmit.textContent = mode === 'login' ? 'Acessar Painel' : 'Criar Conta';
                btnSubmit.disabled = false;
            }
        };
    </script>
</body>
</html>
