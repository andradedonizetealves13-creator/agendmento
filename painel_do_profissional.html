            }
            return '';
        }

        window.filterClients = function(q) {
            q = q.toLowerCase().trim(); let n = 0;
            document.querySelectorAll('.client-row').forEach(r => {
                const ok = !q || r.dataset.search.includes(q);
                r.style.display = ok ? '' : 'none'; if (ok) n++;
            });
            document.getElementById('client-count').textContent = n;
            document.getElementById('client-empty').classList.toggle('hidden', n > 0);
        };

        window.selectThemePalette = function(paletteId) {
            window.__semTema = false;
            t.themePalette = paletteId;
            applyThemeCSS(paletteId);
            saveDB(['themePalette']);
            render();
        };

        // ---------- FUNDO (rascunho até clicar em Salvar Fundo) ----------
        window.handleBgUpload = function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                draft[bgK('Image')] = ev.target.result;
                if (bgGet(bgK('Opacity')) === undefined || bgGet(bgK('Opacity')) === null) draft[bgK('Opacity')] = 0.35;
                if (bgGet(bgK('Blur')) === undefined || bgGet(bgK('Blur')) === null) draft[bgK('Blur')] = 0;
                // imagem nova começa centralizada e sem zoom
                draft[bgK('PosX')] = 50; draft[bgK('PosY')] = 50; draft[bgK('Zoom')] = 100;
                render();
            };
            reader.readAsDataURL(file);
        };
        window.removeBgImage = function() { draft[bgK('Image')] = null; render(); };
        window.updateBgOpacity = function(val) {
            draft[bgK('Opacity')] = parseFloat(val);
            const p = document.getElementById('preview-bg-box'); if (p) p.style.opacity = val;
            const l = document.getElementById('opacity-val-label'); if (l) l.innerText = Math.round(val * 100) + '%';
        };
        window.updateBgBlur = function(val) {
            draft[bgK('Blur')] = parseInt(val);
            const p = document.getElementById('preview-bg-box'); if (p) p.style.filter = `blur(${val}px)`;
            const l = document.getElementById('blur-val-label'); if (l) l.innerText = val + 'px';
        };
        window.updateBgPos = function(axis, val) {
            draft[bgK(axis)] = parseFloat(val);
            refreshPreviewDom();
        };
        window.updateBgZoom = function(val) {
            draft[bgK('Zoom')] = parseFloat(val);
            refreshPreviewDom();
        };
        window.resetBgAdjust = function() {
            draft[bgK('PosX')] = 50; draft[bgK('PosY')] = 50; draft[bgK('Zoom')] = 100;
            refreshPreviewDom();
        };
        window.setBgApplyPanel = function(checked) { draft.bgApplyPanel = !!checked; };
        window.salvarFundo = function() {
            const keys = BG_KEYS.filter(k => k in draft);
            keys.forEach(k => { t[k] = draft[k]; delete draft[k]; });
            if (keys.length) saveDB(keys);
            applyBgImageSettings(); render();
            showModal('Salvo!', 'Plano de fundo atualizado.', 'success');
        };

        // ---------- DASHBOARD ----------
        function renderDashboardAnalytics(role, user) {
            const meses = [{v:'01',n:'Janeiro'},{v:'02',n:'Fevereiro'},{v:'03',n:'Março'},{v:'04',n:'Abril'},{v:'05',n:'Maio'},{v:'06',n:'Junho'},{v:'07',n:'Julho'},{v:'08',n:'Agosto'},{v:'09',n:'Setembro'},{v:'10',n:'Outubro'},{v:'11',n:'Novembro'},{v:'12',n:'Dezembro'}];
            const isActive = (a) => isBusyApp(a);
            
            let apps = t.appointments || [];
            if(role === 'employee') apps = apps.filter(a => a.employeeId === user.id);

            const filteredApps = apps.filter(a => {
                const [y, m] = a.date.split('-');
                return m === dashboardFilterMonth && y === dashboardFilterYear;
            });

            const completedApps = filteredApps.filter(a => getEffectiveAppStatus(a) === 'realizado');
            const canceledApps = filteredApps.filter(a => getEffectiveAppStatus(a) === 'cancelado');
            const noShowApps = filteredApps.filter(a => getEffectiveAppStatus(a) === 'nao_compareceu');
            const upcomingApps = filteredApps.filter(a => getEffectiveAppStatus(a) === 'agendado');
            const depReceivedApps = filteredApps.filter(a => a.depositRequired && ['agendado', 'realizado', 'nao_compareceu'].includes(a.status));
            const depReceived = depReceivedApps.reduce((sum, a) => sum + (Number(a.depositPaid != null ? a.depositPaid : a.depositAmount) || 0), 0);
            const depPendingApps = filteredApps.filter(a => getEffectiveAppStatus(a) === 'pendente');
            const depPendingVal = depPendingApps.reduce((sum, a) => sum + (Number(a.depositAmount) || 0), 0);
            const depExpiredCount = filteredApps.filter(a => getEffectiveAppStatus(a) === 'expirado').length;
            const depRestToReceive = filteredApps.filter(a => a.depositRequired && getEffectiveAppStatus(a) === 'agendado').reduce((sum, a) => sum + Math.max(0, (Number(a.totalPrice) || 0) - (Number(a.depositPaid != null ? a.depositPaid : a.depositAmount) || 0)), 0);

            const totalRevenue = completedApps.reduce((s, a) => s + (a.totalPrice || 0), 0);
            const avgTicket = completedApps.length ? totalRevenue / completedApps.length : 0;
            const pctOf = (n) => filteredApps.length ? (n / filteredApps.length * 100) : 0;

            // comparação com o mês anterior
            let pm = parseInt(dashboardFilterMonth) - 1, py = parseInt(dashboardFilterYear);
            if (pm === 0) { pm = 12; py--; }
            const pmStr = String(pm).padStart(2, '0');
            const prevRevenue = apps.filter(a => { const [y, m] = a.date.split('-'); return m === pmStr && y === String(py) && getEffectiveAppStatus(a) === 'realizado'; })
                .reduce((s, a) => s + (a.totalPrice || 0), 0);
            const delta = prevRevenue > 0 ? ((totalRevenue - prevRevenue) / prevRevenue * 100) : null;
            const deltaHtml = delta === null
                ? `<p class="text-[11px] text-slate-400 mt-0.5">Sem dados no mês anterior</p>`
                : `<p class="text-[11px] font-bold mt-0.5 ${delta >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta).toFixed(1)}% <span class="text-slate-400 font-medium">vs mês anterior (${brl(prevRevenue)})</span></p>`;

            // por serviço (quantidade e faturamento estimado pelo preço atual)
            const procStats = {};
            t.procedures.forEach(p => { procStats[p.name] = 0; });
            completedApps.forEach(a => {
                (a.proceduresNames || []).forEach(pName => {
                    procStats[pName] = (procStats[pName] || 0) + 1;
                });
            });
            const priceByName = {}; t.procedures.forEach(p => { priceByName[p.name] = p.price; });
            const procRows = Object.keys(procStats).map(n => ({ name: n, count: procStats[n], revenue: procStats[n] * (priceByName[n] || 0) })).sort((a, b) => b.count - a.count);

            // por profissional
            const staffStats = {};
            if(role === 'admin') {
                t.employees.forEach(e => {
                    staffStats[e.id] = { name: e.name, canceled: 0, noShow: 0, completed: 0, revenue: 0, scheduled: 0 };
                });
                staffStats[t.admin.id] = { name: t.admin.name, canceled: 0, noShow: 0, completed: 0, revenue: 0, scheduled: 0 };

                filteredApps.forEach(a => {
                    if(!staffStats[a.employeeId]) return;
                    const st = getEffectiveAppStatus(a);
                    const S = staffStats[a.employeeId];
                    if(st === 'cancelado') S.canceled++;
                    else if(st === 'nao_compareceu') S.noShow++;
                    else if(st === 'realizado') { S.completed++; S.revenue += (a.totalPrice || 0); }
                    else S.scheduled++;
                });
            }

            // faturamento por dia
            const [fy, fm] = [parseInt(dashboardFilterYear), parseInt(dashboardFilterMonth)];
            const daysInMonth = new Date(fy, fm, 0).getDate();
            const revByDay = Array(daysInMonth).fill(0);
            completedApps.forEach(a => { const d = parseInt(a.date.split('-')[2]); if (d >= 1 && d <= daysInMonth) revByDay[d - 1] += (a.totalPrice || 0); });
            const maxDay = Math.max(1, ...revByDay);

            // horários e dias de pico (todos os agendamentos ativos do mês)
            const activeMonth = filteredApps.filter(isActive);
            const byHour = {}; const byWeekday = Array(7).fill(0);
            activeMonth.forEach(a => {
                const h = a.time.split(':')[0]; byHour[h] = (byHour[h] || 0) + 1;
                const [y, m, d] = a.date.split('-'); byWeekday[new Date(y, m - 1, d).getDay()]++;
            });
            const hourKeys = Object.keys(byHour).sort();
            const maxHour = Math.max(1, ...Object.values(byHour));
            const maxWd = Math.max(1, ...byWeekday);
            const wdNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

            // clientes novos x recorrentes
            const keyOf = (a) => (a.clientId && !String(a.clientId).startsWith('manual-cli-')) ? a.clientId : (a.clientName || '').toLowerCase();
            const monthStart = `${dashboardFilterYear}-${dashboardFilterMonth}-01`;
            const before = new Set(apps.filter(a => isActive(a) && a.date < monthStart).map(keyOf));
            const monthKeys = new Set(activeMonth.map(keyOf));
            let novos = 0, recorrentes = 0;
            monthKeys.forEach(k => before.has(k) ? recorrentes++ : novos++);

            const card = (icon, color, label, value, extra = '') => `
                <div class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border shadow-sm flex items-center space-x-4">
                    <div class="w-12 h-12 ${color} rounded-2xl flex items-center justify-center font-bold shrink-0"><i data-lucide="${icon}" class="w-6 h-6"></i></div>
                    <div class="min-w-0">
                        <p class="text-xs text-slate-400 font-bold uppercase">${label}</p>
                        <h3 class="text-2xl font-black text-slate-800 mt-0.5">${value}</h3>
                        ${extra}
                    </div>
                </div>`;

            return `
                <div class="space-y-6 fade-in max-w-6xl mx-auto">
                    <div class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800">Dashboard de Desempenho</h2>
                            <p class="text-xs text-slate-500">${role === 'admin' ? 'Visão consolidada da empresa' : 'Visão dos seus atendimentos pessoais'}</p>
                        </div>
                        <div class="flex items-center space-x-3 self-start sm:self-auto">
                            <select onchange="dashboardFilterMonth=this.value; render()" class="px-4 py-2.5 bg-slate-50 border rounded-xl text-sm font-bold text-slate-800 outline-none">
                                ${meses.map(m => `<option value="${m.v}" ${dashboardFilterMonth===m.v?'selected':''}>${m.n}</option>`).join('')}
                            </select>
                            <input type="number" value="${dashboardFilterYear}" min="2020" max="2030" onchange="dashboardFilterYear=this.value; render()" class="w-24 px-3 py-2.5 bg-slate-50 border rounded-xl text-sm font-bold text-slate-800 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${!canSeeValues() ? '' : card('wallet', 'bg-emerald-50 text-emerald-600', 'Faturamento Total', `<span class="text-emerald-600">${brl(totalRevenue)}</span>`, deltaHtml)}
                        ${card('check-circle', 'bg-theme-secondary text-theme-primary', 'Atendimentos Concluídos', completedApps.length)}
                        ${card('user-x', 'bg-amber-50 text-amber-600', 'Não Compareceram', `<span class="text-amber-600">${noShowApps.length}</span>`)}
                        ${card('x-circle', 'bg-rose-50 text-rose-600', 'Cancelamentos', `<span class="text-rose-600">${canceledApps.length}</span>`)}
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${card('calendar-clock', 'bg-sky-50 text-sky-600', 'A Realizar no Mês', upcomingApps.length)}
                        ${!canSeeValues() ? '' : card('receipt', 'bg-emerald-50 text-emerald-600', 'Ticket Médio', brl(avgTicket))}
                        ${card('percent', 'bg-rose-50 text-rose-600', 'Taxa de Cancelamento', pctOf(canceledApps.length).toFixed(1) + '%')}
                        ${card('percent', 'bg-amber-50 text-amber-600', 'Taxa de Faltas', pctOf(noShowApps.length).toFixed(1) + '%')}
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 ${canSeeValues() ? '' : 'hidden'}">
                        ${card('wallet', 'bg-emerald-50 text-emerald-600', 'Sinal recebido no mês', `<span class="text-emerald-600">${brl(depReceived)}</span>`, `<p class="text-[11px] text-slate-400 mt-1">${depReceivedApps.length} agendamento(s) com sinal</p>`)}
                        ${card('hourglass', 'bg-amber-50 text-amber-600', 'Sinais pendentes', `<span class="text-amber-600">${depPendingApps.length}</span>`, `<p class="text-[11px] text-slate-400 mt-1">${brl(depPendingVal)} aguardando${depExpiredCount ? ' • ' + depExpiredCount + ' expirado(s)' : ''}</p>`)}
                        ${card('banknote', 'bg-sky-50 text-sky-600', 'Restante a receber', brl(depRestToReceive), `<p class="text-[11px] text-slate-400 mt-1">dos agendados com sinal pago</p>`)}
                    </div>

                    <div class="bg-white/90 backdrop-blur-md p-6 rounded-2xl border shadow-sm ${canSeeValues() ? '' : 'hidden'}">
                        <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center"><i data-lucide="bar-chart-3" class="w-5 h-5 mr-2 text-theme-primary"></i> Faturamento por Dia</h3>
                        <div class="overflow-x-auto custom-scrollbar pb-2">
                            <div class="flex items-end gap-1 h-36 min-w-[560px]">
                                ${revByDay.map((v, i) => `
                                    <div class="flex-1 h-full flex flex-col justify-end items-center" title="Dia ${i + 1}: ${brl(v)}">
                                        <div class="w-full rounded-t-md" style="height:${v > 0 ? Math.max(v / maxDay * 100, 4) : 0}%; background:var(--theme-primary); opacity:${v > 0 ? 1 : 0.15}"></div>
                                    </div>`).join('')}
                            </div>
                            <div class="flex gap-1 min-w-[560px] mt-1">
                                ${revByDay.map((v, i) => `<span class="flex-1 text-center text-[9px] text-slate-400 font-medium">${i + 1}</span>`).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="bg-white/90 backdrop-blur-md p-6 rounded-2xl border shadow-sm">
                        <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center justify-between">
                            <span class="flex items-center"><i data-lucide="list" class="w-5 h-5 mr-2 text-theme-primary"></i> Agendamentos do Mês (${filteredApps.length})</span>
                            <span class="text-xs text-slate-400 font-normal">Status atualizados em tempo real</span>
                        </h3>
                        <div class="space-y-3 max-h-80 overflow-y-auto custom-scrollbar pr-2">
                            ${filteredApps.length === 0 ? '<p class="text-xs text-slate-400 py-4 text-center">Nenhum agendamento encontrado para este mês.</p>' : filteredApps.map(a => {
                                const st = getEffectiveAppStatus(a);
                                const emp = a.employeeId === t.admin.id ? t.admin : (t.employees || []).find(e=>e.id===a.employeeId);
                                const empName = emp ? emp.name : 'Profissional';
                                
                                let statusBadge = `<span class="bg-theme-secondary text-theme-primary border text-[10px] font-bold px-2.5 py-1 rounded-full">Agendado</span>`;
                                if (st === 'realizado') statusBadge = `<span class="bg-emerald-50 text-emerald-700 border-emerald-200 border text-[10px] font-bold px-2.5 py-1 rounded-full">Concluído</span>`;
                                else if (st === 'expirado') statusBadge = `<span class="bg-slate-100 text-slate-600 border-slate-300 border text-[10px] font-bold px-2.5 py-1 rounded-full">Sinal expirado</span>`;

            if(!date) return showModal('Erro', 'Selecione uma data.', 'error');
            const newReq = { id: 'req-' + Date.now(), empId, empName, date, type, status: 'pending' };
            if(type === 'plantao') { newReq.start = document.getElementById('req-start').value; newReq.end = document.getElementById('req-end').value; }
            addRequestDB(newReq)
                .then(() => showModal('Enviado', 'Solicitação enviada.', 'success'))
                .catch(() => showModal('Erro de conexão', 'Não foi possível enviar a solicitação. Tente novamente.', 'error'));
        };

        window.handleApproveRequest = function(reqId, approved) {
            const req = t.requests.find(r => r.id === reqId); if(!req) return;
            const newStatus = approved ? 'approved' : 'rejected';
            if(approved) {
                const emp = t.employees.find(e => e.id === req.empId);
                if(emp) {
                    if(!emp.exceptions) emp.exceptions = {};
                    if(req.type === 'folga') emp.exceptions[req.date] = { type: 'folga' };
                    else emp.exceptions[req.date] = { type: 'plantao', start: req.start, end: req.end };
                    saveDB(['employees']);
                }
            }
            setRequestStatusDB(reqId, newStatus)
                .catch(() => showModal('Erro de conexão', 'Não foi possível atualizar a solicitação. Tente novamente.', 'error'));
        };

        // ---------- REGRAS: ações ----------
        window.toggleRule = function(section) { const d = rd(); d[section].enabled = !d[section].enabled; render(); };

        function pixError(type, key) {
            key = (key || '').trim();
            if (!key) return 'Informe a chave Pix que será mostrada ao cliente.';
            const digits = key.replace(/\D/g, '');
            if (type === 'cpf' && digits.length !== 11) return 'O CPF precisa ter 11 números.';
            if (type === 'cnpj' && digits.length !== 14) return 'O CNPJ precisa ter 14 números.';
            if (type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(key)) return 'Informe um e-mail válido para a chave Pix.';
            if (type === 'telefone' && (digits.length < 10 || digits.length > 13)) return 'O telefone precisa ter DDD e número (10 a 13 números).';
            if (type === 'aleatoria' && !/^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$/i.test(key)) return 'A chave aleatória deve ter o formato xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx.';
            return null;
        }

        window.salvarRegras = async function() {
            const d = rd();
            const fail = (msg) => showModal('Atenção', msg, 'error');
            const hours = parseInt(d.hours);
            const dep = d.deposit, win = d.openingWindow, flow = d.bookingFlow;
            const percent = Number(dep.percent);
            if (dep.enabled) {
                if (!dep.all && dep.procedureIds.length === 0) return fail('Selecione ao menos um procedimento para cobrar sinal (ou use "Selecionar tudo").');
                if (!(percent > 0 && percent <= 100)) return fail('A porcentagem do sinal deve ficar entre 1 e 100.');
                if (!(window.providerInfo && window.providerInfo.active)) { const err = pixError(dep.pixKeyType, dep.pixKey); if (err) return fail(err); }
            }
            const expiryHours = Number(dep.expiryHours === '' || dep.expiryHours == null ? 2 : dep.expiryHours);
            if (dep.enabled && (isNaN(expiryHours) || expiryHours < 0 || expiryHours > 720)) return fail('O prazo para pagar o sinal deve ficar entre 0 e 720 horas (0 = sem prazo).');
            const waLink = waNormalize(dep.whatsappLink);
            if (waLink === null) return fail('O link do WhatsApp não parece válido. Cole um link como https://wa.me/5519999999999 (ou só o número com DDD).');
            let amount = Math.floor(Number(win.amount));
            if (win.enabled && win.mode !== 'always') {
                const max = WIN_MODES.find(x => x[0] === win.mode)[3];
                if (!(amount >= 1 && amount <= max)) return fail(`Informe uma quantidade entre 1 e ${max} para a abertura da agenda.`);
            }
            if (flow.enabled && flow.steps.indexOf('time') < flow.steps.indexOf('date')) return fail('O horário precisa vir depois do dia. Ajuste a ordem das etapas.');

            const allIds = (t.procedures || []).map(p => String(p.id));
            t.rules = {
                deposit: {
                    enabled: dep.enabled, all: dep.all === true,
                    procedureIds: dep.all ? allIds : dep.procedureIds,
                    percent: percent > 0 && percent <= 100 ? percent : 30,
                    pixKeyType: dep.pixKeyType, pixKey: (dep.pixKey || '').trim(),
                    whatsappLink: waLink || '',
                    expiryHours: (!isNaN(expiryHours) && expiryHours >= 0 && expiryHours <= 720) ? expiryHours : 2
                },
                openingWindow: { enabled: win.enabled, mode: win.mode, amount: amount >= 1 ? amount : 2 },
                bookingFlow: { enabled: flow.enabled, steps: flow.steps.slice() }
            };
            t.cancelMinHours = (isNaN(hours) || hours < 0) ? 0 : hours;
            window.rulesDraft = null;
            const ok = await saveDB(['rules', 'cancelMinHours']);
            if (ok) showModal('Sucesso', 'Regras atualizadas!', 'success');
        };

        // ---------- PAGAMENTO AUTOMÁTICO (Mercado Pago): conectar / trocar / desconectar ----------
        async function mpConfirmLogin(passId) {
            const u = auth.currentUser;
            if (!u) throw new Error('Sessão expirada. Entre novamente.');
            if (u.providerData.some(x => x.providerId === 'password')) {
                const pass = ((document.getElementById(passId || 'mp-pass') || {}).value) || '';
                if (!pass) throw new Error('Digite a senha do seu login para continuar.');
                try { await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, pass)); }
                catch (_) { throw new Error('Senha incorreta.'); }
            } else {
                try { await reauthenticateWithPopup(u, new GoogleAuthProvider()); }
                catch (_) { throw new Error('Não foi possível confirmar o login com o Google. Tente de novo.'); }
            }
            await u.getIdToken(true);   // o servidor confere que a senha foi digitada agora há pouco
        }
        function mpCall(name, data) { return httpsCallable(getFunctions(getApp()), name)(Object.assign({ slug: session.slug }, data || {})); }

        // ---------- NOTIFICAÇÕES (push) ----------
        // Chave pública VAPID: Firebase > Configurações do projeto > Cloud Messaging > Certificados push da Web > Gerar par de chaves

        window.compressImage = function(file, maxDim, quality) {
            return new Promise((resolve, reject) => {
                const fr = new FileReader();
                fr.onerror = () => reject(new Error('read'));
                fr.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('img'));
                    img.onload = () => {
                        const k = Math.min(1, maxDim / Math.max(img.width, img.height));
                        const c = document.createElement('canvas');
                        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
                        const ctx = c.getContext('2d');
                        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
                        ctx.drawImage(img, 0, 0, c.width, c.height);
                        resolve(c.toDataURL('image/jpeg', quality));
                    };
                    img.src = fr.result;
                };
                fr.readAsDataURL(file);
            });
        };

        function coSetPin(lat, lng, fly, noReverse) {
            lat = Math.round(lat * 1e6) / 1e6; lng = Math.round(lng * 1e6) / 1e6;
            draft.companyLat = lat; draft.companyLng = lng;
            const c = document.getElementById('co-coords'); if (c) c.textContent = 'Pino: ' + lat.toFixed(5) + ', ' + lng.toFixed(5);
            if (!window._coMap) return;
            if (window._coMarker) window._coMarker.setLatLng([lat, lng]);
            else {
                window._coMarker = L.marker([lat, lng], { draggable: true }).addTo(window._coMap);
                window._coMarker.on('dragend', () => { const p = window._coMarker.getLatLng(); coSetPin(p.lat, p.lng, false); });
            }
            if (fly) window._coMap.setView([lat, lng], Math.max(window._coMap.getZoom(), 18));
            if (!noReverse) coReverse(lat, lng);

        // endereço do ponto marcado (geocodificação reversa) + botão para usar no campo de endereço
        let _coRevT = null;

                try {
                    const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=pt-BR&lat=' + lat + '&lon=' + lng);
                    const j = await r.json();
                    if (!j || !j.address) { box.classList.add('hidden'); return; }
                    window._coRevText = coFormatAddr(j);
                    box.innerHTML = '<span class="block font-bold text-slate-700 mb-1">Endereço deste ponto:</span>' + esc(window._coRevText) + '<button type="button" onclick="coUseRevAddr()" class="block mt-1.5 font-bold text-theme-primary">Usar este endereço no campo acima</button>';

        window.coUseRevAddr = function() {

        };
        function coFormatAddr(j) {
            const a = j.address || {};
            const rua = a.road || a.pedestrian || a.footway || a.path || '';
            const num = a.house_number || '';
            const bairro = a.suburb || a.neighbourhood || a.quarter || a.city_district || '';
            const cidade = a.city || a.town || a.village || a.municipality || '';
            const uf = (a['ISO3166-2-lvl4'] || '').replace('BR-', '') || a.state || '';
            const p1 = [rua, num].filter(Boolean).join(', ');
            const out = [p1, bairro, [cidade, uf].filter(Boolean).join(' - ')].filter(Boolean).join(', ');
            return out || (j.display_name || '').split(',').slice(0, 4).join(',').trim();
        }
        window.initCompanyMap = function() {
            const el = document.getElementById('co-map');
            if (window._coMap) { try { window._coMap.remove(); } catch (_) {} window._coMap = null; window._coMarker = null; }
            if (!el) return;
            coLoadLeaflet(() => {
                const el2 = document.getElementById('co-map'); if (!el2 || el2._leaflet_id) return;
                const la = parseFloat(el2.dataset.lat), ln = parseFloat(el2.dataset.lng);
                const has = isFinite(la) && isFinite(ln);
                const ruas = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 20, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO' });
                const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
                const sat = L.layerGroup([
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagens &copy; Esri' }),
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, opacity: 0.9 }),
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 })
                ]);
                window._coMap = L.map(el2, { zoomControl: true, layers: [ruas] }).setView(has ? [la, ln] : [-22.725, -47.649], has ? 18 : 13);
                L.control.layers({ 'Ruas': ruas, 'Satélite': sat, 'OpenStreetMap': osm }, null, { position: 'topright', collapsed: false }).addTo(window._coMap);
                L.control.scale({ imperial: false }).addTo(window._coMap);
                if (has) coSetPin(la, ln, false, true);
                window._coMap.on('click', (e) => coSetPin(e.latlng.lat, e.latlng.lng, false));

        // ---- busca de endereço com lista de sugestões (Brasil) ----
        window._coResults = []; let _coTypeT = null, _coSeq = 0;
        window.coAddrType = function(v) {
            clearTimeout(_coTypeT);
            const box = document.getElementById('co-suggest');
            if (String(v || '').trim().length < 5) { if (box) { box.classList.add('hidden'); box.innerHTML = ''; } return; }
            _coTypeT = setTimeout(() => coSearchList(v, true), 700);
        };
        async function coSearchList(q, silent) {
            q = String(q || '').trim();
            const box = document.getElementById('co-suggest'); if (!box) return;
            const seq = ++_coSeq;
            box.classList.remove('hidden'); box.innerHTML = '<p class="p-3 text-xs text-slate-400">Buscando...</p>';
            const base = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=br&accept-language=pt-BR&dedupe=1';
            // dá preferência (sem restringir) à região em que o mapa/pino já está
            let bias = '';
            if (window._coMap) { const b = window._coMap.getBounds(); const z = window._coMap.getZoom(); if (z >= 11) bias = '&viewbox=' + [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].join(','); }
            const tryQ = async (text, extra) => { const r = await fetch(base + (extra || '') + '&q=' + encodeURIComponent(text)); return r.json(); };
            try {
                let j = await tryQ(q, bias);
                if (!j.length && /\d/.test(q)) {           // número não existe no mapa: busca só a rua
                    const semNum = q.replace(/[,\s-]*\b\d{1,5}\b/, '').trim();
                    if (semNum) { j = await tryQ(semNum, bias); j.forEach(x => x._semNumero = true); }
                }
                if (seq !== _coSeq) return;
                window._coResults = j;
                if (!j.length) { box.innerHTML = '<p class="p-3 text-xs text-slate-500">Nenhum endereço encontrado. Confira o nome e inclua a <b>cidade</b> (ex.: Rua Governador Pedro de Toledo, 500, Piracicaba). Você também pode tocar direto no mapa.</p>'; return; }
                box.innerHTML = j.map((x, i) => {
                    const main = coFormatAddr(x);
                    const sub = (x.display_name || '').split(',').slice(-4).join(',').trim();
                    return '<button type="button" onclick="coPick(' + i + ')" class="w-full text-left px-3 py-2.5 border-b last:border-b-0 hover:bg-slate-50 flex items-start gap-2"><span class="text-base leading-none mt-0.5">📍</span><span class="min-w-0"><span class="block text-xs font-bold text-slate-800">' + esc(main) + '</span><span class="block text-[11px] text-slate-400 truncate">' + esc(sub) + (x._semNumero ? ' • número não encontrado, ajuste o pino' : '') + '</span></span></button>';
                }).join('');
            } catch (_) {
                if (seq !== _coSeq) return;
                box.innerHTML = '<p class="p-3 text-xs text-rose-600">Não foi possível buscar agora. Toque direto no mapa para marcar o local.</p>';
            }
        }

            const name = document.getElementById('p-name').value;
            const duration = parseInt(document.getElementById('p-time').value);
            const price = parseFloat(document.getElementById('p-price').value);

            const description = (document.getElementById('p-desc') || {}).value || '';
            const category = ((document.getElementById('p-cat') || {}).value || '').trim();
            const pdr = (procDraft && procDraft.forId === (editProcedureId || '')) ? procDraft : null;

            if(editProcedureId) {
                let p = t.procedures.find(x => x.id === editProcedureId);
                if(p) {
                    p.name = name; p.duration = duration; p.price = price;
                    p.description = description.trim(); p.category = category;
                    p.photo = (pdr && 'photo' in pdr) ? pdr.photo : (p.photo || '');
                }
            } else {
                t.procedures.push({ id: 'p-' + Date.now(), name, duration, price, description: description.trim(), category, photo: (pdr && pdr.photo) || '' });
            }
            editProcedureId = null;
            procDraft = null;
            saveDB(['procedures']);
        };

        window.deleteProcedure = function(id) {
            showModal('Excluir Serviço', 'Tem certeza que deseja excluir este serviço?', 'error', () => {
                t.procedures = t.procedures.filter(p => p.id !== id);
                saveDB(['procedures']);
            });
        };

        window.cancelarAgendamento = function(id) { updateAppStatus(id, 'cancelado'); };
    </script>
<script>
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
<script>
/* modo noturno/claro: lua (vai para o escuro) e sol (volta para o claro). O botão fica no topo do painel; a escolha fica salva neste aparelho */
(function () {
    var H = document.documentElement;
    var A = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
    var MOON = A + '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    var SUN = A + '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
    function dark() { return H.getAttribute('data-mode') === 'dark'; }
    function paint() { var d = dark(), ttl = d ? 'Modo claro' : 'Modo noturno'; document.querySelectorAll('#mode-toggle').forEach(function (b) { b.innerHTML = d ? SUN : MOON; b.title = ttl; b.setAttribute('aria-label', ttl); }); }
    window.__modeBtn = function () { var d = dark(), ttl = d ? 'Modo claro' : 'Modo noturno'; return '<button id="mode-toggle" type="button" onclick="__toggleMode()" title="' + ttl + '" aria-label="' + ttl + '">' + (d ? SUN : MOON) + '</button>'; };
    window.__toggleMode = function () { var d = dark(); if (d) H.removeAttribute('data-mode'); else H.setAttribute('data-mode', 'dark'); try { localStorage.setItem('painel_mode', d ? 'light' : 'dark'); } catch (e) {} paint(); };
})();
</script>
