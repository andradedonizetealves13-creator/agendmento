            draft.companyLat = lat; draft.companyLng = lng;
            const c = document.getElementById('co-coords'); if (c) c.textContent = 'Pino: ' + lat.toFixed(5) + ', ' + lng.toFixed(5);
            if (!window._coMap) return;
            if (window._coMarker) window._coMarker.setLatLng([lat, lng]);
            else {
                window._coMarker = L.marker([lat, lng], { draggable: true }).addTo(window._coMap);
                window._coMarker.on('dragend', () => { const p = window._coMarker.getLatLng(); coSetPin(p.lat, p.lng, false); });
            }
            if (fly) window._coMap.setView([lat, lng], Math.max(window._coMap.getZoom(), 18));
            if (!noReverse) coReverse(lat, lng);
        }

        let _coRevT = null;
        function coReverse(lat, lng) {
            clearTimeout(_coRevT);
            _coRevT = setTimeout(async () => {
                const box = document.getElementById('co-revaddr'); if (!box) return;
                try {
                    const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=pt-BR&lat=' + lat + '&lon=' + lng);
                    const j = await r.json();
                    if (!j || !j.address) { box.classList.add('hidden'); return; }
                    window._coRevText = coFormatAddr(j);
                    box.innerHTML = '<span class="block font-bold text-slate-700 mb-1">Endereço deste ponto:</span>' + esc(window._coRevText) + '<button type="button" onclick="coUseRevAddr()" class="block mt-1.5 font-bold text-theme-primary">Usar este endereço no campo acima</button>';
                    box.classList.remove('hidden');
                } catch (_) { box.classList.add('hidden'); }
            }, 600);
        }
        window.coUseRevAddr = function() {
            const i = document.getElementById('co-addr'); if (i && window._coRevText) { i.value = window._coRevText; draft.companyAddress = window._coRevText; }
        };
        function coFormatAddr(j) {
            const a = j.address || {};
            const rua = a.road || a.pedestrian || a.footway || a.path || '';
            const num = a.house_number || '';
            const bairro = a.suburb || a.neighbourhood || a.quarter || a.city_district || '';
            const cidade = a.city || a.town || a.village || a.municipality || '';
            const uf = (a['ISO3166-2-lvl4'] || '').replace('BR-', '') || a.state || '';
            const p1 = [rua, num].filter(Boolean).join(', ');
            const out = [p1, bairro, [cidade, uf].filter(Boolean).join(' - ')].filter(Boolean).join(', ');
            return out || (j.display_name || '').split(',').slice(0, 4).join(',').trim();
        }
        window.initCompanyMap = function() {
            const el = document.getElementById('co-map');
            if (window._coMap) { try { window._coMap.remove(); } catch (_) {} window._coMap = null; window._coMarker = null; }
            if (!el) return;
            coLoadLeaflet(() => {
                const el2 = document.getElementById('co-map'); if (!el2 || el2._leaflet_id) return;
                const la = parseFloat(el2.dataset.lat), ln = parseFloat(el2.dataset.lng);
                const has = isFinite(la) && isFinite(ln);
                const ruas = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 20, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO' });
                const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
                const sat = L.layerGroup([
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagens &copy; Esri' }),
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, opacity: 0.9 }),
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 })
                ]);
                window._coMap = L.map(el2, { zoomControl: true, layers: [ruas] }).setView(has ? [la, ln] : [-22.725, -47.649], has ? 18 : 13);
                L.control.layers({ 'Ruas': ruas, 'Satélite': sat, 'OpenStreetMap': osm }, null, { position: 'topright', collapsed: false }).addTo(window._coMap);
                L.control.scale({ imperial: false }).addTo(window._coMap);
                if (has) coSetPin(la, ln, false, true);
                window._coMap.on('click', (e) => coSetPin(e.latlng.lat, e.latlng.lng, false));
                setTimeout(() => { if (window._coMap) window._coMap.invalidateSize(); }, 200);
            });

        window._coResults = []; let _coTypeT = null, _coSeq = 0;
        window.coAddrType = function(v) {
            clearTimeout(_coTypeT);
            const box = document.getElementById('co-suggest');
            if (String(v || '').trim().length < 5) { if (box) { box.classList.add('hidden'); box.innerHTML = ''; } return; }
            _coTypeT = setTimeout(() => coSearchList(v, true), 700);
        };
        async function coSearchList(q, silent) {
            q = String(q || '').trim();
            const box = document.getElementById('co-suggest'); if (!box) return;
            const seq = ++_coSeq;
            box.classList.remove('hidden'); box.innerHTML = '<p class="p-3 text-xs text-slate-400">Buscando...</p>';
            const base = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=br&accept-language=pt-BR&dedupe=1';

            let bias = '';
            if (window._coMap) { const b = window._coMap.getBounds(); const z = window._coMap.getZoom(); if (z >= 11) bias = '&viewbox=' + [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].join(','); }
            const tryQ = async (text, extra) => { const r = await fetch(base + (extra || '') + '&q=' + encodeURIComponent(text)); return r.json(); };
            try {
                let j = await tryQ(q, bias);
                if (!j.length && /\d/.test(q)) {
                    const semNum = q.replace(/[,\s-]*\b\d{1,5}\b/, '').trim();
                    if (semNum) { j = await tryQ(semNum, bias); j.forEach(x => x._semNumero = true); }
                }
                if (seq !== _coSeq) return;
                window._coResults = j;
                if (!j.length) { box.innerHTML = '<p class="p-3 text-xs text-slate-500">Nenhum endereço encontrado. Confira o nome e inclua a <b>cidade</b> (ex.: Rua Governador Pedro de Toledo, 500, Piracicaba). Você também pode tocar direto no mapa.</p>'; return; }
                box.innerHTML = j.map((x, i) => {
                    const main = coFormatAddr(x);
                    const sub = (x.display_name || '').split(',').slice(-4).join(',').trim();
                    return '<button type="button" onclick="coPick(' + i + ')" class="w-full text-left px-3 py-2.5 border-b last:border-b-0 hover:bg-slate-50 flex items-start gap-2"><span class="text-base leading-none mt-0.5">📍</span><span class="min-w-0"><span class="block text-xs font-bold text-slate-800">' + esc(main) + '</span><span class="block text-[11px] text-slate-400 truncate">' + esc(sub) + (x._semNumero ? ' • número não encontrado, ajuste o pino' : '') + '</span></span></button>';
                }).join('');
            } catch (_) {
                if (seq !== _coSeq) return;
                box.innerHTML = '<p class="p-3 text-xs text-rose-600">Não foi possível buscar agora. Toque direto no mapa para marcar o local.</p>';
            }
        }

    var IC = {
        chev: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
        cal: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>',
        clk: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
        l: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
        r: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
        ok: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>'
    };
    var pop, scrim, cur = null;
    var p2 = function (n) { return String(n).padStart(2, '0'); };
    var ymd = function (d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
    var parse = function (s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

    function ensure() {
        if (pop) return;
        scrim = document.createElement('div'); scrim.className = 'gp-scrim'; scrim.addEventListener('pointerdown', close);
        pop = document.createElement('div'); pop.className = 'gp-pop'; pop.setAttribute('role', 'dialog');
        document.body.appendChild(scrim); document.body.appendChild(pop);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && cur) { close(); } });
        addEventListener('resize', function () { if (cur) place(); });
    }
    function close() {
        if (!cur) return; var t = cur.trig; cur = null;
        pop.classList.remove('on'); scrim.classList.remove('on'); t.setAttribute('aria-expanded', 'false'); t.classList.remove('open');
    }
    function place() {
        var r = cur.trig.getBoundingClientRect(), w = innerWidth, h = innerHeight;
        pop.style.cssText = '';
        if (w < 640) { pop.classList.add('sheet'); return; }
        pop.classList.remove('sheet');
        var pw = pop.offsetWidth, ph = pop.offsetHeight;
        var left = Math.min(Math.max(8, r.left), w - pw - 8);
        var top = r.bottom + 8; if (top + ph > h - 8) top = Math.max(8, r.top - ph - 8);
        pop.style.left = left + 'px'; pop.style.top = top + 'px';
        if (cur.kind === 'select') pop.style.minWidth = Math.max(r.width, 180) + 'px';
    }
    function show(kind, el, trig, html, bind) {
        ensure(); if (cur) close();
        cur = { kind: kind, el: el, trig: trig };
        pop.className = 'gp-pop gp-' + kind; pop.innerHTML = html; bind(pop);
        place(); scrim.classList.add('on'); requestAnimationFrame(function () { pop.classList.add('on'); place(); });
        trig.setAttribute('aria-expanded', 'true'); trig.classList.add('open');
    }
    function commit(el, v) {
        var proto = el.tagName === 'SELECT' ? HTMLSelectElement.prototype : HTMLInputElement.prototype;
        Object.getOwnPropertyDescriptor(proto, 'value').set.call(el, v);
        el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true }));
        if (el.__gpSync) el.__gpSync();
    }

    /* ---------- data ---------- */
    function openDate(el, trig) {
        var sel = parse(el.value), base = sel || new Date(), vy = base.getFullYear(), vm = base.getMonth(), mode = 'days';
        var min = parse(el.min), max = parse(el.max), today = ymd(new Date());
        function draw() {
            var h = '<div class="gp-head"><button type="button" class="gp-nav" data-a="prev" aria-label="Anterior">' + IC.l + '</button><button type="button" class="gp-title" data-a="mode">' + (mode === 'days' ? MES[vm] + ' ' + vy : vy) + '</button><button type="button" class="gp-nav" data-a="next" aria-label="Próximo">' + IC.r + '</button></div>';
            if (mode === 'months') {
                h += '<div class="gp-months">' + MES.map(function (m, i) { return '<button type="button" data-m="' + i + '" class="' + (sel && sel.getFullYear() === vy && sel.getMonth() === i ? 'on' : '') + '">' + m.slice(0, 3) + '</button>'; }).join('') + '</div>';
            } else {
                var first = new Date(vy, vm, 1).getDay(), n = new Date(vy, vm + 1, 0).getDate();
                h += '<div class="gp-week">' + SEM.map(function (s) { return '<span>' + s + '</span>'; }).join('') + '</div><div class="gp-days">';
                for (var i = 0; i < first; i++) h += '<i></i>';
                for (var d = 1; d <= n; d++) {
                    var dt = new Date(vy, vm, d), k = ymd(dt), off = (min && dt < min) || (max && dt > max);
                    h += '<button type="button" data-d="' + k + '"' + (off ? ' disabled' : '') + ' class="' + (sel && ymd(sel) === k ? 'on ' : '') + (k === today ? 'today' : '') + '">' + d + '</button>';
                }
                h += '</div>';
            }
            h += '<div class="gp-foot"><button type="button" data-a="today">Hoje</button>' + (el.required ? '' : '<button type="button" data-a="clear">Limpar</button>') + '</div>';
            pop.innerHTML = h;
        }
        show('date', el, trig, '', function () {
            draw();
            pop.onclick = function (e) {
                var b = e.target.closest('button'); if (!b || b.disabled) return;
                var a = b.dataset.a;
                if (b.dataset.d) { sel = parse(b.dataset.d); commit(el, b.dataset.d); close(); return; }
                if (b.dataset.m) { vm = +b.dataset.m; mode = 'days'; draw(); return; }
                if (a === 'mode') { mode = mode === 'days' ? 'months' : 'days'; draw(); }
                else if (a === 'prev') { if (mode === 'months') vy--; else { vm--; if (vm < 0) { vm = 11; vy--; } } draw(); }
                else if (a === 'next') { if (mode === 'months') vy++; else { vm++; if (vm > 11) { vm = 0; vy++; } } draw(); }
                else if (a === 'today') { commit(el, today); close(); }
                else if (a === 'clear') { commit(el, ''); close(); }
            };
        });
    }

    /* ---------- hora ---------- */
    function openTime(el, trig) {
        var v = /^(\d{1,2}):(\d{2})/.exec(el.value || ''), H = v ? +v[1] : 9, M = v ? +v[2] : 0;
        var st = parseInt(el.step, 10); var step = st > 0 ? Math.max(1, Math.round(st / 60)) : 5;
        var mins = []; for (var m = 0; m < 60; m += step) mins.push(m); if (mins.indexOf(M) < 0) { mins.push(M); mins.sort(function (a, b) { return a - b; }); }
        var html = '<div class="gp-tcols"><div class="gp-col" data-c="h">' + Array.from({ length: 24 }, function (_, i) { return '<button type="button" data-h="' + i + '" class="' + (i === H ? 'on' : '') + '">' + p2(i) + '</button>'; }).join('') + '</div><span class="gp-colon">:</span><div class="gp-col" data-c="m">' + mins.map(function (i) { return '<button type="button" data-n="' + i + '" class="' + (i === M ? 'on' : '') + '">' + p2(i) + '</button>'; }).join('') + '</div></div>' +
            '<div class="gp-foot"><input class="gp-type" inputmode="numeric" maxlength="5" placeholder="HH:MM" aria-label="Digitar horário" value="' + p2(H) + ':' + p2(M) + '"><button type="button" data-a="now">Agora</button><button type="button" class="gp-okb" data-a="ok">' + IC.ok + ' OK</button></div>';
        show('time', el, trig, html, function () {
            var typed = pop.querySelector('.gp-type');
            var mark = function () {
                pop.querySelectorAll('[data-h]').forEach(function (b) { b.classList.toggle('on', +b.dataset.h === H); });
                pop.querySelectorAll('[data-n]').forEach(function (b) { b.classList.toggle('on', +b.dataset.n === M); });
                typed.value = p2(H) + ':' + p2(M);
            };
            var apply = function () { commit(el, p2(H) + ':' + p2(M)); mark(); };
            pop.querySelectorAll('.gp-col').forEach(function (c) { var on = c.querySelector('.on'); if (on) c.scrollTop = on.offsetTop - c.clientHeight / 2 + 17; });
            pop.onclick = function (e) {
                var b = e.target.closest('button'); if (!b) return;
                if (b.dataset.h != null) { H = +b.dataset.h; apply(); }
                else if (b.dataset.n != null) { M = +b.dataset.n; apply(); }
                else if (b.dataset.a === 'now') { var d = new Date(); H = d.getHours(); M = Math.round(d.getMinutes() / step) * step; if (M > 59) M = 55; apply(); }
                else if (b.dataset.a === 'ok') close();
            };
            typed.oninput = function () {
                var d = typed.value.replace(/\D/g, '').slice(0, 4); if (d.length > 2) d = d.slice(0, 2) + ':' + d.slice(2); typed.value = d;
                var mm = /^(\d{2}):(\d{2})$/.exec(d); if (mm && +mm[1] < 24 && +mm[2] < 60) { H = +mm[1]; M = +mm[2]; commit(el, d); pop.querySelectorAll('[data-h]').forEach(function (b) { b.classList.toggle('on', +b.dataset.h === H); }); pop.querySelectorAll('[data-n]').forEach(function (b) { b.classList.toggle('on', +b.dataset.n === M); }); }
            };
            typed.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); close(); } };
        });
    }

    /* ---------- lista ---------- */
    function openSelect(el, trig) {
        var opts = Array.from(el.options), html = '<div class="gp-list custom-scrollbar">' + opts.map(function (o, i) {
            return '<button type="button" data-i="' + i + '"' + (o.disabled ? ' disabled' : '') + ' class="' + (el.selectedIndex === i ? 'on' : '') + '"><span>' + esc(o.textContent) + '</span>' + (el.selectedIndex === i ? IC.ok : '') + '</button>';
        }).join('') + '</div>';
        show('select', el, trig, html, function () {
            var on = pop.querySelector('.on'); var l = pop.querySelector('.gp-list'); if (on) l.scrollTop = on.offsetTop - l.clientHeight / 2 + 20;
            pop.onclick = function (e) { var b = e.target.closest('button'); if (!b || b.disabled) return; commit(el, opts[+b.dataset.i].value); close(); };
        });
    }

    /* ---------- upgrade dos campos ---------- */
    function label(el) {
        if (el.tagName === 'SELECT') { var o = el.options[el.selectedIndex]; return o ? o.textContent.trim() : ''; }
        var v = el.value; if (!v) return '';
        if (el.type === 'date') { var d = parse(v); return d ? p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() : v; }
        return v;
    }
    function enhance(el) {
        if (el.dataset.gp || el.multiple || el.size > 1 || el.hasAttribute('data-gp-off') || !el.parentNode) return;
        el.dataset.gp = '1';
        var kind = el.tagName === 'SELECT' ? 'select' : el.type;
        var btn = document.createElement('button'); btn.type = 'button';
        btn.className = (el.className + ' gp-trigger').trim(); if (el.getAttribute('style')) btn.setAttribute('style', el.getAttribute('style'));
        btn.setAttribute('aria-haspopup', 'dialog'); btn.setAttribute('aria-expanded', 'false');
        var ic = kind === 'date' ? IC.cal : kind === 'time' ? IC.clk : IC.chev;
        var sync = function () {
            var t = label(el); btn.innerHTML = '<span class="gp-val' + (t ? '' : ' empty') + '">' + (t ? esc(t) : 'Selecionar') + '</span><span class="gp-ico">' + ic + '</span>';
            btn.disabled = el.disabled; btn.style.display = el.style.display === 'none' || el.hidden ? 'none' : '';
        };
        el.__gpSync = sync; el.classList.add('gp-native'); el.tabIndex = -1; el.setAttribute('aria-hidden', 'true');
        el.parentNode.insertBefore(btn, el); sync();
        var proto = el.tagName === 'SELECT' ? HTMLSelectElement.prototype : HTMLInputElement.prototype, d = Object.getOwnPropertyDescriptor(proto, 'value');
        Object.defineProperty(el, 'value', { configurable: true, get: function () { return d.get.call(this); }, set: function (v) { d.set.call(this, v); sync(); } });
        if (el.tagName === 'SELECT') { var di = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'selectedIndex'); Object.defineProperty(el, 'selectedIndex', { configurable: true, get: function () { return di.get.call(this); }, set: function (v) { di.set.call(this, v); sync(); } }); }
        new MutationObserver(sync).observe(el, { childList: true, subtree: true, attributes: true, attributeFilter: ['disabled', 'min', 'max', 'hidden', 'style'] });
        el.addEventListener('change', sync);
        btn.addEventListener('click', function () { if (cur && cur.trig === btn) return close(); (kind === 'date' ? openDate : kind === 'time' ? openTime : openSelect)(el, btn); });
        el.addEventListener('invalid', function (e) { e.preventDefault(); btn.classList.add('gp-bad'); btn.focus(); setTimeout(function () { btn.classList.remove('gp-bad'); }, 1400); });
        el.addEventListener('focus', function () { btn.focus(); });
    }
    function scan() { document.querySelectorAll('input[type=date]:not([data-gp]),input[type=time]:not([data-gp]),select:not([data-gp])').forEach(enhance); }
    var q = 0;
    new MutationObserver(function () { if (q) return; q = requestAnimationFrame(function () { q = 0; scan(); }); }).observe(document.documentElement, { childList: true, subtree: true });
    scan();
})();
</script>
