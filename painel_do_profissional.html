                                        <input type="time" id="ewh-s-${i}" value="${empWh[i] ? empWh[i].start : '09:00'}" class="px-2 py-1 border rounded-lg text-xs bg-white">
                                        <span class="text-[10px] text-slate-400">até</span>
                                        <input type="time" id="ewh-e-${i}" value="${empWh[i] ? empWh[i].end : '18:00'}" class="px-2 py-1 border rounded-lg text-xs bg-white">
                                    </div>
                                </div>`).join('')}
                        </div>
                    </div>` : '';
                return `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 fade-in"><div class="bg-white/90 backdrop-blur-md p-6 rounded-2xl border shadow-sm h-fit"><h3 class="font-bold text-lg mb-4">${empToEdit ? 'Editar' : 'Adicionar'} Profissional</h3><form onsubmit="saveEmployee(event)" class="space-y-4"><div><label class="block text-xs font-semibold mb-1">Nome</label><input type="text" id="e-name" value="${esc(empToEdit?empToEdit.name:'')}" required class="w-full px-4 py-3 border rounded-xl text-sm outline-none"></div><div><label class="block text-xs font-semibold mb-1">E-mail</label><input type="email" id="e-email" value="${esc(empToEdit?empToEdit.email:'')}" required class="w-full px-4 py-3 border rounded-xl text-sm outline-none"></div><div><label class="block text-xs font-semibold mb-1">Telefone / WhatsApp * (DDD + 9 dígitos)</label><input type="tel" id="e-phone" value="${esc(empToEdit?(empToEdit.phone||''):'')}" required placeholder="(00) 00000-0000" oninput="formatPhoneInput(this)" class="w-full px-4 py-3 border rounded-xl text-sm outline-none"></div><div><label class="block text-xs font-semibold mb-1">${empToEdit?'Nova Senha (opcional)':'Senha'}</label><input type="password" id="e-pass" ${empToEdit?'':'required'} class="w-full px-4 py-3 border rounded-xl text-sm outline-none"></div><div><label class="block text-xs font-semibold mb-1">Repita a Senha</label><input type="password" id="e-pass2" ${empToEdit?'':'required'} class="w-full px-4 py-3 border rounded-xl text-sm outline-none"></div><div><label class="block text-xs font-semibold mb-2">Serviços</label><div class="space-y-2 max-h-48 overflow-y-auto border p-3 rounded-xl bg-slate-50">${t.procedures.map(p=>`<label class="flex items-center space-x-3 text-sm p-2 bg-white rounded-lg border cursor-pointer"><input type="checkbox" value="${p.id}" class="proc-check w-5 h-5" ${empToEdit&&empToEdit.procedures&&empToEdit.procedures.includes(p.id)?'checked':''}><span class="font-medium">${esc(p.name)}</span></label>`).join('')}</div></div>${whGrid}<div class="flex space-x-3 mt-6">${empToEdit?`<button type="button" onclick="editEmployeeId=null;render()" class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl text-sm font-bold">Cancelar</button>`:''}<button type="submit" class="flex-1 btn-theme-primary py-3 rounded-xl text-sm font-bold">Salvar</button></div></form></div><div class="bg-white/90 backdrop-blur-md p-6 rounded-2xl border shadow-sm"><h3 class="font-bold text-lg mb-4">Profissionais</h3><div class="space-y-3">${t.employees.map((e, idx)=>`<div class="p-4 border rounded-xl flex justify-between items-center bg-slate-50"><div class="flex items-center space-x-4"><div class="w-3 h-10 rounded-full" style="background-color:${e.color}"></div><div><p class="font-bold text-sm text-slate-900">${esc(e.name)}</p><p class="text-xs text-slate-500">${esc(e.email)}${e.phone ? ' • ' + esc(e.phone) : ' • <span class="text-rose-600 font-bold">sem telefone</span>'}</p></div></div><button onclick="editEmployeeId='${e.id}';render()" class="text-xs font-bold text-theme-primary px-4 py-2 bg-theme-secondary rounded-lg">Editar</button></div>`).join('')}</div></div></div>`;
            }

            if(role === 'admin' && activeTab === 'procedures') {
                const procToEdit = editProcedureId ? t.procedures.find(p=>p.id===editProcedureId) : null;
                return `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 fade-in">
                        <div class="bg-white/90 backdrop-blur-md p-6 rounded-2xl border shadow-sm h-fit">

                            <form onsubmit="saveProcedure(event)" class="space-y-4">

                                    <div><label class="block text-xs font-semibold mb-1">Duração (min)</label><input type="number" id="p-time" value="${procToEdit?procToEdit.duration:''}" required min="5" step="5" class="w-full px-4 py-3 border rounded-xl text-sm outline-none"></div>

            if(role === 'admin' && activeTab === 'clients') {
                const stats = {};
                (t.appointments || []).forEach(a => {
                    if (!isBusyApp(a)) return;
                    const s = stats[a.clientId] || (stats[a.clientId] = { total: 0, last: '' });
                    s.total++; if (a.date > s.last) s.last = a.date;
                });
                const lista = t.clients.map(semSenha).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'pt-BR'));   // senha nunca chega à tela
                return `
                <div class="max-w-5xl mx-auto space-y-4 fade-in">
                    <div class="bg-white/90 backdrop-blur-md p-4 rounded-2xl border shadow-sm flex flex-col sm:flex-row gap-3 sm:items-center justify-between">

                    <form id="client-form" onsubmit="saveClient(event)" class="hidden bg-white/90 backdrop-blur-md p-5 rounded-2xl border shadow-sm grid grid-cols-1 md:grid-cols-2 gap-3">

                        <input type="password" id="c-pass" required placeholder="Senha" class="px-4 py-3 border rounded-xl text-sm outline-none">

                    <div class="bg-white/90 backdrop-blur-md rounded-2xl border shadow-sm overflow-hidden">

                        ${lista.map(c => {

                                <div class="flex-1 min-w-0">
                                    <p class="font-bold text-sm text-slate-900 truncate">${esc(c.name)} ${c.blocked ? '<span class="text-[10px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded font-bold ml-1">Bloqueado</span>' : ''}</p>
                                    <p class="text-xs text-slate-500 truncate">${esc(c.email)}${c.phone ? ' • ' + esc(c.phone) : ''}</p>
                                </div>
                                <div class="hidden md:block text-right w-40">
                                    <p class="text-sm font-bold text-slate-800">${s.total}</p>

                                </div>
                                <button onclick="toggleBlockClient('${esc(c.id)}')" class="text-xs font-bold px-4 py-2 rounded-lg border shrink-0 ${c.blocked ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200'}">${c.blocked ? 'Desbloquear' : 'Bloquear'}</button>
                            </div>`;

        window.filterClients = function(q) {
            q = q.toLowerCase().trim(); let n = 0;
            document.querySelectorAll('.client-row').forEach(r => {
                const ok = !q || r.dataset.search.includes(q);
                r.style.display = ok ? '' : 'none'; if (ok) n++;
            });
            document.getElementById('client-count').textContent = n;
            document.getElementById('client-empty').classList.toggle('hidden', n > 0);

        window.selectThemePalette = function(paletteId) {

            applyThemeCSS(paletteId);
            saveDB(['themePalette']);
            render();

        // ---------- FUNDO (rascunho até clicar em Salvar Fundo) ----------
        window.handleBgUpload = function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                draft[bgK('Image')] = ev.target.result;
                if (bgGet(bgK('Opacity')) === undefined || bgGet(bgK('Opacity')) === null) draft[bgK('Opacity')] = 0.35;
                if (bgGet(bgK('Blur')) === undefined || bgGet(bgK('Blur')) === null) draft[bgK('Blur')] = 0;
                // imagem nova começa centralizada e sem zoom
                draft[bgK('PosX')] = 50; draft[bgK('PosY')] = 50; draft[bgK('Zoom')] = 100;
                render();
            };
            reader.readAsDataURL(file);
        };
        window.removeBgImage = function() { draft[bgK('Image')] = null; render(); };
        window.updateBgOpacity = function(val) {
            draft[bgK('Opacity')] = parseFloat(val);
            const p = document.getElementById('preview-bg-box'); if (p) p.style.opacity = val;
            const l = document.getElementById('opacity-val-label'); if (l) l.innerText = Math.round(val * 100) + '%';
        };
        window.updateBgBlur = function(val) {
            draft[bgK('Blur')] = parseInt(val);
            const p = document.getElementById('preview-bg-box'); if (p) p.style.filter = `blur(${val}px)`;
            const l = document.getElementById('blur-val-label'); if (l) l.innerText = val + 'px';
        };
        window.updateBgPos = function(axis, val) {
            draft[bgK(axis)] = parseFloat(val);
            refreshPreviewDom();
        };
        window.updateBgZoom = function(val) {
            draft[bgK('Zoom')] = parseFloat(val);
            refreshPreviewDom();
        };
        window.resetBgAdjust = function() {
            draft[bgK('PosX')] = 50; draft[bgK('PosY')] = 50; draft[bgK('Zoom')] = 100;
            refreshPreviewDom();
        };
        window.setBgApplyPanel = function(checked) { draft.bgApplyPanel = !!checked; };
        window.salvarFundo = function() {
            const keys = BG_KEYS.filter(k => k in draft);
            keys.forEach(k => { t[k] = draft[k]; delete draft[k]; });
            if (keys.length) saveDB(keys);
            applyBgImageSettings(); render();
            showModal('Salvo!', 'Plano de fundo atualizado.', 'success');
        };

        // ---------- DASHBOARD ----------
        function renderDashboardAnalytics(role, user) {
            const meses = [{v:'01',n:'Janeiro'},{v:'02',n:'Fevereiro'},{v:'03',n:'Março'},{v:'04',n:'Abril'},{v:'05',n:'Maio'},{v:'06',n:'Junho'},{v:'07',n:'Julho'},{v:'08',n:'Agosto'},{v:'09',n:'Setembro'},{v:'10',n:'Outubro'},{v:'11',n:'Novembro'},{v:'12',n:'Dezembro'}];
            const isActive = (a) => isBusyApp(a);
            
            let apps = t.appointments || [];
            if(role === 'employee') apps = apps.filter(a => a.employeeId === user.id);

            const filteredApps = apps.filter(a => {
                const [y, m] = a.date.split('-');
                return m === dashboardFilterMonth && y === dashboardFilterYear;
            });

            const completedApps = filteredApps.filter(a => getEffectiveAppStatus(a) === 'realizado');
            const canceledApps = filteredApps.filter(a => getEffectiveAppStatus(a) === 'cancelado');
            const noShowApps = filteredApps.filter(a => getEffectiveAppStatus(a) === 'nao_compareceu');
            const upcomingApps = filteredApps.filter(a => getEffectiveAppStatus(a) === 'agendado');
            const depReceivedApps = filteredApps.filter(a => a.depositRequired && ['agendado', 'realizado', 'nao_compareceu'].includes(a.status));
            const depReceived = depReceivedApps.reduce((sum, a) => sum + (Number(a.depositPaid != null ? a.depositPaid : a.depositAmount) || 0), 0);
            const depPendingApps = filteredApps.filter(a => getEffectiveAppStatus(a) === 'pendente');
            const depPendingVal = depPendingApps.reduce((sum, a) => sum + (Number(a.depositAmount) || 0), 0);
            const depExpiredCount = filteredApps.filter(a => getEffectiveAppStatus(a) === 'expirado').length;
            const depRestToReceive = filteredApps.filter(a => a.depositRequired && getEffectiveAppStatus(a) === 'agendado').reduce((sum, a) => sum + Math.max(0, (Number(a.totalPrice) || 0) - (Number(a.depositPaid != null ? a.depositPaid : a.depositAmount) || 0)), 0);

            const totalRevenue = completedApps.reduce((s, a) => s + (a.totalPrice || 0), 0);
            const avgTicket = completedApps.length ? totalRevenue / completedApps.length : 0;
            const pctOf = (n) => filteredApps.length ? (n / filteredApps.length * 100) : 0;

            // comparação com o mês anterior
            let pm = parseInt(dashboardFilterMonth) - 1, py = parseInt(dashboardFilterYear);
            if (pm === 0) { pm = 12; py--; }
            const pmStr = String(pm).padStart(2, '0');
            const prevRevenue = apps.filter(a => { const [y, m] = a.date.split('-'); return m === pmStr && y === String(py) && getEffectiveAppStatus(a) === 'realizado'; })
                .reduce((s, a) => s + (a.totalPrice || 0), 0);
            const delta = prevRevenue > 0 ? ((totalRevenue - prevRevenue) / prevRevenue * 100) : null;
            const deltaHtml = delta === null
                ? `<p class="text-[11px] text-slate-400 mt-0.5">Sem dados no mês anterior</p>`
                : `<p class="text-[11px] font-bold mt-0.5 ${delta >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta).toFixed(1)}% <span class="text-slate-400 font-medium">vs mês anterior (${brl(prevRevenue)})</span></p>`;

            // por serviço (quantidade e faturamento estimado pelo preço atual)
            const procStats = {};
            t.procedures.forEach(p => { procStats[p.name] = 0; });
            completedApps.forEach(a => {
                (a.proceduresNames || []).forEach(pName => {
                    procStats[pName] = (procStats[pName] || 0) + 1;
                });
            });
            const priceByName = {}; t.procedures.forEach(p => { priceByName[p.name] = p.price; });
            const procRows = Object.keys(procStats).map(n => ({ name: n, count: procStats[n], revenue: procStats[n] * (priceByName[n] || 0) })).sort((a, b) => b.count - a.count);

            // por profissional
            const staffStats = {};
            if(role === 'admin') {
                t.employees.forEach(e => {
                    staffStats[e.id] = { name: e.name, canceled: 0, noShow: 0, completed: 0, revenue: 0, scheduled: 0 };
                });
                staffStats[t.admin.id] = { name: t.admin.name, canceled: 0, noShow: 0, completed: 0, revenue: 0, scheduled: 0 };

                filteredApps.forEach(a => {
                    if(!staffStats[a.employeeId]) return;
                    const st = getEffectiveAppStatus(a);
                    const S = staffStats[a.employeeId];
                    if(st === 'cancelado') S.canceled++;
                    else if(st === 'nao_compareceu') S.noShow++;
                    else if(st === 'realizado') { S.completed++; S.revenue += (a.totalPrice || 0); }
                    else S.scheduled++;
                });
            }

            // faturamento por dia
            const [fy, fm] = [parseInt(dashboardFilterYear), parseInt(dashboardFilterMonth)];
            const daysInMonth = new Date(fy, fm, 0).getDate();
            const revByDay = Array(daysInMonth).fill(0);
            completedApps.forEach(a => { const d = parseInt(a.date.split('-')[2]); if (d >= 1 && d <= daysInMonth) revByDay[d - 1] += (a.totalPrice || 0); });
            const maxDay = Math.max(1, ...revByDay);

            // horários e dias de pico (todos os agendamentos ativos do mês)
            const activeMonth = filteredApps.filter(isActive);
            const byHour = {}; const byWeekday = Array(7).fill(0);
            activeMonth.forEach(a => {
                const h = a.time.split(':')[0]; byHour[h] = (byHour[h] || 0) + 1;
                const [y, m, d] = a.date.split('-'); byWeekday[new Date(y, m - 1, d).getDay()]++;
            });
            const hourKeys = Object.keys(byHour).sort();
            const maxHour = Math.max(1, ...Object.values(byHour));
            const maxWd = Math.max(1, ...byWeekday);
            const wdNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

            // clientes novos x recorrentes
            const keyOf = (a) => (a.clientId && !String(a.clientId).startsWith('manual-cli-')) ? a.clientId : (a.clientName || '').toLowerCase();
            const monthStart = `${dashboardFilterYear}-${dashboardFilterMonth}-01`;
            const before = new Set(apps.filter(a => isActive(a) && a.date < monthStart).map(keyOf));
            const monthKeys = new Set(activeMonth.map(keyOf));
            let novos = 0, recorrentes = 0;
            monthKeys.forEach(k => before.has(k) ? recorrentes++ : novos++);

            const card = (icon, color, label, value, extra = '') => `
                <div class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border shadow-sm flex items-center space-x-4">
                    <div class="w-12 h-12 ${color} rounded-2xl flex items-center justify-center font-bold shrink-0"><i data-lucide="${icon}" class="w-6 h-6"></i></div>
                    <div class="min-w-0">
                        <p class="text-xs text-slate-400 font-bold uppercase">${label}</p>
                        <h3 class="text-2xl font-black text-slate-800 mt-0.5">${value}</h3>
                        ${extra}
                    </div>
                </div>`;

            return `
                <div class="space-y-6 fade-in max-w-6xl mx-auto">
                    <div class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800">Dashboard de Desempenho</h2>
                            <p class="text-xs text-slate-500">${role === 'admin' ? 'Visão consolidada da empresa' : 'Visão dos seus atendimentos pessoais'}</p>
                        </div>
                        <div class="flex items-center space-x-3 self-start sm:self-auto">
                            <select onchange="dashboardFilterMonth=this.value; render()" class="px-4 py-2.5 bg-slate-50 border rounded-xl text-sm font-bold text-slate-800 outline-none">
                                ${meses.map(m => `<option value="${m.v}" ${dashboardFilterMonth===m.v?'selected':''}>${m.n}</option>`).join('')}
                            </select>
                            <input type="number" value="${dashboardFilterYear}" min="2020" max="2030" onchange="dashboardFilterYear=this.value; render()" class="w-24 px-3 py-2.5 bg-slate-50 border rounded-xl text-sm font-bold text-slate-800 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${card('wallet', 'bg-emerald-50 text-emerald-600', 'Faturamento Total', `<span class="text-emerald-600">${brl(totalRevenue)}</span>`, deltaHtml)}
                        ${card('check-circle', 'bg-theme-secondary text-theme-primary', 'Atendimentos Concluídos', completedApps.length)}
                        ${card('user-x', 'bg-amber-50 text-amber-600', 'Não Compareceram', `<span class="text-amber-600">${noShowApps.length}</span>`)}
                        ${card('x-circle', 'bg-rose-50 text-rose-600', 'Cancelamentos', `<span class="text-rose-600">${canceledApps.length}</span>`)}
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${card('calendar-clock', 'bg-sky-50 text-sky-600', 'A Realizar no Mês', upcomingApps.length)}
                        ${card('receipt', 'bg-emerald-50 text-emerald-600', 'Ticket Médio', brl(avgTicket))}
                        ${card('percent', 'bg-rose-50 text-rose-600', 'Taxa de Cancelamento', pctOf(canceledApps.length).toFixed(1) + '%')}
                        ${card('percent', 'bg-amber-50 text-amber-600', 'Taxa de Faltas', pctOf(noShowApps.length).toFixed(1) + '%')}
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${card('wallet', 'bg-emerald-50 text-emerald-600', 'Sinal recebido no mês', `<span class="text-emerald-600">${brl(depReceived)}</span>`, `<p class="text-[11px] text-slate-400 mt-1">${depReceivedApps.length} agendamento(s) com sinal</p>`)}
                        ${card('hourglass', 'bg-amber-50 text-amber-600', 'Sinais pendentes', `<span class="text-amber-600">${depPendingApps.length}</span>`, `<p class="text-[11px] text-slate-400 mt-1">${brl(depPendingVal)} aguardando${depExpiredCount ? ' • ' + depExpiredCount + ' expirado(s)' : ''}</p>`)}
                        ${card('banknote', 'bg-sky-50 text-sky-600', 'Restante a receber', brl(depRestToReceive), `<p class="text-[11px] text-slate-400 mt-1">dos agendados com sinal pago</p>`)}
                    </div>

                    <div class="bg-white/90 backdrop-blur-md p-6 rounded-2xl border shadow-sm">
                        <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center"><i data-lucide="bar-chart-3" class="w-5 h-5 mr-2 text-theme-primary"></i> Faturamento por Dia</h3>
                        <div class="overflow-x-auto custom-scrollbar pb-2">
                            <div class="flex items-end gap-1 h-36 min-w-[560px]">
                                ${revByDay.map((v, i) => `
                                    <div class="flex-1 h-full flex flex-col justify-end items-center" title="Dia ${i + 1}: ${brl(v)}">
                                        <div class="w-full rounded-t-md" style="height:${v > 0 ? Math.max(v / maxDay * 100, 4) : 0}%; background:var(--theme-primary); opacity:${v > 0 ? 1 : 0.15}"></div>
                                    </div>`).join('')}
                            </div>
                            <div class="flex gap-1 min-w-[560px] mt-1">
                                ${revByDay.map((v, i) => `<span class="flex-1 text-center text-[9px] text-slate-400 font-medium">${i + 1}</span>`).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="bg-white/90 backdrop-blur-md p-6 rounded-2xl border shadow-sm">
                        <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center justify-between">
                            <span class="flex items-center"><i data-lucide="list" class="w-5 h-5 mr-2 text-theme-primary"></i> Agendamentos do Mês (${filteredApps.length})</span>
                            <span class="text-xs text-slate-400 font-normal">Status atualizados em tempo real</span>
                        </h3>
                        <div class="space-y-3 max-h-80 overflow-y-auto custom-scrollbar pr-2">
                            ${filteredApps.length === 0 ? '<p class="text-xs text-slate-400 py-4 text-center">Nenhum agendamento encontrado para este mês.</p>' : filteredApps.map(a => {
                                const st = getEffectiveAppStatus(a);
                                const emp = a.employeeId === t.admin.id ? t.admin : (t.employees || []).find(e=>e.id===a.employeeId);
                                const empName = emp ? emp.name : 'Profissional';
                                
                                let statusBadge = `<span class="bg-theme-secondary text-theme-primary border text-[10px] font-bold px-2.5 py-1 rounded-full">Agendado</span>`;
                                if (st === 'realizado') statusBadge = `<span class="bg-emerald-50 text-emerald-700 border-emerald-200 border text-[10px] font-bold px-2.5 py-1 rounded-full">Concluído</span>`;
                                else if (st === 'expirado') statusBadge = `<span class="bg-slate-100 text-slate-600 border-slate-300 border text-[10px] font-bold px-2.5 py-1 rounded-full">Sinal expirado</span>`;
                                else if (st === 'cancelado') statusBadge = `<span class="bg-rose-50 text-rose-700 border-rose-200 border text-[10px] font-bold px-2.5 py-1 rounded-full">Cancelado</span>`;
                                else if (st === 'pendente') statusBadge = `<span class="bg-amber-100 text-amber-800 border-amber-300 border border-dashed text-[10px] font-bold px-2.5 py-1 rounded-full">⏳ Pendente</span>`;
                                else if (st === 'nao_compareceu') statusBadge = `<span class="bg-amber-50 text-amber-700 border-amber-200 border text-[10px] font-bold px-2.5 py-1 rounded-full">Não Compareceu</span>`;

                                return `
                                    <div class="p-3.5 bg-slate-50 border rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-white transition-colors">
                                        <div class="flex items-start space-x-3">

                    if(req.type === 'folga') emp.exceptions[req.date] = { type: 'folga' };
                    else emp.exceptions[req.date] = { type: 'plantao', start: req.start, end: req.end };
                    saveDB(['employees']);

            }

                .catch(() => showModal('Erro de conexão', 'Não foi possível atualizar a solicitação. Tente novamente.', 'error'));

                            }).join('')}
                            
                            <div class="flex flex-col border-r bg-slate-50">
                                ${hours.map(h => `<div class="calendar-time-col h-[51px] border-b pt-1">${h}</div>`).join('')}
                            </div>

                            ${weekDays.map((d, dayIdx) => {
                                const dateStr = localDateStr(d);
                                const isWorking = doesEmployeeWorkOnDate(currentProfile, dateStr);
                                const nowLine = (dateStr === todayStrNow && nowInRange) ? `<div class="absolute left-0 right-0 z-20 pointer-events-none" style="top:${(nowM - CAL_START_HOUR * 60) / 60 * 51}px; height:2px; background:#ef4444;"><span class="absolute -left-1 -top-[3px] w-2 h-2 rounded-full bg-red-500"></span></div>` : '';
                                return `
                                    <div data-date="${dateStr}" class="calendar-day-column border-r relative ${isWorking?'bg-white':'bg-slate-200 opacity-60 pointer-events-none'}" style="height: ${hours.length * 51}px;">
                                        ${hours.map(() => `<div class="h-[51px] border-b border-slate-100/80"></div>`).join('')}
                                        ${nowLine}
                                        ${(postitsHtmlByDay[dayIdx] || []).join('')}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        window.showAppDetails = function(appId) {
            const app = t.appointments.find(a => a.id === appId); if(!app) return;
            const emp = app.employeeId === t.admin.id ? t.admin : t.employees.find(e => e.id === app.employeeId);
            const reschedInfo = app.rescheduledAt ? (() => { const d = new Date(app.rescheduledAt); return `<div class="flex items-center space-x-3 bg-sky-50 border border-sky-200 rounded-xl p-3"><div class="bg-sky-100 p-2 rounded-lg text-sky-700"><i data-lucide="refresh-cw" class="w-5 h-5"></i></div><span class="text-xs font-bold text-sky-800">Reagendado pelo cliente em ${formatDateBR(localDateStr(d))} às ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span></div>`; })() : '';
            const depRule = normalizeRules(t.rules).deposit;
            const depVal = app.depositAmount != null ? Number(app.depositAmount) : (Number(app.totalPrice) || 0) * depRule.percent / 100;
            const depPixType = (PIX_TYPES.find(p => p[0] === (app.pixKeyType || depRule.pixKeyType)) || PIX_TYPES[0])[1];
            const depPixKey = app.pixKey || depRule.pixKey;
            const effSt = getEffectiveAppStatus(app);
            const dlTxt = app.depositDeadline ? new Date(app.depositDeadline).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
            const expiredInfo = effSt === 'expirado' ? `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-100 p-3 text-xs text-slate-700 font-bold">⌛ Prazo do sinal vencido${dlTxt ? ' em ' + dlTxt : ''}. O horário foi liberado. Se o cliente já pagou, cancele este e faça um novo agendamento.</div>` : '';
            const depPaid = app.depositRequired && app.status !== 'pendente' && app.status !== 'cancelado';
            const depSummary = depPaid ? `<div class="flex items-center justify-between gap-3 bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs"><span class="font-bold text-emerald-800">Sinal pago ${brl(depVal)}</span><span class="font-bold text-slate-700">Restante ${brl(Math.max(0, (Number(app.totalPrice) || 0) - depVal))}</span></div>` : '';
            const pendingInfo = effSt === 'pendente' ? `
                    <div class="rounded-2xl border-2 border-dashed border-amber-400 bg-amber-50 p-4 space-y-3">
                        <div class="flex items-center space-x-3"><div class="bg-amber-100 p-2 rounded-lg text-amber-700"><i data-lucide="hourglass" class="w-5 h-5"></i></div><div><p class="text-sm font-black text-amber-900">Aguardando confirmação do sinal</p><p class="text-[11px] text-amber-800">Este horário está reservado, mas só vira agendamento firme depois que você confirmar.</p></div></div>
                        <div class="bg-white/80 border border-amber-200 rounded-xl p-3 text-xs text-slate-700 space-y-1">
                            <p>Sinal combinado: <b class="text-emerald-700">${brl(depVal)}</b>${dlTxt ? ` • pagar até <b>${dlTxt}</b>` : ''}</p>
                            ${depPixKey ? `<p>Chave Pix (${esc(depPixType)}) enviada ao cliente: <b class="font-mono break-all">${esc(depPixKey)}</b></p>` : ''}
                        </div>
                        <button onclick="confirmPendingApp('${app.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm flex items-center justify-center"><i data-lucide="check-circle" class="w-4 h-4 mr-2"></i>Confirmar agendamento (sinal recebido)</button>
                    </div>` : '';
            const msg = `
                <div class="text-left space-y-4 bg-slate-50 p-5 rounded-2xl border shadow-inner">
                    ${pendingInfo}
                    ${expiredInfo}
                    ${reschedInfo}
                    <div class="flex items-center space-x-3 border-b pb-3"><div class="bg-theme-secondary p-2 rounded-lg text-theme-primary"><i data-lucide="user" class="w-5 h-5"></i></div><div><p class="text-xs text-slate-400 font-bold uppercase">Cliente</p><span class="font-bold text-slate-800 text-base">${esc(app.clientName)}</span> ${app.beneficiaryName && app.beneficiaryName !== app.clientName ? `<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded ml-2">Para: ${esc(app.beneficiaryName)}</span>` : ''}</div></div>
                    <div class="flex items-center space-x-3 border-b pb-3"><div class="bg-theme-secondary p-2 rounded-lg text-theme-primary"><i data-lucide="user-check" class="w-5 h-5"></i></div><div><p class="text-xs text-slate-400 font-bold uppercase">Profissional</p><span class="font-bold text-slate-800 text-sm">${esc(emp?emp.name:'Profissional')}</span></div></div>
                    <div class="flex items-center space-x-3"><div class="bg-slate-200 p-2 rounded-lg text-slate-500"><i data-lucide="calendar" class="w-5 h-5"></i></div><span class="text-sm font-medium text-slate-700">${formatDateBR(app.date)} às ${app.time}</span></div>
                    <div class="flex items-center space-x-3"><div class="bg-slate-200 p-2 rounded-lg text-slate-500"><i data-lucide="scissors" class="w-5 h-5"></i></div><span class="text-sm font-medium text-slate-700 leading-tight">${esc(app.proceduresNames.join(', '))}</span></div>
                    <div class="flex items-center space-x-3 pt-3 border-t"><div class="bg-emerald-100 p-2 rounded-lg text-emerald-600"><i data-lucide="wallet" class="w-5 h-5"></i></div><span class="font-bold text-emerald-600 text-lg">R$ ${app.totalPrice.toFixed(2)}</span></div>
                    ${depSummary}
                    
                    <div class="pt-4 border-t flex flex-col sm:flex-row gap-2">
                        <button onclick="confirmAppStatus('${app.id}', 'cancelado')" class="flex-1 bg-rose-50 text-rose-600 border border-rose-200 font-bold py-2.5 rounded-xl text-xs hover:bg-rose-100 transition-colors">${app.status === 'pendente' ? 'Recusar / Cancelar' : 'Cancelar Agendamento'}</button>
                        <button onclick="confirmAppStatus('${app.id}', 'nao_compareceu')" class="flex-1 bg-amber-50 text-amber-700 border border-amber-200 font-bold py-2.5 rounded-xl text-xs hover:bg-amber-100 transition-colors">Não Compareceu</button>
                    </div>
                </div>`;
            showModal('Detalhes do Agendamento', msg, 'info');
        };

        window.confirmAppStatus = function(appId, status) {
            closeModal();
            const msg = status === 'cancelado' ? 'Deseja realmente cancelar este agendamento?' : 'Marcar este cliente como "Não compareceu"?';
            showModal('Confirmar', msg, 'error', () => updateAppStatus(appId, status));
        };
        window.updateAppStatus = function(appId, status) {
            setAppStatusDB(appId, status)
                .then(() => {
                    closeModal();
                    showModal('Atualizado', status === 'cancelado' ? 'Agendamento cancelado com sucesso.' : 'Status alterado para Não Compareceu.', 'success');
                })
                .catch(() => showModal('Erro de conexão', 'Não foi possível atualizar o agendamento. Tente novamente.', 'error'));
        };

        // ---------- REGRAS: ações ----------
        window.toggleRule = function(section) { const d = rd(); d[section].enabled = !d[section].enabled; render(); };
        window.toggleDepAll = function() {
            const dep = rd().deposit;
            const ids = (t.procedures || []).map(p => String(p.id));
            if (dep.all || ids.every(i => dep.procedureIds.includes(i))) { dep.all = false; dep.procedureIds = []; }
            else { dep.all = true; dep.procedureIds = ids; }
            render();
        };
        window.toggleDepProc = function(id) {
            const dep = rd().deposit; id = String(id);
            const ids = (t.procedures || []).map(p => String(p.id));
            let sel = dep.all ? ids.slice() : dep.procedureIds.slice();
            sel = sel.includes(id) ? sel.filter(x => x !== id) : sel.concat(id);
            dep.procedureIds = sel;
            dep.all = ids.length > 0 && ids.every(i => sel.includes(i));
            render();
        };
        window.setDepField = function(key, val, rerender) {
            const dep = rd().deposit;
            dep[key] = key === 'percent' ? val : (key === 'pixKey' ? val : val);
            if (rerender) { render(); return; }
            // atualiza só os valores na tela (sem perder o foco do campo)
            const pct = Number(dep.percent) || 0;
            document.querySelectorAll('[data-dep-price]').forEach(el => { el.textContent = brl(depAmount(el.dataset.depPrice, pct)); });
            const sample = document.getElementById('dep-sample');
            if (sample) {
                const p = (t.procedures || []).find(x => dep.all || dep.procedureIds.includes(String(x.id)));
                sample.textContent = brl(depAmount(p ? p.price : 100, pct));
            }
            const kl = document.getElementById('dep-key-label'); if (kl) kl.textContent = dep.pixKey || '—';
            const wp = document.getElementById('dep-wa-preview'); if (wp) wp.classList.toggle('hidden', !String(dep.whatsappLink || '').trim());
        };
        window.setWinMode = function(mode) {
            const w = rd().openingWindow; w.mode = mode;
            const m = WIN_MODES.find(x => x[0] === mode);
            if (m[3] && w.amount > m[3]) w.amount = m[3];
            render();
        };
        window.setWinAmount = function(v) {
            const w = rd().openingWindow; w.amount = v;
            const el = document.getElementById('win-summary'); if (el) el.innerHTML = winSummary(w);
        };
        window.moveStep = function(i, dir) {
            const s = rd().bookingFlow.steps, j = i + dir;
            if (j < 0 || j >= s.length) return;
            [s[i], s[j]] = [s[j], s[i]];
            render();
        };
        window.resetFlow = function() { rd().bookingFlow.steps = DEFAULT_FLOW.slice(); render(); };

        function pixError(type, key) {
            key = (key || '').trim();
            if (!key) return 'Informe a chave Pix que será mostrada ao cliente.';
            const digits = key.replace(/\D/g, '');
            if (type === 'cpf' && digits.length !== 11) return 'O CPF precisa ter 11 números.';
            if (type === 'cnpj' && digits.length !== 14) return 'O CNPJ precisa ter 14 números.';
            if (type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(key)) return 'Informe um e-mail válido para a chave Pix.';
            if (type === 'telefone' && (digits.length < 10 || digits.length > 13)) return 'O telefone precisa ter DDD e número (10 a 13 números).';
            if (type === 'aleatoria' && !/^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$/i.test(key)) return 'A chave aleatória deve ter o formato xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx.';
            return null;
        }

        window.salvarRegras = function() {
            const d = rd();
            const fail = (msg) => showModal('Atenção', msg, 'error');
            const hours = parseInt(d.hours);
            const dep = d.deposit, win = d.openingWindow, flow = d.bookingFlow;
            const percent = Number(dep.percent);
            if (dep.enabled) {
                if (!dep.all && dep.procedureIds.length === 0) return fail('Selecione ao menos um procedimento para cobrar sinal (ou use "Selecionar tudo").');
                if (!(percent > 0 && percent <= 100)) return fail('A porcentagem do sinal deve ficar entre 1 e 100.');
                const err = pixError(dep.pixKeyType, dep.pixKey); if (err) return fail(err);
            }
            const expiryHours = Number(dep.expiryHours === '' || dep.expiryHours == null ? 2 : dep.expiryHours);
            if (dep.enabled && (isNaN(expiryHours) || expiryHours < 0 || expiryHours > 720)) return fail('O prazo para pagar o sinal deve ficar entre 0 e 720 horas (0 = sem prazo).');
            const waLink = waNormalize(dep.whatsappLink);
            if (waLink === null) return fail('O link do WhatsApp não parece válido. Cole um link como https://wa.me/5519999999999 (ou só o número com DDD).');
            let amount = Math.floor(Number(win.amount));
            if (win.enabled && win.mode !== 'always') {
                const max = WIN_MODES.find(x => x[0] === win.mode)[3];
                if (!(amount >= 1 && amount <= max)) return fail(`Informe uma quantidade entre 1 e ${max} para a abertura da agenda.`);
            }
            if (flow.enabled && flow.steps.indexOf('time') < flow.steps.indexOf('date')) return fail('O horário precisa vir depois do dia. Ajuste a ordem das etapas.');

            const allIds = (t.procedures || []).map(p => String(p.id));
            t.rules = {
                deposit: {
                    enabled: dep.enabled, all: dep.all === true,
                    procedureIds: dep.all ? allIds : dep.procedureIds,
                    percent: percent > 0 && percent <= 100 ? percent : 30,
                    pixKeyType: dep.pixKeyType, pixKey: (dep.pixKey || '').trim(),
                    whatsappLink: waLink || '',
                    expiryHours: (!isNaN(expiryHours) && expiryHours >= 0 && expiryHours <= 720) ? expiryHours : 2
                },
                openingWindow: { enabled: win.enabled, mode: win.mode, amount: amount >= 1 ? amount : 2 },
                bookingFlow: { enabled: flow.enabled, steps: flow.steps.slice() }
            };
            t.cancelMinHours = (isNaN(hours) || hours < 0) ? 0 : hours;
            window.rulesDraft = null;
            saveDB(['rules', 'cancelMinHours']);
            showModal('Sucesso', 'Regras atualizadas!', 'success');
        };

        // ---------- AGENDAMENTO PENDENTE: confirmar sinal ----------
        window.confirmPendingApp = function(appId) {
            const _a = (t.appointments || []).find(x => x.id === appId);
            const _extra = { depositPaidAt: new Date().toISOString() };
            if (_a && _a.depositAmount != null) _extra.depositPaid = Number(_a.depositAmount);
            setAppStatusDB(appId, 'agendado', _extra)
                .then(() => { closeModal(); showModal('Confirmado', 'Agendamento confirmado com sucesso.', 'success'); })
                .catch(() => showModal('Erro de conexão', 'Não foi possível confirmar o agendamento. Tente novamente.', 'error'));
        };

        // ---------- ORGANIZAÇÃO / PERFIL / PROFISSIONAIS ----------
        window.salvarOrg = function() {
            t.name = document.getElementById('org-name').value;
            const keys = ['name'];
            if (draft.logo) { t.logo = draft.logo; keys.push('logo'); delete draft.logo; }
            saveDB(keys);
            showModal('Sucesso', 'Organização atualizada!', 'success');
        };

        // só pré-visualiza; grava ao clicar em Salvar
        window.handleImageUpload = function(e, type) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => { draft[type] = ev.target.result; render(); };
            reader.readAsDataURL(file);
        };

        window.salvarPerfil = async function(userId) {
            const role = session.role;
            const user = role === 'admin' ? t.admin : t.employees.find(emp => emp.id === userId);
            const conf = document.getElementById('prof-pass-conf').value;
            let novoHash = null;

            if (role === 'employee') {
                const oldP = document.getElementById('prof-old-pass').value;
                const newP = document.getElementById('prof-new-pass').value;
                if (oldP || newP || conf) {
                    const err = validarNovaSenha(newP, conf);
                    if (err) return showModal('Erro', err, 'error');
                    novoHash = await hashSenha(newP);
                }
            } else {
                const newP = document.getElementById('prof-pass-admin').value;
                if (newP || conf) {
                    const err = validarNovaSenha(newP, conf);
                    if (err) return showModal('Erro', err, 'error');
                    novoHash = await hashSenha(newP);
                }
            }
            user.name = document.getElementById('prof-name').value;
            user.email = document.getElementById('prof-email').value;
            if (novoHash) user.password = novoHash;
            if (draft.avatar) { user.avatar = draft.avatar; delete draft.avatar; }
            saveDB(role === 'admin' ? ['admin', 'employees'] : ['employees']);
            showModal('Sucesso', 'Perfil atualizado!', 'success');
        };

        window.saveEmployee = async function(e) {
            e.preventDefault();
            const name = document.getElementById('e-name').value;
            const email = document.getElementById('e-email').value;
            const pass = document.getElementById('e-pass').value;
            const pass2 = document.getElementById('e-pass2').value;
            const checks = Array.from(document.querySelectorAll('.proc-check:checked')).map(cb => cb.value);
            const phoneRaw = document.getElementById('e-phone').value.trim();
            if (cleanPhone(phoneRaw).length !== 11) return showModal('Telefone obrigatório', 'Informe um telefone/WhatsApp válido do profissional, com DDD e 9 dígitos. Exemplo: (11) 98765-4321', 'error');
            if (!editEmployeeId && (t.employees || []).some(x => (x.email || '').toLowerCase() === email.trim().toLowerCase())) return showModal('Aviso', 'Já existe um profissional com este e-mail.', 'error');
            let empUid = null;
            let senhaHash = null;
            if (!editEmployeeId || pass || pass2) {
                const err = validarNovaSenha(pass, pass2);
                if (err) return showModal('Erro', err, 'error');
                senhaHash = await hashSenha(pass);
                if (!editEmployeeId) {
                    const created = await createAuthUser(email.trim(), pass);
                    if (created.error) return showModal('Erro', created.error, 'error');
                    empUid = created.uid;
                }
            }
            if (editEmployeeId) {
                const emp = t.employees.find(x => x.id === editEmployeeId);
                emp.name = name; emp.email = email; emp.phone = phoneRaw; emp.procedures = checks;
                if (senhaHash) emp.password = senhaHash;
                // horário de trabalho do profissional
                if (document.getElementById('ewh-cb-0')) {
                    const wh = {};
                    for (let i = 0; i < 7; i++) {
                        wh[i] = {
                            active: document.getElementById(`ewh-cb-${i}`).checked,
                            start: document.getElementById(`ewh-s-${i}`).value || '09:00',
                            end: document.getElementById(`ewh-e-${i}`).value || '18:00'
                        };
                    }
                    emp.workingHours = wh;
                }
            } else {
                const newColor = COLOR_PALETTE[(t.employees.length + 1) % COLOR_PALETTE.length];
                t.employees.push({ id: 'emp-' + Date.now(), uid: empUid, name, email: email.trim(), phone: phoneRaw, password: senhaHash, avatar: '', color: newColor, procedures: checks, workingHours: getDefWH(), exceptions: {} });
            }
            editEmployeeId = null;
            saveDB(['employees']);
        };

        // ---------- GESTÃO DE CLIENTES ----------
        // 'clients' recebe escrita dos clientes ao mesmo tempo, então só por transação
        window.toggleBlockClient = function(id) {
            runTransaction(ref(rtdb, basePath + '/clients'), (cur) => {
                if (!cur) return;
                const list = toList(cur);
                const c = list.find(x => x.id === id);
                if (!c) return;
                c.blocked = !c.blocked;
                return list;
            }).catch(() => showModal('Erro de conexão', 'Não foi possível atualizar o cliente.', 'error'));
        };

        window.saveClient = async function(e) {
            e.preventDefault();
            const err = validarNovaSenha(document.getElementById('c-pass').value, document.getElementById('c-pass2').value);
            if (err) return showModal('Erro', err, 'error');
            if (cleanPhone(document.getElementById('c-phone').value).length !== 11) return showModal('Telefone obrigatório', 'Informe um telefone/WhatsApp válido do cliente, com DDD e 9 dígitos. Exemplo: (11) 98765-4321', 'error');
            const created = await createAuthUser(document.getElementById('c-email').value.trim(), document.getElementById('c-pass').value);
            if (created.error) return showModal('Erro', created.error, 'error');
            const novo = {
                id: created.uid,
                name: document.getElementById('c-name').value.trim(),
                email: document.getElementById('c-email').value.trim(),
                phone: document.getElementById('c-phone').value.trim(),
                password: await hashSenha(document.getElementById('c-pass').value),
                blocked: false
            };
            let duplicado = false;
            runTransaction(ref(rtdb, basePath + '/clients'), (cur) => {
                duplicado = false;
                const list = toList(cur);
                if (list.some(c => (c.email || '').toLowerCase() === novo.email.toLowerCase())) { duplicado = true; return; }
                list.push(novo);
                return list;
            }).then(r => {
                if (duplicado) return showModal('Aviso', 'Já existe um cliente com este e-mail.', 'error');
                if (r.committed) {
                    showModal('Sucesso', 'Cliente cadastrado!', 'success');
                    document.getElementById('client-form').reset();
                    document.getElementById('client-form').classList.add('hidden');
                }
            }).catch(() => showModal('Erro de conexão', 'Não foi possível salvar o cliente.', 'error'));
        };

        // ---------- SERVIÇOS ----------
        window.saveProcedure = function(e) { 
            e.preventDefault(); 
            const name = document.getElementById('p-name').value;
            const duration = parseInt(document.getElementById('p-time').value);
            const price = parseFloat(document.getElementById('p-price').value);

            if(editProcedureId) {
                let p = t.procedures.find(x => x.id === editProcedureId);
                if(p) { p.name = name; p.duration = duration; p.price = price; }
            } else {
                t.procedures.push({ id: 'p-' + Date.now(), name, duration, price });
            }
            editProcedureId = null;
            saveDB(['procedures']);
        };

        window.deleteProcedure = function(id) {
            showModal('Excluir Serviço', 'Tem certeza que deseja excluir este serviço?', 'error', () => {
                t.procedures = t.procedures.filter(p => p.id !== id);
                saveDB(['procedures']);
            });
        };

        window.cancelarAgendamento = function(id) { updateAppStatus(id, 'cancelado'); };
    </script>
</body>
