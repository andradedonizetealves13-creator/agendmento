<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaPro - Agendamento do Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-bg: #f8fafc;
            --theme-primary: #4f46e5;
            --theme-primary-hover: #4338ca;
            --theme-secondary: #e0e7ff;
            --theme-text-primary: #1e1b4b;
            
            /* DESKTOP DEFAULTS */
            --bg-image: none;
            --bg-opacity: 0.15;
            --bg-blur: 0px;
            --bg-scale: 100%;
            --bg-pos-x: 50%;
            --bg-pos-y: 50%;
        }
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            font-family: 'Inter', sans-serif; 
            background-color: var(--theme-bg) !important; 
            transition: background-color 0.3s ease; 
            overflow: hidden; 
        }
        #custom-bg-layer {
            position: fixed;
            inset: 0;
            background-image: var(--bg-image);
            background-repeat: no-repeat;
            background-size: var(--bg-scale);
            background-position: var(--bg-pos-x) var(--bg-pos-y);
            opacity: var(--bg-opacity);
            filter: blur(var(--bg-blur));
            pointer-events: none;
            z-index: 0;
        }
        
        @media (max-width: 768px) {
            #custom-bg-layer {
                background-size: cover !important;
                background-position: center top !important;
            }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-theme-primary { 
            background-color: var(--theme-primary) !important; 
            color: #ffffff !important; 
        }
        .btn-theme-primary:hover { 
            background-color: var(--theme-primary-hover) !important; 
        }
        .bg-theme-secondary { 
            background-color: var(--theme-secondary) !important; 
        }
        .text-theme-primary { 
            color: var(--theme-primary) !important; 
        }
        .border-theme-primary {
            border-color: var(--theme-primary) !important;
        }

        /* ESTILOS DO CROPPER (CORTADOR DE FOTO) */
        #cropper-img {
            max-width: none;
            touch-action: none; /* Previne scroll ao arrastar no mobile */
        }
        .cropper-mask {
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.75);
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-full w-full flex m-0 p-0 overflow-hidden">

    <div id="custom-bg-layer"></div>

    <div id="app" class="h-full w-full flex flex-col p-0 m-0 relative z-10 overflow-y-auto custom-scrollbar">
        <div class="m-auto flex flex-col items-center justify-center">
            <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p class="text-sm text-slate-500 font-medium">Carregando agendamentos...</p>
        </div>
    </div>

    <div id="custom-modal" class="hidden fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 fade-in">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            <div id="modal-icon-container" class="mb-4 flex items-center justify-center w-12 h-12 rounded-full mx-auto"></div>
            <h3 id="modal-title" class="text-lg font-bold text-slate-900 text-center mb-2"></h3>
            <div id="modal-message" class="text-slate-600 text-center text-sm mb-6 max-h-[60vh] overflow-y-auto custom-scrollbar"></div>
            <div id="modal-buttons" class="flex justify-end space-x-3"></div>
        </div>
    </div>

    <!-- MODAL DE CORTE DE FOTO ESTILO WHATSAPP -->
    <div id="cropper-modal" class="hidden fixed inset-0 z-[150] flex flex-col items-center justify-center bg-slate-900 fade-in touch-none">
        <h3 class="text-white font-bold mb-6 text-lg tracking-wide">Mova e Ajuste</h3>
        
        <div class="relative w-64 h-64 sm:w-80 sm:h-80 flex items-center justify-center rounded-full cropper-mask z-20 pointer-events-none border-2 border-white/50">
            <!-- Máscara vazada redonda -->
        </div>

        <!-- Container real da imagem (Fica por baixo da máscara) -->
        <div id="cropper-container" class="absolute inset-0 flex items-center justify-center z-10 cursor-move overflow-hidden">
            <img id="cropper-img" src="" class="absolute transform-gpu">
        </div>

        <div class="w-64 sm:w-80 mt-8 z-30 flex items-center space-x-3 text-white">
            <i data-lucide="zoom-out" class="w-5 h-5"></i>
            <input type="range" id="cropper-zoom" min="0.5" max="3" step="0.05" value="1" class="flex-1 accent-indigo-500">
            <i data-lucide="zoom-in" class="w-5 h-5"></i>
        </div>

        <div class="flex space-x-4 mt-8 w-64 sm:w-80 z-30">
            <button onclick="closeCropper()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-3.5 rounded-xl font-bold transition-colors">Cancelar</button>
            <button onclick="applyCrop()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-xl font-bold transition-colors shadow-lg">Cortar</button>
        </div>
    </div>

    <script type="module">
        import { 
            auth, 
            rtdb, 
            googleProvider,
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInWithPopup,
            signOut, 
            onAuthStateChanged, 
            ref, 
            onValue, 
            runTransaction 
        } from './firebase-config.js';

        const THEME_PALETTES = [
            { id: 'indigo_classic', bg: '#f8fafc', primary: '#4f46e5', primaryHover: '#4338ca', secondary: '#e0e7ff', dark: '#1e1b4b' },
            { id: 'wine_velvet', bg: '#E8C5D0', primary: '#4A0E2E', primaryHover: '#2D081B', secondary: '#B56B82', dark: '#2A0515' },
            { id: 'emerald_nature', bg: '#e6f4ea', primary: '#059669', primaryHover: '#047857', secondary: '#a7f3d0', dark: '#064e3b' },
            { id: 'amber_gold', bg: '#fef3c7', primary: '#d97706', primaryHover: '#b45309', secondary: '#fde68a', dark: '#78350f' },
            { id: 'slate_dark', bg: '#f1f5f9', primary: '#334155', primaryHover: '#1e293b', secondary: '#cbd5e1', dark: '#0f172a' }
        ];

        // ---------- utilitários ----------
        window.esc = function(v) {
            return String(v === undefined || v === null ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        };
        function toList(v) { return Array.isArray(v) ? v.filter(x => x) : (v ? Object.values(v) : []); }
        window.localDateStr = function(d = new Date()) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        const isBusyStatus = (a) => a.status !== 'cancelado' && a.status !== 'nao_compareceu';

        const urlParams = new URLSearchParams(window.location.search);
        const orgSlug = urlParams.get('org');
        const slugInvalid = !orgSlug || /[.$#\[\]\/]/.test(orgSlug);

        if (slugInvalid) {
            document.getElementById('app').innerHTML = `<div class="bg-white p-8 rounded-3xl shadow-xl border text-center max-w-md w-full m-auto"><h2 class="text-xl font-bold text-rose-600 mb-2">Link Inválido</h2><p class="text-slate-500 text-sm">Nenhuma organização válida foi especificada no link de agendamento.</p></div>`;
        } else {
            const basePath = 'agendapro_saas/tenants/' + orgSlug;
            const tenantRef = ref(rtdb, basePath);
            const storageKey = 'agendaProClient_' + orgSlug;

            window.t = null;
            window.tenantRef = tenantRef;
            window.clientAuthMode = 'login';
            window.clientActiveTab = 'book';
            window.clientBooking = { step: 1, date: null, procedures: [], employeeId: null, time: null, isForOther: false, beneficiaryName: '' };
            window.clientCalYear = new Date().getFullYear();
            window.clientCalMonth = new Date().getMonth();
            window.showHistoryApps = false;
            window.hasRendered = false;

            function saveClientId(id) { localStorage.setItem(storageKey, JSON.stringify({ id })); }

            window.currentClient = null;

            // Monitor de Autenticação Oficial do Firebase
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    saveClientId(user.uid);
                    if (window.t && window.t.clients) {
                        const freshClient = window.t.clients.find(c => c.id === user.uid || (c.email && c.email.toLowerCase() === (user.email || '').toLowerCase()));
                        if (freshClient) {
                            freshClient.id = user.uid;
                            currentClient = freshClient;
                        } else {
                            currentClient = { id: user.uid, name: user.displayName || (user.email ? user.email.split('@')[0] : 'Cliente'), email: user.email || '', phone: user.phoneNumber || '', avatar: user.photoURL || '' };
                        }
                    } else {
                        currentClient = { id: user.uid, name: user.displayName || (user.email ? user.email.split('@')[0] : 'Cliente'), email: user.email || '', phone: user.phoneNumber || '', avatar: user.photoURL || '' };
                    }
                    if (window.hasRendered) safeRender();
                } else {
                    currentClient = null;
                    localStorage.removeItem(storageKey);
                    if (window.hasRendered) safeRender();
                }
            });

            // ---------- render seguro: não apaga o que a pessoa está digitando ----------
            let pendingRender = false;
            function isUserTyping() {
                const el = document.activeElement;
                const appEl = document.getElementById('app');
                return !!(el && appEl && appEl.contains(el) && ['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName));
            }
            function safeRender() {
                if (window.hasRendered && isUserTyping()) { pendingRender = true; return; }
                pendingRender = false;
                render();
            }
            document.getElementById('app').addEventListener('focusout', () => {
                if (!pendingRender) return;
                setTimeout(() => { if (pendingRender && !isUserTyping()) safeRender(); }, 250);
            });

            onValue(tenantRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    document.getElementById('app').innerHTML = `<div class="bg-white p-8 rounded-3xl shadow-xl border text-center max-w-md w-full m-auto"><h2 class="text-xl font-bold text-rose-600 mb-2">Empresa não encontrada</h2><p class="text-slate-500 text-sm">A empresa informada não existe no sistema.</p></div>`;
                    return;
                }
                window.t = data;
                t.clients = toList(t.clients);
                t.appointments = toList(t.appointments);
                t.procedures = toList(t.procedures);
                t.employees = toList(t.employees);
                
                applyThemeCSS(t.themePalette || 'indigo_classic');
                applyBgImageSettings();
                
                if (auth.currentUser) {
                    const freshClient = t.clients.find(c => c.id === auth.currentUser.uid || (c.email && c.email.toLowerCase() === (auth.currentUser.email || '').toLowerCase()));
                    if (freshClient) {
                        freshClient.id = auth.currentUser.uid;
                        currentClient = freshClient;
                    }
                }

                safeRender();
            }, (error) => {
                document.getElementById('app').innerHTML = `<div class="bg-white p-8 rounded-3xl shadow-xl border text-center max-w-md w-full m-auto"><h2 class="text-xl font-bold text-rose-600 mb-2">Não foi possível carregar</h2><p class="text-slate-500 text-sm mb-4">Verifique sua conexão e tente novamente.</p><button onclick="location.reload()" class="btn-theme-primary font-bold px-6 py-3 rounded-xl">Tentar novamente</button></div>`;
            });

            window.addEventListener('resize', () => {
                if (window.t) applyBgImageSettings();
            });

            function applyThemeCSS(paletteId) {
                const palette = THEME_PALETTES.find(p => p.id === paletteId) || THEME_PALETTES[0];
                document.documentElement.style.setProperty('--theme-bg', palette.bg);
                document.documentElement.style.setProperty('--theme-primary', palette.primary);
                document.documentElement.style.setProperty('--theme-primary-hover', palette.primaryHover);
                document.documentElement.style.setProperty('--theme-secondary', palette.secondary);
                document.documentElement.style.setProperty('--theme-text-primary', palette.dark);
            }

            function applyBgImageSettings() {
                const isMobile = window.innerWidth < 768;
                
                const img = isMobile ? (t.bgMobileImage || t.bgCustomImage) : (t.bgCustomImage || t.bgMobileImage);
                const scale = isMobile ? (t.bgMobileScale !== undefined ? t.bgMobileScale : t.bgCustomScale) : t.bgCustomScale;
                const opacity = isMobile ? (t.bgMobileOpacity !== undefined ? t.bgMobileOpacity : t.bgCustomOpacity) : t.bgCustomOpacity;
                const blur = isMobile ? (t.bgMobileBlur !== undefined ? t.bgMobileBlur : t.bgCustomBlur) : t.bgCustomBlur;
                const posX = isMobile ? (t.bgMobilePosX !== undefined ? t.bgMobilePosX : t.bgCustomPosX) : t.bgCustomPosX;
                const posY = isMobile ? (t.bgMobilePosY !== undefined ? t.bgMobilePosY : t.bgCustomPosY) : t.bgCustomPosY;

                if (img) {
                    document.documentElement.style.setProperty('--bg-image', `url("${img}")`);
                    document.documentElement.style.setProperty('--bg-opacity', opacity !== undefined ? opacity : 0.15);
                    document.documentElement.style.setProperty('--bg-blur', (blur || 0) + 'px');
                    document.documentElement.style.setProperty('--bg-scale', (scale || 100) + '%');
                    document.documentElement.style.setProperty('--bg-pos-x', (posX !== undefined ? posX : 50) + '%');
                    document.documentElement.style.setProperty('--bg-pos-y', (posY !== undefined ? posY : 50) + '%');
                } else {
                    document.documentElement.style.setProperty('--bg-image', 'none');
                }
            }

            // ---------- gravações pontuais (não sobrescrevem a empresa inteira) ----------
            window.createAppointment = function(newApp) {
                let conflict = false;
                return runTransaction(ref(rtdb, basePath + '/appointments'), (cur) => {
                    conflict = false;
                    const list = toList(cur);
                    const s = timeToMins(newApp.time), e = s + newApp.totalDuration;
                    const clash = list.some(a => a.employeeId === newApp.employeeId && a.date === newApp.date && isBusyStatus(a)
                        && s < timeToMins(a.time) + a.totalDuration && e > timeToMins(a.time));
                    if (clash) { conflict = true; return; }
                    list.push(newApp);
                    return list;
                }).then(res => ({ ok: res.committed, conflict }));
            };

            window.setAppointmentStatus = function(id, status) {
                return runTransaction(ref(rtdb, basePath + '/appointments'), (cur) => {
                    if (!cur) return;
                    const list = toList(cur);
                    const item = list.find(a => a.id === id);
                    if (!item) return;
                    item.status = status;
                    return list;
                });
            };

            window.updateClientInDatabase = function() {
                const me = currentClient;
                return runTransaction(ref(rtdb, basePath + '/clients'), (cur) => {
                    const list = toList(cur);
                    const i = list.findIndex(c => c.id === me.id);
                    if (i === -1) {
                        list.push(me);
                    } else {
                        list[i] = me;
                    }
                    return list;
                }).then(() => { saveClientId(me.id); });
            };

            window.formatDateBR = function(dateStr) { return dateStr.split('-').reverse().join('/'); };
            window.timeToMins = function(t) { const [h,m] = t.split(':'); return parseInt(h)*60 + parseInt(m); };
            window.minsToTime = function(m) { const h = Math.floor(m/60).toString().padStart(2,'0'); const mins = (m%60).toString().padStart(2,'0'); return `${h}:${mins}`; };

            window.formatPhoneInput = function(input) {
                let v = input.value.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                
                if (v.length > 10) {
                    v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
                } else if (v.length > 6) {
                    v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
                } else if (v.length > 2) {
                    v = v.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
                } else if (v.length > 0) {
                    v = v.replace(/^(\d*)$/, '($1');
                }
                input.value = v;
            };

            window.cleanPhone = function(p) {
                return (p || '').replace(/\D/g, '');
            };

            window.getEffectiveAppStatus = function(appItem) {
                if (appItem.status === 'cancelado') return 'cancelado';
                if (appItem.status === 'nao_compareceu') return 'nao_compareceu';
                if (appItem.status === 'realizado') return 'realizado';
                const appDateTime = new Date(appItem.date + 'T' + appItem.time);
                if (appDateTime < new Date()) return 'realizado';
                return 'agendado';
            };

            window.doesEmployeeWorkOnDate = function(emp, dateStr) {
                if (emp.exceptions && emp.exceptions[dateStr]) {
                    if (emp.exceptions[dateStr].type === 'folga') return false;
                    if (emp.exceptions[dateStr].type === 'plantao') return true;
                }
                if (t.admin.exceptions && t.admin.exceptions[dateStr]) {
                    if (t.admin.exceptions[dateStr].type === 'folga') return false;
                    if (t.admin.exceptions[dateStr].type === 'plantao') return true;
                }
                const [y, m, d] = dateStr.split('-'); const dayOfWeek = new Date(y, m - 1, d).getDay(); 
                const whSource = emp.workingHours || t.admin.workingHours;
                return whSource?.[dayOfWeek]?.active !== false;
            };

            window.isDateAllowedByMonthlyRule = function(cellDate) {
                const today = new Date();
                today.setHours(0,0,0,0);
                if (cellDate < today) return false;
                const currentYear = today.getFullYear();
                const currentMonth = today.getMonth();
                const cellYear = cellDate.getFullYear();
                const cellMonth = cellDate.getMonth();
                const cellDay = cellDate.getDate();

                const totalDaysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
                const isLastWeekOfCurrentMonth = today.getDate() > (totalDaysInCurrentMonth - 7);

                if (cellYear === currentYear && cellMonth === currentMonth) return true;
                const nextMonthDate = new Date(currentYear, currentMonth + 1, 1);
                if (cellYear === nextMonthDate.getFullYear() && cellMonth === nextMonthDate.getMonth()) {
                    if (!isLastWeekOfCurrentMonth) return false;
                    const totalDaysInNextMonth = new Date(cellYear, cellMonth + 1, 0).getDate();
                    if (cellDay > (totalDaysInNextMonth - 7)) return false;
                    return true;
                }
                return false;
            };

            window.isCompanyOpenOnDate = function(dateStr) {
                const cellDate = new Date(dateStr + 'T00:00:00');
                if (!isDateAllowedByMonthlyRule(cellDate)) return false;

                if (t.employees && t.employees.length > 0) {
                    return t.employees.some(emp => doesEmployeeWorkOnDate(emp, dateStr));
                }
                return doesEmployeeWorkOnDate(t.admin, dateStr);
            };

            // O dia tem expediente, mas ainda sobrou algum horário livre?
            window.hasAnyFreeSlot = function(dateStr) {
                const ids = (t.employees && t.employees.length > 0) ? t.employees.map(e => e.id) : [t.admin.id];
                return ids.some(id => getAvailableTimeSlots(id, dateStr, 30).length > 0);
            };

            window.doesClientHaveCollision = function(dateStr, startMins, durationMins) {
                if (!currentClient) return false;
                const reschedId = clientBooking.resched ? clientBooking.resched.id : null;
                const clientApps = t.appointments.filter(a => a.clientId === currentClient.id && a.date === dateStr && isBusyStatus(a) && a.id !== reschedId);
                const endMins = startMins + durationMins;

                for (let a of clientApps) {
                    const aStart = timeToMins(a.time);
                    const aEnd = aStart + a.totalDuration;
                    if (startMins < aEnd && endMins > aStart) return true;
                }
                return false;
            };

            window.getAvailableTimeSlots = function(empId, dateStr, durationMins) {
                const emp = empId === t.admin.id ? t.admin : (t.employees || []).find(e => e.id === empId);
                if(!emp || !doesEmployeeWorkOnDate(emp, dateStr)) return [];
                
                let start = '09:00', end = '18:00';
                const excEmp = emp.exceptions?.[dateStr];
                const excAdmin = t.admin.exceptions?.[dateStr];

                if (excEmp && excEmp.type === 'plantao') { start = excEmp.start; end = excEmp.end; }
                else if (excAdmin && excAdmin.type === 'plantao') { start = excAdmin.start; end = excAdmin.end; }
                else {
                    const [y, m, d] = dateStr.split('-'); const dayOfWeek = new Date(y, m - 1, d).getDay();
                    const wh = emp.workingHours?.[dayOfWeek] || t.admin.workingHours?.[dayOfWeek];
                    if(wh && wh.active) { start = wh.start; end = wh.end; } else return [];
                }

                const startMins = timeToMins(start); const endMins = timeToMins(end);
                const reschedId = clientBooking.resched ? clientBooking.resched.id : null;
                const empApps = (t.appointments || []).filter(a => a.employeeId === empId && a.date === dateStr && isBusyStatus(a) && a.id !== reschedId);
                const slots = [];

                // Hoje: não oferece horários que já passaram
                const now = new Date();
                const isToday = dateStr === localDateStr(now);
                const nowMins = now.getHours() * 60 + now.getMinutes();

                for(let m = startMins; m <= endMins - durationMins; m += 30) {
                    if (isToday && m <= nowMins) continue;

                    let overlap = false;
                    const slotEnd = m + durationMins;
                    
                    for(let a of empApps) {
                        const aStart = timeToMins(a.time); const aEnd = aStart + a.totalDuration;
                        if(m < aEnd && slotEnd > aStart) { overlap = true; break; }
                    }

                    if(!overlap) {
                        slots.push({
                            time: minsToTime(m),
                            hasClientCollision: doesClientHaveCollision(dateStr, m, durationMins)
                        });
                    }
                }
                return slots;
            };

            window.getEmployeeById = function(id) {
                return id === t.admin.id ? t.admin : (t.employees || []).find(e => e.id === id);
            };

            // Profissionais que fazem TODOS os serviços escolhidos e trabalham no dia
            function capableEmployees(dateStr, procIds) {
                return (t.employees || []).filter(e =>
                    procIds.every(pid => e.procedures && e.procedures.includes(pid)) && doesEmployeeWorkOnDate(e, dateStr));
            }

            // Horários livres de um profissional ou de "qualquer profissional"
            window.getBookingSlots = function(empId, dateStr, durationMins, procIds) {
                if (empId !== 'any') return getAvailableTimeSlots(empId, dateStr, durationMins);
                const map = new Map();
                capableEmployees(dateStr, procIds || []).forEach(e => {
                    getAvailableTimeSlots(e.id, dateStr, durationMins).forEach(s => { if (!map.has(s.time)) map.set(s.time, s); });
                });
                return Array.from(map.values()).sort((a, b) => timeToMins(a.time) - timeToMins(b.time));
            };

            window.resolveEmployeeForTime = function(dateStr, durationMins, procIds, time) {
                const found = capableEmployees(dateStr, procIds || []).find(e =>
                    getAvailableTimeSlots(e.id, dateStr, durationMins).some(s => s.time === time));
                return found ? found.id : null;
            };

            // Prazo de reagendamento (opcional): cancelMinHours na empresa. 0 = sem limite. Cancelar é sempre liberado.
            window.getCancelMinHours = function() { return Number(t.cancelMinHours) || 0; };
            window.canModifyApp = function(a) {
                const min = getCancelMinHours();
                if (!min) return true;
                return (new Date(a.date + 'T' + a.time) - new Date()) / 3600000 >= min;
            };

            window.calendarLinkHtml = function(title, dateStr, timeStr, durationMins, details) {
                const start = dateStr.replace(/-/g, '') + 'T' + timeStr.replace(':', '') + '00';
                const end = dateStr.replace(/-/g, '') + 'T' + minsToTime(Math.min(timeToMins(timeStr) + durationMins, 1439)).replace(':', '') + '00';
                const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(title)
                    + '&dates=' + start + '/' + end + '&details=' + encodeURIComponent(details || '');
                return `<a href="${esc(url)}" target="_blank" rel="noopener" class="inline-flex items-center justify-center mt-3 text-xs font-bold text-theme-primary underline">Adicionar ao Google Agenda</a>`;
            };

            window.resetBooking = function() {
                clientBooking = { step: 1, date: null, procedures: [], employeeId: null, time: null, isForOther: false, beneficiaryName: '' };
            };

                if (clientBooking.resched) resetBooking();

            window.startReschedule = function(id) {
                const a = t.appointments.find(x => x.id === id);
                if (!a) return showModal('Erro', 'Agendamento não encontrado.', 'error');
                if (!canModifyApp(a)) return showModal('Fora do prazo', `Só é possível reagendar com pelo menos ${getCancelMinHours()}h de antecedência. Entre em contato com a empresa.`, 'info');
                if (!getEmployeeById(a.employeeId)) return showModal('Erro', 'O profissional deste agendamento não está mais disponível. Cancele e faça um novo agendamento.', 'error');
                clientBooking = {
                    step: 1, date: null, procedures: [], employeeId: a.employeeId, time: null, isForOther: false, beneficiaryName: '',
                    resched: { id: a.id, date: a.date, time: a.time, totalDuration: a.totalDuration, totalPrice: a.totalPrice, proceduresNames: a.proceduresNames, employeeId: a.employeeId, beneficiaryName: a.beneficiaryName }
                };
                clientCalYear = new Date().getFullYear();
                clientCalMonth = new Date().getMonth();
                clientActiveTab = 'book';
                render();
            };

            // Move o agendamento (mesmo id) de forma atômica, checando conflito
            window.rescheduleAppointment = function(id, newDate, newTime) {
                let reason = 'ok';
                return runTransaction(ref(rtdb, basePath + '/appointments'), (cur) => {
                    reason = 'ok';
                    if (!cur) { reason = 'missing'; return; }
                    const list = toList(cur);
                    const item = list.find(a => a.id === id);
                    if (!item || !isBusyStatus(item) || item.status === 'realizado') { reason = 'missing'; return; }
                    const s = timeToMins(newTime), e = s + item.totalDuration;
                    const clash = list.some(a => a.id !== id && a.employeeId === item.employeeId && a.date === newDate && isBusyStatus(a)
                        && s < timeToMins(a.time) + a.totalDuration && e > timeToMins(a.time));
                    if (clash) { reason = 'conflict'; return; }
                    item.date = newDate;
                    item.time = newTime;
                    item.rescheduledAt = new Date().toISOString();
                    return list;
                }).then(res => ({ ok: res.committed, reason }));
            };

            window.handleClientGoogleAuth = async function() {
                try {
                    const result = await signInWithPopup(auth, googleProvider);
                    const user = result.user;
                    const email = (user.email || '').toLowerCase();
                    const name = user.displayName || (user.email ? user.email.split('@')[0] : 'Cliente');
                    const phone = user.phoneNumber || '';
                    
                    await runTransaction(ref(rtdb, basePath + '/clients'), (cur) => {
                        const list = toList(cur);
                        let existing = list.find(c => c.id === user.uid || (c.email && c.email.toLowerCase() === email));
                        if (!existing) {
                            list.push({ id: user.uid, name, email, phone, avatar: user.photoURL || '' });
                        } else if (!existing.id || existing.id !== user.uid) {
                            existing.id = user.uid;
                        }
                        return list;
                    });
                } catch (err) {
                    showModal('Erro no Google', err.message, 'error');
                }
            };

            window.handleClientAuthSubmit = async function(e) {
                e.preventDefault();
                const email = document.getElementById('c-auth-email').value.trim().toLowerCase();
                const pass = document.getElementById('c-auth-pass').value.trim();

                if (clientAuthMode === 'register') {
                    const name = document.getElementById('c-auth-name').value.trim();
                    const phoneRaw = document.getElementById('c-auth-phone').value;
                    const digitsPhone = cleanPhone(phoneRaw);

                    if (!name || name.length < 3) return showModal('Aviso', 'Por favor, informe seu nome completo.', 'error');
                    if (digitsPhone.length !== 11) return showModal('Telefone Inválido', 'Informe um telefone/WhatsApp válido com DDD e 9 dígitos. Exemplo: (11) 98765-4321', 'error');
                    if (!email || !email.includes('@')) return showModal('Aviso', 'Informe um e-mail válido.', 'error');
                    if (!pass || pass.length < 6) return showModal('Aviso', 'A senha deve ter no mínimo 6 caracteres.', 'error');

                    let user;
                    try {
                        const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                        user = userCred.user;
                    } catch(err) {
                        if(err.code === 'auth/email-already-in-use') {
                            try {
                                const userCred = await signInWithEmailAndPassword(auth, email, pass);
                                user = userCred.user;
                            } catch(err2) {
                                return showModal('Acesso Negado', 'Este e-mail já tem conta, mas a senha está incorreta. Se você já agendou antes, use a senha que criou.', 'error');
                            }
                        } else {
                            return showModal('Erro no Registo', err.message, 'error');
                        }
                    }

                    const newClient = { id: user.uid, name, email, phone: phoneRaw, avatar: '' };
                    await runTransaction(ref(rtdb, basePath + '/clients'), (cur) => {
                        const list = toList(cur);
                        if (!list.some(c => c.id === user.uid)) {
                            list.push(newClient);
                        }
                        return list;
                    });
                } else {
                    try {
                        const userCred = await signInWithEmailAndPassword(auth, email, pass);
                        const user = userCred.user;
                        
                        await runTransaction(ref(rtdb, basePath + '/clients'), (cur) => {
                            const list = toList(cur);
                            if (!list.some(c => c.id === user.uid)) {
                                list.push({ id: user.uid, name: user.displayName || email.split('@')[0], email, phone: '', avatar: '' });
                            }
                            return list;
                        });
                    } catch (err) {
                        showModal('Acesso Negado', 'E-mail ou senha incorretos.', 'error');
                    }
                }
            };

            // ==========================================
            // LÓGICA DO CROPPER ESTILO WHATSAPP (VANILLA)
            // ==========================================
            let cropScale = 1;
            let cropX = 0;
            let cropY = 0;
            let isDraggingCrop = false;
            let startX, startY;

            window.handleClientAvatarUpload = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = document.getElementById('cropper-img');
                    img.src = event.target.result;
                    
                    img.onload = () => {
                        cropScale = 1; 
                        cropX = 0; 
                        cropY = 0;
                        document.getElementById('cropper-zoom').value = 1;
                        
                        const container = document.getElementById('cropper-container');
                        const iRatio = img.naturalWidth / img.naturalHeight;
                        const cRatio = container.offsetWidth / container.offsetHeight;
                        
                        if (iRatio > cRatio) {
                            img.style.height = '100%';
                            img.style.width = 'auto';
                        } else {
                            img.style.width = '100%';
                            img.style.height = 'auto';
                        }

                        updateCropperTransform();
                        document.getElementById('cropper-modal').classList.remove('hidden');
                        if(window.lucide) lucide.createIcons();
                    }
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            window.updateCropperTransform = function() {
                const img = document.getElementById('cropper-img');
                img.style.transform = `translate(${cropX}px, ${cropY}px) scale(${cropScale})`;
            };

            const zoomInput = document.getElementById('cropper-zoom');
            if(zoomInput) {
                zoomInput.addEventListener('input', (e) => {
                    cropScale = parseFloat(e.target.value);
                    updateCropperTransform();
                });
            }

            const cropperContainer = document.getElementById('cropper-container');
            
            function startDragCrop(clientX, clientY) {
                isDraggingCrop = true;
                startX = clientX - cropX;
                startY = clientY - cropY;
            }
            
            function dragCrop(clientX, clientY) {
                if(!isDraggingCrop) return;
                cropX = clientX - startX;
                cropY = clientY - startY;
                updateCropperTransform();
            }

            function stopDragCrop() { 
                isDraggingCrop = false; 
            }

            if(cropperContainer) {
                cropperContainer.addEventListener('mousedown', e => startDragCrop(e.clientX, e.clientY));
                window.addEventListener('mousemove', e => dragCrop(e.clientX, e.clientY));
                window.addEventListener('mouseup', stopDragCrop);

                cropperContainer.addEventListener('touchstart', e => startDragCrop(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
                cropperContainer.addEventListener('touchmove', e => { 
                    if(isDraggingCrop) {
                        e.preventDefault();
                        dragCrop(e.touches[0].clientX, e.touches[0].clientY); 
                    }
                }, {passive: false});
                cropperContainer.addEventListener('touchend', stopDragCrop);
            }

            window.closeCropper = function() {
                document.getElementById('cropper-modal').classList.add('hidden');
            };

            window.applyCrop = function() {
                const mask = document.querySelector('.cropper-mask');
                const img = document.getElementById('cropper-img');
                
                const cRect = mask.getBoundingClientRect();
                const iRect = img.getBoundingClientRect();
                
                const canvas = document.createElement('canvas');
                const SIZE = 400;
                canvas.width = SIZE;
                canvas.height = SIZE;
                const ctx = canvas.getContext('2d');
                
                const scaleX = img.naturalWidth / iRect.width;
                const scaleY = img.naturalHeight / iRect.height;
                
                let cropX_img = (cRect.left - iRect.left) * scaleX;
                let cropY_img = (cRect.top - iRect.top) * scaleY;
                let cropW_img = cRect.width * scaleX;
                let cropH_img = cRect.height * scaleY;
                
                ctx.fillStyle = '#ffffff'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, cropX_img, cropY_img, cropW_img, cropH_img, 0, 0, SIZE, SIZE);
                
                const base64 = canvas.toDataURL('image/jpeg', 0.85);
                currentClient.avatar = base64;
                
                delete currentClient.avatarScale; 
                delete currentClient.avatarPosX;
                delete currentClient.avatarPosY;
                
                updateClientInDatabase()
                    .then(() => {
                        closeCropper();
                        render();
                        showModal('Foto Atualizada!', 'Sua foto de perfil foi ajustada e salva com sucesso.', 'success');
                    })
                    .catch(() => showModal('Erro', 'Não foi possível salvar a foto. Tente novamente.', 'error'));
            };

            function renderClientBookingWizard() {

                    const resched = clientBooking.resched;
                    
                    const currentYear = today.getFullYear();
                    const currentMonth = today.getMonth();

                    const canGoPrev = clientCalYear > currentYear || (clientCalYear === currentYear && clientCalMonth > currentMonth);

                                        <p class="font-bold text-amber-900 mb-1 flex items-center"><i data-lucide="alert-circle" class="w-4 h-4 mr-1 text-amber-600"></i> Você já possui um agendamento neste horário/faixa de tempo!</p>
                                        <p class="text-amber-800 mb-3">Para prosseguir, confirme se este agendamento é para outra pessoa (filho, acompanhante, etc.):</p>
                                        
                                        <label class="block font-bold text-slate-700 mb-1">Nome Completo do Atendido *</label>
                                        <input type="text" id="beneficiary-name-inp" value="${esc(clientBooking.beneficiaryName)}" oninput="clientBooking.beneficiaryName = this.value" placeholder="Ex: João da Silva" class="w-full px-3 py-2 bg-white border rounded-xl outline-none focus:border-indigo-500 text-slate-800 font-semibold">
                                    </div>
                                ` : ''}

                                <button onclick="clientFinalize()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl shadow-lg transition-all">${resched ? 'Confirmar Reagendamento' : 'Confirmar Agendamento'}</button>
                            ` : ''}
                        </div>`;
                }
            }

            window.clientGoStep3 = function() {
                const checks = Array.from(document.querySelectorAll('.c-proc-check:checked')).map(c => c.value);
                if (checks.length === 0) return showModal('Aviso', 'Selecione pelo menos um serviço.', 'info');

                // Evita o beco sem saída: precisa existir ao menos um profissional que faça TODOS os serviços marcados
                if (t.employees && t.employees.length > 0) {
                    const someoneDoesAll = t.employees.some(emp =>
                        checks.every(pid => emp.procedures && emp.procedures.includes(pid)) &&
                        doesEmployeeWorkOnDate(emp, clientBooking.date)
                    );
                    if (!someoneDoesAll) {
                        return showModal('Combinação indisponível',
                            'Nenhum profissional faz todos esses serviços juntos neste dia. Tente marcar menos serviços ou escolher outro dia.', 'info');
                    }
                }

                clientBooking.procedures = checks;
                clientBooking.time = null;
                if (!t.employees || t.employees.length === 0) { clientBooking.employeeId = t.admin.id; clientBooking.step = 4; } 
                else { clientBooking.step = 3; }
                render();
            };

            window.clientFinalize = function() {
                if (!clientBooking.time) return showModal('Aviso', 'Selecione um horário.', 'info');

                const resched = clientBooking.resched;
                const selectedProcs = resched ? [] : t.procedures.filter(p => clientBooking.procedures.includes(p.id));
                const totalDuration = resched ? resched.totalDuration : selectedProcs.reduce((s, p) => s + p.duration, 0);
                const totalPrice = resched ? resched.totalPrice : selectedProcs.reduce((s, p) => s + p.price, 0);
                const serviceNames = resched ? resched.proceduresNames : selectedProcs.map(p => p.name);

                // confere de novo se o horário continua livre (outra pessoa pode ter agendado)
                const slot = getBookingSlots(clientBooking.employeeId, clientBooking.date, totalDuration, clientBooking.procedures).find(s => s.time === clientBooking.time);
                if (!slot || (resched && slot.hasClientCollision)) {
                    clientBooking.time = null;
                    render();
                    return showModal('Horário indisponível', 'Esse horário acabou de ser ocupado ou já passou. Escolha outro horário.', 'error');
                }

                const bookedDate = clientBooking.date, bookedTime = clientBooking.time;

                // ---------- REAGENDAR ----------
                if (resched) {
                    const reschedEmp = getEmployeeById(resched.employeeId);
                    rescheduleAppointment(resched.id, bookedDate, bookedTime).then(res => {
                        if (!res.ok) {
                            clientBooking.time = null;
                            render();
                            if (res.reason === 'missing') return showModal('Não foi possível reagendar', 'Este agendamento não está mais ativo. Confira a aba Meus horários.', 'error');
                            return showModal('Horário indisponível', 'Esse horário acabou de ser ocupado por outra pessoa. Escolha outro horário.', 'error');
                        }
                        const link = calendarLinkHtml(serviceNames.join(', ') + ' - ' + t.name, bookedDate, bookedTime, totalDuration, 'Profissional: ' + (reschedEmp ? reschedEmp.name : ''));
                        showModal('Reagendado!', `Seu agendamento foi movido para ${formatDateBR(bookedDate)} às ${esc(bookedTime)}.<br>${link}`, 'success', () => {
                            resetBooking();
                            clientActiveTab = 'appointments';
                            render();
                        });
                    }).catch(() => showModal('Erro de conexão', 'Não foi possível reagendar. Verifique sua internet e tente de novo.', 'error'));
                    return;
                }

                // ---------- NOVO AGENDAMENTO ----------
                let finalBeneficiary = currentClient.name;
                if (slot.hasClientCollision || clientBooking.isForOther) {
                    const inpVal = document.getElementById('beneficiary-name-inp')?.value.trim();
                    if (!inpVal || inpVal.length < 3) {
                        return showModal('Aviso Necessário', 'Por favor, informe o Nome Completo da pessoa que receberá o atendimento.', 'error');
                    }
                    finalBeneficiary = inpVal;
                }

                let finalEmpId = clientBooking.employeeId;
                if (finalEmpId === 'any') finalEmpId = resolveEmployeeForTime(clientBooking.date, totalDuration, clientBooking.procedures, clientBooking.time);
                if (!finalEmpId) {
                    clientBooking.time = null;
                    render();
                    return showModal('Horário indisponível', 'Esse horário acabou de ser ocupado. Escolha outro horário.', 'error');
                }
                const finalEmp = getEmployeeById(finalEmpId);

                const newApp = { 
                    id: 'app-' + Date.now(), 
                    clientId: currentClient.id, 
                    clientName: currentClient.name,
                    beneficiaryName: finalBeneficiary,
                    clientPhone: currentClient.phone || '', 
                    employeeId: finalEmpId, 
                    date: clientBooking.date, 
                    time: clientBooking.time, 
                    proceduresNames: serviceNames, 
                    totalDuration, 
                    totalPrice, 
                    createdAt: new Date().toISOString() 
                };
                const forOther = finalBeneficiary !== currentClient.name;

                createAppointment(newApp).then(result => {
                    if (!result.ok) {
                        clientBooking.time = null;
                        render();
                        return showModal('Horário indisponível', 'Esse horário acabou de ser ocupado por outra pessoa. Escolha outro horário.', 'error');
                    }
                    const link = calendarLinkHtml(serviceNames.join(', ') + ' - ' + t.name, bookedDate, bookedTime, totalDuration, 'Profissional: ' + (finalEmp ? finalEmp.name : ''));
                    showModal('Sucesso!', `Agendamento confirmado para ${formatDateBR(bookedDate)} às ${esc(bookedTime)}${forOther ? ` (Para: ${esc(finalBeneficiary)})` : ''}!<br>${link}`, 'success', () => {
                        resetBooking();
                        clientActiveTab = 'appointments'; 
                        render();
                    });
                }).catch(() => showModal('Erro de conexão', 'Não foi possível confirmar o agendamento. Verifique sua internet e tente de novo.', 'error'));
            };
        }
    </script>
</body>
</html>
