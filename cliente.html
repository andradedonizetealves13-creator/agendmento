<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaPro - Agendamento do Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-bg: #E8C5D0;
            --theme-primary: #4A0E2E;
            --theme-primary-hover: #2D081B;
            --theme-secondary: #B56B82;
            --theme-text-primary: #2A0515;
            --bg-image: none;
            --bg-opacity: 0.15;
            --bg-blur: 0px;
        }
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            min-height: 100vh; 
            font-family: 'Inter', sans-serif; 
            background-color: var(--theme-bg) !important; 
            transition: background-color 0.3s ease;
            position: relative;
        }
        #custom-bg-layer {
            position: fixed;
            inset: 0;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            opacity: var(--bg-opacity);
            filter: blur(var(--bg-blur));
            pointer-events: none;
            z-index: 0;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-theme-primary { 
            background-color: var(--theme-primary) !important; 
            color: #ffffff !important; 
        }
        .btn-theme-primary:hover { 
            background-color: var(--theme-primary-hover) !important; 
        }
        .bg-theme-secondary { 
            background-color: var(--theme-secondary) !important; 
        }
        .text-theme-primary { 
            color: var(--theme-primary) !important; 
        }
        .border-theme-primary {
            border-color: var(--theme-primary) !important;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen w-full flex overflow-x-hidden">

    <div id="custom-bg-layer"></div>

    <div id="app" class="min-h-screen w-full flex flex-col items-center justify-center p-4 relative z-10">
        <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-sm text-slate-500 font-medium">Carregando agendamentos...</p>
    </div>

    <div id="custom-modal" class="hidden fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 fade-in">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            <div id="modal-icon-container" class="mb-4 flex items-center justify-center w-12 h-12 rounded-full mx-auto"></div>
            <h3 id="modal-title" class="text-lg font-bold text-slate-900 text-center mb-2"></h3>
            <div id="modal-message" class="text-slate-600 text-center text-sm mb-6 max-h-[60vh] overflow-y-auto custom-scrollbar"></div>
            <div id="modal-buttons" class="flex justify-end space-x-3"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const THEME_PALETTES = [
            { id: 'wine_velvet', bg: '#E8C5D0', primary: '#4A0E2E', primaryHover: '#2D081B', secondary: '#B56B82', dark: '#2A0515' },
            { id: 'indigo_classic', bg: '#f8fafc', primary: '#4f46e5', primaryHover: '#4338ca', secondary: '#e0e7ff', dark: '#1e1b4b' },
            { id: 'emerald_nature', bg: '#e6f4ea', primary: '#059669', primaryHover: '#047857', secondary: '#a7f3d0', dark: '#064e3b' },
            { id: 'amber_gold', bg: '#fef3c7', primary: '#d97706', primaryHover: '#b45309', secondary: '#fde68a', dark: '#78350f' },
            { id: 'slate_dark', bg: '#f1f5f9', primary: '#334155', primaryHover: '#1e293b', secondary: '#cbd5e1', dark: '#0f172a' }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const orgSlug = urlParams.get('org');

        if (!orgSlug) {
            document.getElementById('app').innerHTML = `<div class="bg-white p-8 rounded-3xl shadow-xl border text-center max-w-md w-full"><h2 class="text-xl font-bold text-rose-600 mb-2">Link Inválido</h2><p class="text-slate-500 text-sm">Nenhuma organização foi especificada no link de agendamento.</p></div>`;
        } else {
            const firebaseConfig = {
                apiKey: "AIzaSyCcqtIOZ1E5O--gKxOfKofE0LwQeKPtBzs",
                authDomain: "agenda-16a31.firebaseapp.com",
                databaseURL: "https://agenda-16a31-default-rtdb.firebaseio.com",
                projectId: "agenda-16a31",
                storageBucket: "agenda-16a31.firebasestorage.app",
                messagingSenderId: "865554229500",
                appId: "1:865554229500:web:f786ebd6f0d0781019cf79"
            };

            const app = initializeApp(firebaseConfig);
            const rtdb = getDatabase(app);
            const tenantRef = ref(rtdb, 'agendapro_saas/tenants/' + orgSlug);

            window.t = null;
            window.tenantRef = tenantRef;
            window.clientAuthMode = 'login';
            window.clientActiveTab = 'book';
            window.clientBooking = { step: 1, date: null, procedures: [], employeeId: null, time: null, isForOther: false, beneficiaryName: '' };
            window.clientCalYear = new Date().getFullYear();
            window.clientCalMonth = new Date().getMonth();
            window.showHistoryApps = false;

            const savedClient = localStorage.getItem('agendaProClient_' + orgSlug);
            window.currentClient = savedClient ? JSON.parse(savedClient) : null;

            onValue(tenantRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    document.getElementById('app').innerHTML = `<div class="bg-white p-8 rounded-3xl shadow-xl border text-center max-w-md w-full"><h2 class="text-xl font-bold text-rose-600 mb-2">Empresa não encontrada</h2><p class="text-slate-500 text-sm">A empresa informada não existe no sistema.</p></div>`;
                    return;
                }
                window.t = data;
                if (!t.clients) t.clients = [];
                if (!t.appointments) t.appointments = [];
                if (!t.procedures) t.procedures = [];
                if (!t.employees) t.employees = [];
                
                applyThemeCSS(t.themePalette || 'wine_velvet');
                applyBgImageSettings();
                render();
            });

            function applyThemeCSS(paletteId) {
                const palette = THEME_PALETTES.find(p => p.id === paletteId) || THEME_PALETTES[0];
                document.documentElement.style.setProperty('--theme-bg', palette.bg);
                document.documentElement.style.setProperty('--theme-primary', palette.primary);
                document.documentElement.style.setProperty('--theme-primary-hover', palette.primaryHover);
                document.documentElement.style.setProperty('--theme-secondary', palette.secondary);
                document.documentElement.style.setProperty('--theme-text-primary', palette.dark);
            }

            function applyBgImageSettings() {
                if (t.bgCustomImage) {
                    document.documentElement.style.setProperty('--bg-image', `url(${t.bgCustomImage})`);
                    document.documentElement.style.setProperty('--bg-opacity', t.bgCustomOpacity !== undefined ? t.bgCustomOpacity : 0.15);
                    document.documentElement.style.setProperty('--bg-blur', (t.bgCustomBlur || 0) + 'px');
                } else {
                    document.documentElement.style.setProperty('--bg-image', 'none');
                }
            }

            window.saveDB = function() { set(tenantRef, window.t); };
            window.formatDateBR = function(dateStr) { return dateStr.split('-').reverse().join('/'); };
            window.timeToMins = function(t) { const [h,m] = t.split(':'); return parseInt(h)*60 + parseInt(m); };
            window.minsToTime = function(m) { const h = Math.floor(m/60).toString().padStart(2,'0'); const mins = (m%60).toString().padStart(2,'0'); return `${h}:${mins}`; };

            window.getEffectiveAppStatus = function(appItem) {
                if (appItem.status === 'cancelado') return 'cancelado';
                if (appItem.status === 'nao_compareceu') return 'nao_compareceu';
                if (appItem.status === 'realizado') return 'realizado';
                const appDateTime = new Date(appItem.date + 'T' + appItem.time);
                if (appDateTime < new Date()) return 'realizado';
                return 'agendado';
            };

            window.doesEmployeeWorkOnDate = function(emp, dateStr) {
                if (emp.exceptions && emp.exceptions[dateStr]) {
                    if (emp.exceptions[dateStr].type === 'folga') return false;
                    if (emp.exceptions[dateStr].type === 'plantao') return true;
                }
                if (t.admin.exceptions && t.admin.exceptions[dateStr]) {
                    if (t.admin.exceptions[dateStr].type === 'folga') return false;
                    if (t.admin.exceptions[dateStr].type === 'plantao') return true;
                }
                const [y, m, d] = dateStr.split('-'); const dayOfWeek = new Date(y, m - 1, d).getDay(); 
                const whSource = emp.workingHours || t.admin.workingHours;
                return whSource?.[dayOfWeek]?.active !== false;
            };

            window.isDateAllowedByMonthlyRule = function(cellDate) {
                const today = new Date();
                today.setHours(0,0,0,0);

                if (cellDate < today) return false;

                const currentYear = today.getFullYear();
                const currentMonth = today.getMonth();
                const cellYear = cellDate.getFullYear();
                const cellMonth = cellDate.getMonth();
                const cellDay = cellDate.getDate();

                const totalDaysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
                const isLastWeekOfCurrentMonth = today.getDate() > (totalDaysInCurrentMonth - 7);

                if (cellYear === currentYear && cellMonth === currentMonth) {
                    return true;
                }

                const nextMonthDate = new Date(currentYear, currentMonth + 1, 1);
                if (cellYear === nextMonthDate.getFullYear() && cellMonth === nextMonthDate.getMonth()) {
                    if (!isLastWeekOfCurrentMonth) return false;
                    const totalDaysInNextMonth = new Date(cellYear, cellMonth + 1, 0).getDate();
                    if (cellDay > (totalDaysInNextMonth - 7)) return false;
                    return true;
                }

                return false;
            };

            window.isCompanyOpenOnDate = function(dateStr) {
                const cellDate = new Date(dateStr + 'T00:00:00');
                if (!isDateAllowedByMonthlyRule(cellDate)) return false;

                if (t.employees && t.employees.length > 0) {
                    return t.employees.some(emp => doesEmployeeWorkOnDate(emp, dateStr));
                }
                return doesEmployeeWorkOnDate(t.admin, dateStr);
            };

            window.doesClientHaveCollision = function(dateStr, startMins, durationMins) {
                if (!currentClient) return false;
                const clientApps = t.appointments.filter(a => a.clientId === currentClient.id && a.date === dateStr && a.status !== 'cancelado');
                const endMins = startMins + durationMins;

                for (let a of clientApps) {
                    const aStart = timeToMins(a.time);
                    const aEnd = aStart + a.totalDuration;
                    if (startMins < aEnd && endMins > aStart) {
                        return true;
                    }
                }
                return false;
            };

            window.getAvailableTimeSlots = function(empId, dateStr, durationMins) {
                const emp = empId === t.admin.id ? t.admin : (t.employees || []).find(e => e.id === empId);
                if(!emp || !doesEmployeeWorkOnDate(emp, dateStr)) return [];
                
                let start = '09:00', end = '18:00';
                const excEmp = emp.exceptions?.[dateStr];
                const excAdmin = t.admin.exceptions?.[dateStr];

                if (excEmp && excEmp.type === 'plantao') { start = excEmp.start; end = excEmp.end; }
                else if (excAdmin && excAdmin.type === 'plantao') { start = excAdmin.start; end = excAdmin.end; }
                else {
                    const [y, m, d] = dateStr.split('-'); const dayOfWeek = new Date(y, m - 1, d).getDay();
                    const wh = emp.workingHours?.[dayOfWeek] || t.admin.workingHours?.[dayOfWeek];
                    if(wh && wh.active) { start = wh.start; end = wh.end; } else return [];
                }

                const startMins = timeToMins(start); const endMins = timeToMins(end);
                const empApps = (t.appointments || []).filter(a => a.employeeId === empId && a.date === dateStr && a.status !== 'cancelado');
                const slots = [];

                for(let m = startMins; m <= endMins - durationMins; m += 30) {
                    let overlap = false;
                    const slotEnd = m + durationMins;
                    
                    for(let a of empApps) {
                        const aStart = timeToMins(a.time); const aEnd = aStart + a.totalDuration;
                        if(m < aEnd && slotEnd > aStart) { overlap = true; break; }
                    }

                    if(!overlap) {
                        slots.push({
                            time: minsToTime(m),
                            hasClientCollision: doesClientHaveCollision(dateStr, m, durationMins)
                        });
                    }
                }
                return slots;
            };

            window.showModal = function(title, message, type = 'info', onConfirm = null) {
                const modal = document.getElementById('custom-modal');
                const iconContainer = document.getElementById('modal-icon-container');
                const buttonsContainer = document.getElementById('modal-buttons');
                iconContainer.classList.remove('hidden');
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-message').innerHTML = message;
                if (type === 'success') { iconContainer.className = 'mb-4 flex items-center justify-center w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 mx-auto'; iconContainer.innerHTML = '<i data-lucide="check-circle" class="w-6 h-6"></i>'; }
                else if (type === 'error') { iconContainer.className = 'mb-4 flex items-center justify-center w-12 h-12 rounded-full bg-rose-50 text-rose-600 mx-auto'; iconContainer.innerHTML = '<i data-lucide="alert-triangle" class="w-6 h-6"></i>'; }
                else { iconContainer.className = 'mb-4 flex items-center justify-center w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 mx-auto'; iconContainer.innerHTML = '<i data-lucide="info" class="w-6 h-6"></i>'; }

                if (onConfirm) {
                    buttonsContainer.innerHTML = `<button onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-medium">Cancelar</button><button id="btn-confirm" class="flex-1 btn-theme-primary py-3 rounded-xl font-medium">Confirmar</button>`;
                    document.getElementById('btn-confirm').onclick = () => { closeModal(); onConfirm(); };
                } else { buttonsContainer.innerHTML = `<button onclick="closeModal()" class="w-full btn-theme-primary py-3 rounded-xl font-medium">OK</button>`; }
                modal.classList.remove('hidden'); if(window.lucide) lucide.createIcons();
            };
            window.closeModal = function() { document.getElementById('custom-modal').classList.add('hidden'); };

            window.render = function() {
                const appDiv = document.getElementById('app');
                if (!currentClient) { appDiv.innerHTML = renderClientAuth(); } 
                else { appDiv.innerHTML = renderClientApp(); }
                if(window.lucide) lucide.createIcons();
            };

            function renderClientAuth() {
                const logoHtml = t.logo ? `<img src="${t.logo}" class="h-16 w-auto rounded-xl object-contain mx-auto mb-4 border shadow-sm">` : `<div class="w-16 h-16 rounded-xl btn-theme-primary flex items-center justify-center font-bold mx-auto mb-4 shadow-md text-2xl">O</div>`;
                return `
                    <div class="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-xl border border-slate-100 max-w-md w-full my-auto fade-in z-10">
                        <div class="text-center mb-6">${logoHtml}<h1 class="text-2xl font-bold text-slate-900">${t.name}</h1><p class="text-sm text-slate-500 mt-1">Área do Cliente</p></div>
                        <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                            <button onclick="clientAuthMode='login';render()" class="flex-1 py-2 text-xs sm:text-sm font-medium rounded-lg ${clientAuthMode==='login'?'bg-white text-theme-primary font-bold shadow-sm':'text-slate-600'}">Entrar</button>
                            <button onclick="clientAuthMode='register';render()" class="flex-1 py-2 text-xs sm:text-sm font-medium rounded-lg ${clientAuthMode==='register'?'bg-white text-theme-primary font-bold shadow-sm':'text-slate-600'}">Criar Conta</button>
                        </div>
                        <form onsubmit="handleClientAuthSubmit(event)" class="space-y-3">
                            ${clientAuthMode==='register' ? `<div><label class="block text-xs font-semibold mb-1">Nome Completo</label><input type="text" id="c-auth-name" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm outline-none"></div><div><label class="block text-xs font-semibold mb-1">Telefone / WhatsApp</label><input type="text" id="c-auth-phone" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm outline-none"></div>` : ''}
                            <div><label class="block text-xs font-semibold mb-1">E-mail</label><input type="email" id="c-auth-email" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm outline-none"></div>
                            <div><label class="block text-xs font-semibold mb-1">Senha</label><input type="password" id="c-auth-pass" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm outline-none"></div>
                            <button type="submit" class="w-full btn-theme-primary font-bold py-3.5 rounded-xl shadow-md mt-4">${clientAuthMode==='login'?'Entrar':'Criar Conta'}</button>
                        </form>
                    </div>`;
            }

            window.handleClientAuthSubmit = function(e) {
                e.preventDefault();
                const email = document.getElementById('c-auth-email').value.trim();
                const pass = document.getElementById('c-auth-pass').value.trim();

                if(clientAuthMode === 'register') {
                    const name = document.getElementById('c-auth-name').value.trim();
                    const phone = document.getElementById('c-auth-phone').value.trim();
                    if(t.clients.find(c => c.email === email)) return showModal('Erro', 'E-mail já cadastrado.', 'error');
                    const newClient = { id: 'cli-'+Date.now(), name, email, phone, password: pass };
                    t.clients.push(newClient); saveDB();
                    currentClient = newClient; localStorage.setItem('agendaProClient_' + orgSlug, JSON.stringify(currentClient));
                    render();
                } else {
                    const client = t.clients.find(c => c.email === email && c.password === pass);
                    if(client) {
                        currentClient = client; localStorage.setItem('agendaProClient_' + orgSlug, JSON.stringify(currentClient));
                        render();
                    } else { showModal('Acesso Negado', 'E-mail ou senha incorretos.', 'error'); }
                }
            };

            window.clientLogout = function() { localStorage.removeItem('agendaProClient_' + orgSlug); currentClient = null; render(); };

            // ESTRUTURA COM MENU LATERAL DE ÍCONES + LOGO E NOME CENTRALIZADOS
            function renderClientApp() {
                const logoHtml = t.logo ? `<img src="${t.logo}" class="w-20 h-20 rounded-2xl object-cover border-2 border-white shadow-md mx-auto mb-3">` : `<div class="w-20 h-20 rounded-2xl btn-theme-primary flex items-center justify-center font-black text-2xl shadow-md mx-auto mb-3 border-2 border-white">O</div>`;

                return `
                    <div class="min-h-screen w-full flex relative z-10">
                        <!-- MENU LATERAL APENAS COM ÍCONES -->
                        <aside class="w-16 sm:w-20 bg-white/90 backdrop-blur-md border-r border-slate-200/80 h-screen sticky top-0 flex flex-col items-center py-6 shadow-md shrink-0 justify-between">
                            <div class="space-y-6 flex flex-col items-center w-full">
                                <div class="w-10 h-10 rounded-xl btn-theme-primary flex items-center justify-center font-black text-lg shadow-sm mb-4">
                                    ${t.name.charAt(0)}
                                </div>
                                
                                <button onclick="clientActiveTab='book';render()" class="p-3 rounded-2xl transition-all ${clientActiveTab==='book'?'bg-theme-secondary text-theme-primary font-bold shadow-sm':'text-slate-400 hover:text-slate-700 hover:bg-slate-100'}" title="Novo Agendamento">
                                    <i data-lucide="calendar-plus" class="w-6 h-6"></i>
                                </button>

                                <button onclick="clientActiveTab='appointments';render()" class="p-3 rounded-2xl transition-all ${clientActiveTab==='appointments'?'bg-theme-secondary text-theme-primary font-bold shadow-sm':'text-slate-400 hover:text-slate-700 hover:bg-slate-100'}" title="Meus Agendamentos">
                                    <i data-lucide="list" class="w-6 h-6"></i>
                                </button>
                            </div>

                            <button onclick="clientLogout()" class="p-3 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-2xl transition-all" title="Sair">
                                <i data-lucide="log-out" class="w-6 h-6"></i>
                            </button>
                        </aside>

                        <!-- CONTEÚDO PRINCIPAL COM CABEÇALHO CENTRALIZADO -->
                        <main class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
                            <div class="max-w-3xl mx-auto flex flex-col items-center text-center mb-8">
                                ${logoHtml}
                                <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">${t.name}</h1>
                                <p class="text-xs font-bold text-theme-primary uppercase tracking-wider mt-1">Área de Agendamento</p>
                                <span class="text-xs text-slate-500 font-semibold bg-white/70 px-3 py-1 rounded-full border mt-2 shadow-xs">Conectado como: <b>${currentClient.name}</b></span>
                            </div>

                            ${clientActiveTab === 'appointments' ? renderClientAppointments() : renderClientBookingWizard()}
                        </main>
                    </div>`;
            }

            function renderClientAppointments() {
                const allApps = (t.appointments || [])
                    .filter(a => a.clientId === currentClient.id)
                    .sort((a,b) => new Date(b.date+'T'+b.time) - new Date(a.date+'T'+a.time));

                const activeApps = allApps.filter(a => getEffectiveAppStatus(a) === 'agendado');
                const historyApps = allApps.filter(a => getEffectiveAppStatus(a) !== 'agendado');

                return `
                    <div class="max-w-2xl mx-auto fade-in space-y-6">
                        <div>
                            <h2 class="text-2xl font-black mb-4 text-slate-900">Meus Agendamentos Próximos</h2>
                            <div class="space-y-4">
                                ${activeApps.length === 0 ? `
                                    <div class="bg-white/90 backdrop-blur-md p-8 rounded-2xl border text-center shadow-sm">
                                        <p class="text-slate-500 font-medium">Você não possui agendamentos futuros pendentes.</p>
                                        <button onclick="clientActiveTab='book';render()" class="mt-3 text-sm font-bold text-theme-primary hover:underline">Fazer novo agendamento agora</button>
                                    </div>
                                ` : activeApps.map(a => {
                                    const emp = a.employeeId === t.admin.id ? t.admin : (t.employees || []).find(e=>e.id===a.employeeId);
                                    const isDependent = a.beneficiaryName && a.beneficiaryName.trim() !== '' && a.beneficiaryName !== currentClient.name;
                                    return `
                                        <div class="bg-white/90 backdrop-blur-md p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-center gap-4 hover:border-slate-300 transition-colors">
                                            <div>
                                                <div class="flex items-center space-x-2 mb-1">
                                                    <span class="bg-theme-secondary text-theme-primary text-xs font-bold px-2.5 py-1 rounded-lg">${formatDateBR(a.date)} às ${a.time}</span>
                                                    <span class="text-xs text-slate-500 font-medium">${a.totalDuration} min</span>
                                                </div>
                                                <p class="font-bold text-slate-800 text-lg leading-tight mt-1">${a.proceduresNames.join(', ')}</p>
                                                <p class="text-sm text-slate-500 mt-1">Com <b>${emp?emp.name:'Equipe'}</b> ${isDependent ? `<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded ml-2">Para: ${a.beneficiaryName}</span>` : ''}</p>
                                            </div>
                                            <div class="flex md:flex-col items-end justify-between w-full md:w-auto border-t md:border-0 pt-3 md:pt-0">
                                                <span class="font-black text-emerald-600 text-lg mb-2">R$ ${a.totalPrice.toFixed(2)}</span>
                                                <button onclick="cancelClientApp('${a.id}')" class="text-xs bg-rose-50 text-rose-600 hover:bg-rose-100 font-bold px-4 py-2 rounded-xl border border-rose-200 transition-colors">Cancelar</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="pt-4 text-center">
                            <button onclick="showHistoryApps = !showHistoryApps; render()" class="bg-white/90 backdrop-blur-md hover:bg-slate-50 text-slate-700 border font-bold px-6 py-3 rounded-2xl text-xs shadow-sm transition-all flex items-center justify-center mx-auto space-x-2">
                                <i data-lucide="${showHistoryApps ? 'chevron-up' : 'history'}" class="w-4 h-4"></i>
                                <span>${showHistoryApps ? 'Ocultar Histórico' : 'Carregar Agendamentos Antigos / Histórico'}</span>
                            </button>
                        </div>

                        ${showHistoryApps ? `
                            <div class="pt-4 border-t border-slate-200/60 fade-in">
                                <h3 class="text-lg font-bold text-slate-700 mb-3 flex items-center">
                                    <i data-lucide="archive" class="w-5 h-5 mr-2 text-slate-400"></i>
                                    Histórico (Concluídos, Cancelados ou Faltas)
                                </h3>
                                <div class="space-y-3">
                                    ${historyApps.length === 0 ? `
                                        <p class="text-xs text-slate-400 text-center py-4 bg-white/60 rounded-xl border">Nenhum histórico de agendamentos antigos registrado.</p>
                                    ` : historyApps.map(a => {
                                        const st = getEffectiveAppStatus(a);
                                        const emp = a.employeeId === t.admin.id ? t.admin : (t.employees || []).find(e=>e.id===a.employeeId);
                                        
                                        let statusTag = `<span class="bg-emerald-50 text-emerald-700 border-emerald-200 border text-[10px] font-bold px-2.5 py-1 rounded-full">Concluído</span>`;
                                        if (st === 'cancelado') statusTag = `<span class="bg-rose-50 text-rose-700 border-rose-200 border text-[10px] font-bold px-2.5 py-1 rounded-full">Cancelado</span>`;
                                        else if (st === 'nao_compareceu') statusTag = `<span class="bg-amber-50 text-amber-700 border-amber-200 border text-[10px] font-bold px-2.5 py-1 rounded-full">Não Compareceu</span>`;

                                        return `
                                            <div class="bg-white/80 p-4 rounded-2xl border shadow-xs flex justify-between items-center opacity-85">
                                                <div>
                                                    <div class="flex items-center space-x-2 mb-1">
                                                        <span class="text-xs font-bold text-slate-600">${formatDateBR(a.date)} às ${a.time}</span>
                                                        ${statusTag}
                                                    </div>
                                                    <p class="font-bold text-slate-800 text-sm">${a.proceduresNames.join(', ')}</p>
                                                    <p class="text-xs text-slate-500 mt-0.5">Com ${emp?emp.name:'Equipe'}</p>
                                                </div>
                                                <div class="text-right">
                                                    <span class="font-bold text-slate-700 text-sm">R$ ${a.totalPrice.toFixed(2)}</span>
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            window.cancelClientApp = function(id) {
                showModal('Cancelar Agendamento', 'Tem certeza que deseja cancelar este agendamento?', 'error', () => {
                    const app = t.appointments.find(a => a.id === id);
                    if (app) {
                        app.status = 'cancelado';
                        saveDB();
                        showModal('Sucesso', 'O agendamento foi cancelado.', 'success');
                    }
                });
            };

            function renderClientBookingWizard() {
                if (clientBooking.step === 1) {
                    const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
                    const weekShortDays = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
                    const today = new Date(); today.setHours(0,0,0,0);
                    
                    const currentYear = today.getFullYear();
                    const currentMonth = today.getMonth();

                    const canGoPrev = clientCalYear > currentYear || (clientCalYear === currentYear && clientCalMonth > currentMonth);
                    const nextMonthCalc = new Date(currentYear, currentMonth + 1, 1);
                    const canGoNext = clientCalYear < nextMonthCalc.getFullYear() || (clientCalYear === nextMonthCalc.getFullYear() && clientCalMonth < nextMonthCalc.getMonth());

                    const firstDay = new Date(clientCalYear, clientCalMonth, 1).getDay();
                    const daysInMonth = new Date(clientCalYear, clientCalMonth + 1, 0).getDate();
                    const cells = [];
                    for (let i = 0; i < firstDay; i++) cells.push({ empty: true });
                    for (let d = 1; d <= daysInMonth; d++) {
                        const cellDate = new Date(clientCalYear, clientCalMonth, d);
                        const dateStr = `${clientCalYear}-${String(clientCalMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        
                        const isBlocked = !isCompanyOpenOnDate(dateStr);
                        cells.push({ empty: false, day: d, dateStr, isBlocked, isSelected: clientBooking.date === dateStr });
                    }
                    return `
                        <div class="max-w-lg mx-auto bg-white/90 backdrop-blur-md p-6 md:p-8 rounded-[2rem] shadow-xl border fade-in"><h2 class="text-2xl font-black text-center mb-6">Escolha o Dia</h2>
                            <div class="flex justify-between items-center mb-6 bg-slate-50 p-2.5 rounded-2xl border">
                                <button onclick="if(${canGoPrev}) { clientCalMonth--; if(clientCalMonth<0){clientCalMonth=11; clientCalYear--;} render(); }" class="${canGoPrev ? 'text-slate-700 hover:bg-slate-200' : 'text-slate-300 cursor-not-allowed'} p-1.5 rounded-xl"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                                <span class="text-sm font-black">${monthNames[clientCalMonth]} ${clientCalYear}</span>
                                <button onclick="if(${canGoNext}) { clientCalMonth++; if(clientCalMonth>11){clientCalMonth=0; clientCalYear++;} render(); }" class="${canGoNext ? 'text-slate-700 hover:bg-slate-200' : 'text-slate-300 cursor-not-allowed'} p-1.5 rounded-xl"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                            </div>
                            <div class="grid grid-cols-7 gap-1 text-center mb-2">${weekShortDays.map(w => `<span class="text-[11px] font-bold text-slate-400 uppercase">${w}</span>`).join('')}</div>
                            <div class="grid grid-cols-7 gap-1.5">${cells.map(c => c.empty ? `<div></div>` : c.isBlocked ? `<div class="h-11 flex items-center justify-center rounded-xl bg-slate-100 text-slate-300 text-xs select-none" title="Indisponível">${c.day}</div>` : `<button onclick="clientBooking.date='${c.dateStr}'; render()" class="h-11 flex items-center justify-center rounded-xl text-xs font-bold ${c.isSelected?'btn-theme-primary':'bg-white border text-slate-700 hover:bg-slate-50'}">${c.day}</button>`).join('')}</div>
                            ${clientBooking.date ? `<button onclick="clientBooking.step=2; render()" class="w-full btn-theme-primary font-bold py-3.5 rounded-xl shadow-lg mt-6">Continuar</button>` : ''}
                        </div>`;
                }
                else if (clientBooking.step === 2) {
                    const availableProcedures = t.procedures.filter(p => {
                        if (t.employees.length === 0) return doesEmployeeWorkOnDate(t.admin, clientBooking.date);
                        return t.employees.some(emp => emp.procedures && emp.procedures.includes(p.id) && doesEmployeeWorkOnDate(emp, clientBooking.date));
                    });

                    return `
                        <div class="max-w-md mx-auto bg-white/90 backdrop-blur-md p-6 md:p-8 rounded-[2rem] shadow-xl border fade-in">
                            <button onclick="clientBooking.step=1;render()" class="text-slate-400 mb-4"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
                            <h2 class="text-2xl font-black text-center mb-2">Escolha os Serviços</h2>
                            <p class="text-xs text-slate-400 text-center mb-6">Disponíveis para ${formatDateBR(clientBooking.date)}</p>
                            ${availableProcedures.length === 0 ? `
                                <div class="text-center py-8 bg-amber-50 rounded-2xl border border-amber-200 p-4">
                                    <p class="text-sm text-amber-800 font-bold">Nenhum serviço disponível para esta data.</p>
                                </div>
                            ` : `
                                <div class="space-y-3 max-h-[50vh] overflow-y-auto custom-scrollbar pr-1">${availableProcedures.map(p => `
                                    <label class="flex justify-between items-center p-4 border rounded-2xl cursor-pointer hover:bg-slate-50"><div class="flex items-center space-x-3"><input type="checkbox" value="${p.id}" ${clientBooking.procedures.includes(p.id)?'checked':''} class="c-proc-check w-5 h-5 text-indigo-600 rounded"><div><p class="font-bold text-sm">${p.name}</p><p class="text-xs text-slate-500">${p.duration} min</p></div></div><span class="font-bold text-emerald-600 text-sm">R$ ${p.price.toFixed(2)}</span></label>
                                `).join('')}</div>
                                <button onclick="clientGoStep3()" class="w-full btn-theme-primary font-bold py-4 rounded-2xl shadow-lg mt-6">Continuar</button>
                            `}
                        </div>`;
                }
                else if (clientBooking.step === 3) {
                    const empsAvailable = t.employees.filter(emp => 
                        clientBooking.procedures.every(pid => emp.procedures && emp.procedures.includes(pid)) && 
                        doesEmployeeWorkOnDate(emp, clientBooking.date)
                    );

                    return `
                        <div class="max-w-xl mx-auto bg-white/90 backdrop-blur-md p-6 md:p-8 rounded-[2rem] shadow-xl border fade-in">
                            <button onclick="clientBooking.step=2;render()" class="text-slate-400 mb-4"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
                            <h2 class="text-2xl font-black text-center mb-6">Quem vai te atender?</h2>
                            ${empsAvailable.length === 0 ? `
                                <div class="text-center py-8 bg-rose-50 rounded-2xl border border-rose-100 p-4">
                                    <p class="text-sm text-rose-800 font-bold">Nenhum profissional disponível na data escolhida.</p>
                                </div>
                            ` : `
                                <div class="grid grid-cols-2 gap-4">${empsAvailable.map(item => `
                                    <div onclick="clientBooking.employeeId='${item.id}'; clientBooking.step=4; render()" class="p-4 border rounded-2xl flex flex-col items-center cursor-pointer hover:border-indigo-600 bg-slate-50 transition-all">
                                        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-xl mb-2 overflow-hidden shrink-0 border border-slate-200">
                                            ${item.avatar ? `<img src="${item.avatar}" class="w-full h-full object-cover">` : `<span>${item.name.charAt(0)}</span>`}
                                        </div>
                                        <p class="font-bold text-sm text-center truncate w-full">${item.name}</p>
                                    </div>
                                `).join('')}</div>
                            `}
                        </div>`;
                }
                else if (clientBooking.step === 4) {
                    const selectedProcs = t.procedures.filter(p=>clientBooking.procedures.includes(p.id));
                    const totalDuration = selectedProcs.reduce((s, p)=>s+p.duration, 0);
                    const totalPrice = selectedProcs.reduce((s, p)=>s+p.price, 0);
                    const slots = getAvailableTimeSlots(clientBooking.employeeId, clientBooking.date, totalDuration);
                    const emp = clientBooking.employeeId === t.admin.id ? t.admin : t.employees.find(e => e.id === clientBooking.employeeId);
                    
                    const selectedSlotObj = slots.find(s => s.time === clientBooking.time);
                    const isColliding = selectedSlotObj && selectedSlotObj.hasClientCollision;

                    return `
                        <div class="max-w-md mx-auto bg-white/90 backdrop-blur-md p-6 md:p-8 rounded-[2rem] shadow-xl border fade-in">
                            <button onclick="clientBooking.step=${t.employees.length>0?3:2};render()" class="text-slate-400 mb-4"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
                            <h2 class="text-2xl font-black text-center mb-6">Confirmar Horário</h2>
                            <div class="bg-slate-50 p-4 rounded-2xl border mb-6 text-sm"><p><b>Data:</b> ${formatDateBR(clientBooking.date)}</p><p><b>Profissional:</b> ${emp?emp.name:'Equipe'}</p><p><b>Serviços:</b> ${selectedProcs.map(p=>p.name).join(', ')}</p><p class="mt-2 text-emerald-600 font-bold text-base">Total: R$ ${totalPrice.toFixed(2)} (${totalDuration} min)</p></div>
                            
                            <p class="text-xs font-bold text-slate-500 uppercase mb-2">Horários Livres do Profissional:</p>
                            <div class="grid grid-cols-3 gap-2 mb-6 max-h-40 overflow-y-auto custom-scrollbar pr-1">${slots.map(s => `
                                <button onclick="clientBooking.time='${s.time}'; render()" class="py-2.5 border rounded-xl text-xs font-bold relative ${clientBooking.time===s.time?'btn-theme-primary':'bg-white hover:bg-slate-50'}">
                                    ${s.time}
                                    ${s.hasClientCollision ? `<span class="absolute top-1 right-1 w-2 h-2 bg-amber-500 rounded-full" title="Você já tem agendamento neste horário"></span>` : ''}
                                </button>
                            `).join('')}</div>

                            ${clientBooking.time ? `
                                ${isColliding ? `
                                    <div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl mb-4 text-xs fade-in">
                                        <p class="font-bold text-amber-900 mb-1 flex items-center"><i data-lucide="alert-circle" class="w-4 h-4 mr-1 text-amber-600"></i> Você já possui um agendamento neste horário/faixa de tempo!</p>
                                        <p class="text-amber-800 mb-3">Para prosseguir, confirme se este agendamento é para outra pessoa (filho, acompanhante, etc.):</p>
                                        
                                        <label class="block font-bold text-slate-700 mb-1">Nome Completo do Atendido *</label>
                                        <input type="text" id="beneficiary-name-inp" value="${clientBooking.beneficiaryName}" oninput="clientBooking.beneficiaryName = this.value" placeholder="Ex: João da Silva" class="w-full px-3 py-2 bg-white border rounded-xl outline-none focus:border-indigo-500 text-slate-800 font-semibold">
                                    </div>
                                ` : ''}

                                <button onclick="clientFinalize(${isColliding})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl shadow-lg transition-all">Confirmar Agendamento</button>
                            ` : ''}
                        </div>`;
                }
            }

            window.clientGoStep3 = function() {
                const checks = Array.from(document.querySelectorAll('.c-proc-check:checked')).map(c => c.value);
                if(checks.length === 0) return showModal('Aviso', 'Selecione pelo menos um procedimento.', 'info');
                clientBooking.procedures = checks;
                if (!t.employees || t.employees.length === 0) { clientBooking.employeeId = t.admin.id; clientBooking.step = 4; } 
                else { clientBooking.step = 3; }
                render();
            };

            window.clientFinalize = function(isColliding) {
                if (!clientBooking.time) return showModal('Aviso', 'Selecione um horário.', 'info');

                let finalBeneficiary = currentClient.name;

                if (isColliding) {
                    const inpVal = document.getElementById('beneficiary-name-inp')?.value.trim();
                    if (!inpVal || inpVal.length < 3) {
                        return showModal('Aviso Necessário', 'Por favor, informe o Nome Completo da pessoa que receberá o atendimento neste horário sobreposto.', 'error');
                    }
                    finalBeneficiary = inpVal;
                }

                const selectedProcs = t.procedures.filter(p => clientBooking.procedures.includes(p.id));
                const totalDuration = selectedProcs.reduce((s, p) => s + p.duration, 0);
                const totalPrice = selectedProcs.reduce((s, p) => s + p.price, 0);

                const newApp = { 
                    id: 'app-' + Date.now(), 
                    clientId: currentClient.id, 
                    clientName: currentClient.name,
                    beneficiaryName: finalBeneficiary,
                    clientPhone: currentClient.phone || '', 
                    employeeId: clientBooking.employeeId, 
                    date: clientBooking.date, 
                    time: clientBooking.time, 
                    proceduresNames: selectedProcs.map(p => p.name), 
                    totalDuration, 
                    totalPrice, 
                    createdAt: new Date().toISOString() 
                };

                t.appointments.push(newApp); 
                saveDB();

                showModal('Sucesso!', `Agendamento confirmado para ${formatDateBR(clientBooking.date)} às ${clientBooking.time}${isColliding ? ` (Para: ${finalBeneficiary})` : ''}!`, 'success', () => {
                    clientBooking = { step: 1, date: null, procedures: [], employeeId: null, time: null, isForOther: false, beneficiaryName: '' }; 
                    clientActiveTab = 'appointments'; 
                    render();
                });
            };
        }
    </script>
</body>
</html>
