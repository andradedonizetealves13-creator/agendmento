<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primstav - Agendamento do Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>var _m=null;try{_m=localStorage.getItem("cliente_mode")}catch(e){}if(_m!=="light")document.documentElement.setAttribute("data-mode","dark")</script>
    <style>
        :root {
            --theme-bg: #f8fafc;
            --theme-primary: #4f46e5;
            --theme-primary-hover: #4338ca;
            --theme-secondary: #e0e7ff;
            --theme-text-primary: #1e1b4b;
            
            /* BACKGROUND DEFAULTS */
            --bg-image: none;
            --bg-opacity: 0.15;
            --bg-blur: 0px;
            --bg-pos: 50% 50%;
            --bg-zoom: 1;
        }
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            font-family: 'Inter', sans-serif; 
            background-color: var(--theme-bg) !important; 
            transition: background-color 0.3s ease; 
            overflow: hidden; 
        }
        #custom-bg-layer {
            position: fixed;
            inset: 0;
            background-image: var(--bg-image);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: var(--bg-pos);
            transform: scale(var(--bg-zoom));
            transform-origin: var(--bg-pos);
            opacity: var(--bg-opacity);
            filter: blur(var(--bg-blur));
            pointer-events: none;
            z-index: 0;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-theme-primary { 
            background-color: var(--theme-primary) !important; 
            color: #ffffff !important; 
        }
        .btn-theme-primary:hover { 
            background-color: var(--theme-primary-hover) !important; 
        }
        .bg-theme-secondary { 
            background-color: var(--theme-secondary) !important; 
        }
        .text-theme-primary { 
            color: var(--theme-primary) !important; 
        }
        .border-theme-primary {
            border-color: var(--theme-primary) !important;
        }

        /* Faz as cores "índigo" fixas acompanharem o tema escolhido */
        .text-indigo-600, .text-indigo-700 { color: var(--theme-primary) !important; }
        .bg-indigo-600 { background-color: var(--theme-primary) !important; }
        .hover\:bg-indigo-700:hover { background-color: var(--theme-primary-hover) !important; }
        .bg-indigo-50, .bg-indigo-100 { background-color: var(--theme-secondary) !important; }
        .border-indigo-600, .hover\:border-indigo-600:hover, .focus\:border-indigo-500:focus { border-color: var(--theme-primary) !important; }
        .border-t-transparent { border-top-color: transparent !important; }

        /* ESTILOS DO CROPPER (CORTADOR DE FOTO) */
        #cropper-img {
            max-width: none;
            touch-action: none;
        }
        .cropper-mask {
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.75);
        }
    
        /* ===== Acabamento padrão Primstav (as cores continuam vindo do tema da empresa) ===== */
        html, body { height: 100vh; height: 100dvh; overscroll-behavior: none; }
        #app { height: 100vh; height: 100dvh; overflow-x: hidden; overscroll-behavior: contain; touch-action: pan-y pinch-zoom; }
        /* cartões de vidro */
        #app .bg-white { background-color: rgba(255,255,255,.72) !important; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
        #app .bg-white.rounded-2xl, #app .bg-white.rounded-3xl { border-color: rgba(255,255,255,.65) !important; box-shadow: 0 10px 30px -14px color-mix(in srgb, var(--theme-primary) 40%, transparent); }
        /* botões com degradê da cor do tema */
        .btn-theme-primary, .bg-indigo-600 { background-image: linear-gradient(135deg, color-mix(in srgb, var(--theme-primary) 82%, #fff), var(--theme-primary) 55%, color-mix(in srgb, var(--theme-primary) 78%, #000)); }
        .btn-theme-primary { transition: transform .15s, filter .15s, box-shadow .15s; }
        .btn-theme-primary:not(:disabled):hover { filter: brightness(1.06); transform: translateY(-1px); }
        .btn-theme-primary:not(:disabled):active { transform: none; }
        .btn-theme-primary:disabled { opacity: .85; cursor: wait; }
        .btn-theme-primary:disabled::before { content: ''; display: inline-block; width: 1em; height: 1em; margin-right: .5em; vertical-align: -.15em; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: pspin .7s linear infinite; }
        @keyframes pspin { to { transform: rotate(360deg); } }
        /* botão principal (Continuar) sempre visível */
        main button.btn-theme-primary.w-full { position: sticky; bottom: 4.75rem; z-index: 20; box-shadow: 0 -14px 16px -10px var(--theme-bg), 0 8px 20px -6px color-mix(in srgb, var(--theme-primary) 55%, transparent); }
        @media (min-width: 768px) { main button.btn-theme-primary.w-full { bottom: 1rem; } }
        /* cabeçalho da empresa congelado e compacto no celular */
        @media (max-width: 767px) {
            main > .max-w-3xl.items-center.text-center:first-child { position: sticky; top: 0; z-index: 30; margin: -1rem -1rem .75rem; padding: .5rem 1rem; width: auto; max-width: none; flex-direction: row; gap: .6rem; justify-content: center; background: color-mix(in srgb, var(--theme-bg) 78%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(0,0,0,.06); }
            main > .max-w-3xl.items-center.text-center:first-child > * { margin: 0 !important; }
            main > .max-w-3xl.items-center.text-center:first-child img { height: 2.25rem; width: auto; max-height: 2.25rem; }
            main > .max-w-3xl.items-center.text-center:first-child h1 { font-size: 1rem; }
            main > .max-w-3xl.items-center.text-center:first-child span { display: none; }
        }
        @media (min-width: 640px) and (max-width: 767px) { main > .max-w-3xl.items-center.text-center:first-child { margin: -1.5rem -1.5rem .75rem; padding: .5rem 1.5rem; } }
        .eye-btn { position: absolute; width: 2.25rem; height: 2.25rem; display: flex; align-items: center; justify-content: center; color: #64748b; border-radius: .6rem; z-index: 2; }
        .eye-btn:hover { color: var(--theme-primary); background: rgba(0,0,0,.05); }
        @media (prefers-reduced-motion: reduce) { .btn-theme-primary { transition: none; } }

        /* ===== Modo claro / escuro (botão sol/lua). As cores do tema da empresa continuam valendo ===== */
        #mode-toggle { position: fixed; top: .75rem; right: .75rem; z-index: 60; width: 2.5rem; height: 2.5rem; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: var(--theme-primary); background: rgba(255,255,255,.75); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.7); box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--theme-primary) 45%, transparent); transition: transform .2s; }
        #mode-toggle:hover { transform: scale(1.08) rotate(-8deg); }
        @media (max-width: 767px) { main > .max-w-3xl.items-center.text-center:first-child { padding-right: 3.5rem; } }
        html[data-mode="dark"] { color-scheme: dark; --dk-bg: color-mix(in srgb, var(--theme-primary) 8%, #07070a); }
        html[data-mode="dark"] #mode-toggle { color: #fcd34d; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); box-shadow: 0 6px 18px -6px rgba(0,0,0,.6); }
        html[data-mode="dark"], html[data-mode="dark"] body { background-color: var(--dk-bg) !important; }
        html[data-mode="dark"] body { color: #e4e4e7; }
        html[data-mode="dark"] :is(.text-slate-900, .text-slate-800, .text-slate-700) { color: #f4f4f5; }
        html[data-mode="dark"] :is(.text-slate-600, .text-slate-500) { color: #a1a1aa; }
        html[data-mode="dark"] .text-slate-400 { color: #8b8b94; }
        html[data-mode="dark"] :is(.text-theme-primary, .text-indigo-600, .text-indigo-700) { color: color-mix(in srgb, var(--theme-primary) 45%, #fff) !important; }
        html[data-mode="dark"] :is(.text-rose-600, .text-rose-700, .text-red-600, .text-red-700, .text-red-500) { color: #fda4af; }
        html[data-mode="dark"] :is(.text-emerald-600, .text-emerald-700, .text-green-600, .text-green-700) { color: #6ee7b7; }
        html[data-mode="dark"] :is(.text-amber-600, .text-amber-700, .text-yellow-700) { color: #fcd34d; }
        html[data-mode="dark"] #app .bg-white { background-color: rgba(255,255,255,.06) !important; border-color: rgba(255,255,255,.12) !important; box-shadow: 0 10px 30px -14px rgba(0,0,0,.7); }
        html[data-mode="dark"] :is(.bg-white\/80, .bg-white\/95, .bg-white\/90) { background-color: rgba(20,20,26,.78) !important; }
        html[data-mode="dark"] aside { background-color: rgba(12,12,16,.84) !important; border-color: rgba(255,255,255,.1) !important; }
        html[data-mode="dark"] .bg-slate-50 { background-color: rgba(255,255,255,.05); }
        html[data-mode="dark"] .bg-slate-100 { background-color: rgba(255,255,255,.08); }
        html[data-mode="dark"] .bg-slate-200 { background-color: rgba(255,255,255,.14); }
        html[data-mode="dark"] :is(.bg-rose-50, .bg-red-50) { background-color: rgba(244,63,94,.14); }
        html[data-mode="dark"] :is(.bg-emerald-50, .bg-green-50) { background-color: rgba(16,185,129,.14); }
        html[data-mode="dark"] :is(.bg-amber-50, .bg-yellow-50) { background-color: rgba(245,158,11,.14); }
        html[data-mode="dark"] .bg-blue-50 { background-color: rgba(59,130,246,.14); }
        html[data-mode="dark"] .bg-theme-secondary { background-color: color-mix(in srgb, var(--theme-primary) 30%, #0b0b0f) !important; }
        html[data-mode="dark"] .bg-indigo-50, html[data-mode="dark"] .bg-indigo-100 { background-color: color-mix(in srgb, var(--theme-primary) 30%, #0b0b0f) !important; }
        html[data-mode="dark"] :is(.border, .border-slate-100, .border-slate-200, .border-slate-300) { border-color: rgba(255,255,255,.12); }
        html[data-mode="dark"] :is(input, select, textarea) { background-color: rgba(255,255,255,.07); color: #fff; border-color: rgba(255,255,255,.15); }
        html[data-mode="dark"] :is(input, textarea)::placeholder { color: #71717a; }
        html[data-mode="dark"] select option { background: #18181b; color: #fff; }
        html[data-mode="dark"] .btn-theme-primary, html[data-mode="dark"] .bg-indigo-600 { box-shadow: 0 0 0 1px rgba(255,255,255,.22), 0 8px 22px -8px color-mix(in srgb, var(--theme-primary) 70%, #fff); }
        html[data-mode="dark"] main button.btn-theme-primary.w-full { box-shadow: 0 -14px 16px -10px var(--dk-bg), 0 0 0 1px rgba(255,255,255,.22), 0 8px 22px -8px color-mix(in srgb, var(--theme-primary) 70%, #fff); }
        html[data-mode="dark"] #custom-modal .bg-white { background-color: #1c1c22 !important; border: 1px solid rgba(255,255,255,.12); }
        html[data-mode="dark"] .eye-btn { color: #a1a1aa; } html[data-mode="dark"] .eye-btn:hover { color: #fff; background: rgba(255,255,255,.1); }
        @media (max-width: 767px) { html[data-mode="dark"] main > .max-w-3xl.items-center.text-center:first-child { background: color-mix(in srgb, var(--dk-bg) 78%, transparent); border-bottom-color: rgba(255,255,255,.08); } }
        html[data-mode="dark"] .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); }

        /* ===== Mesmo padrão do index/entrar: fundo escuro com brilho da cor do tema, vidro forte e logo em destaque ===== */
        html[data-mode="dark"] body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(60% 50% at 80% 10%, color-mix(in srgb, var(--theme-primary) 40%, transparent), transparent 70%),
                        radial-gradient(50% 45% at 10% 95%, color-mix(in srgb, var(--theme-primary) 28%, transparent), transparent 70%); }
        html[data-mode="dark"] #app .bg-white { -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
        html[data-mode="dark"] #app .bg-white.rounded-2xl, html[data-mode="dark"] #app .bg-white.rounded-3xl { box-shadow: 0 30px 90px -25px color-mix(in srgb, var(--theme-primary) 45%, transparent), 0 10px 30px rgba(0,0,0,.5); }
        html[data-mode="dark"] main > .max-w-3xl.items-center.text-center:first-child img { background: rgba(255,255,255,.92); padding: .3rem .6rem; border-radius: .9rem; box-shadow: 0 0 24px color-mix(in srgb, var(--theme-primary) 55%, transparent); object-fit: contain; }
    </style>

</head>
<body class="text-slate-800 antialiased h-full w-full flex m-0 p-0 overflow-hidden">

    <div id="custom-bg-layer"></div>

    <div id="app" class="h-full w-full flex flex-col p-0 m-0 relative z-10 overflow-y-auto custom-scrollbar">
        <div class="m-auto flex flex-col items-center justify-center">
            <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p class="text-sm text-slate-500 font-medium">Carregando agendamentos...</p>
        </div>
    </div>

    <div id="custom-modal" class="hidden fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 fade-in">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            <div id="modal-icon-container" class="mb-4 flex items-center justify-center w-12 h-12 rounded-full mx-auto"></div>
            <h3 id="modal-title" class="text-lg font-bold text-slate-900 text-center mb-2"></h3>
            <div id="modal-message" class="text-slate-600 text-center text-sm mb-6 max-h-[60vh] overflow-y-auto custom-scrollbar"></div>
            <div id="modal-buttons" class="flex justify-end space-x-3"></div>
        </div>
    </div>

    <!-- MODAL DE CORTE DE FOTO ESTILO WHATSAPP -->
    <div id="cropper-modal" class="hidden fixed inset-0 z-[150] flex flex-col items-center justify-center bg-slate-900 fade-in touch-none">
        <h3 class="text-white font-bold mb-6 text-lg tracking-wide">Mova e Ajuste</h3>
        
        <div class="relative w-64 h-64 sm:w-80 sm:h-80 flex items-center justify-center rounded-full cropper-mask z-20 pointer-events-none border-2 border-white/50"></div>

        <div id="cropper-container" class="absolute inset-0 flex items-center justify-center z-10 cursor-move overflow-hidden">
            <img id="cropper-img" src="" class="absolute transform-gpu">
        </div>

        <div class="w-64 sm:w-80 mt-8 z-30 flex items-center space-x-3 text-white">
            <i data-lucide="zoom-out" class="w-5 h-5"></i>
            <input type="range" id="cropper-zoom" min="0.5" max="3" step="0.05" value="1" class="flex-1 accent-indigo-500">
            <i data-lucide="zoom-in" class="w-5 h-5"></i>
        </div>

        <div class="flex space-x-4 mt-8 w-64 sm:w-80 z-30">
            <button onclick="closeCropper()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-3.5 rounded-xl font-bold transition-colors">Cancelar</button>
            <button onclick="applyCrop()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-xl font-bold transition-colors shadow-lg">Cortar</button>
        </div>
    </div>

    <script type="module">
        // Remove .html da barra de endereço
        if (window.location.pathname.endsWith('.html')) {
            window.history.replaceState(null, '', window.location.pathname.replace(/\.html$/, '') + window.location.search);
        }

        import { 
            auth, 
            rtdb, 
            googleProvider,
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInWithPopup,
            signOut, 
            onAuthStateChanged, 
            ref, 
            onValue, 
            runTransaction 
        } from './firebase-config.js';
        import { 
            updatePassword, 
            reauthenticateWithCredential, 
            EmailAuthProvider,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";

        const THEME_PALETTES = [
            { id: 'indigo_classic', bg: '#f8fafc', primary: '#4f46e5', primaryHover: '#4338ca', secondary: '#e0e7ff', dark: '#1e1b4b' },
            { id: 'wine_velvet',    bg: '#E8C5D0', primary: '#4A0E2E', primaryHover: '#2D081B', secondary: '#B56B82', dark: '#2A0515' },
            { id: 'emerald_nature', bg: '#e6f4ea', primary: '#059669', primaryHover: '#047857', secondary: '#a7f3d0', dark: '#064e3b' },
            { id: 'amber_gold',     bg: '#fef3c7', primary: '#d97706', primaryHover: '#b45309', secondary: '#fde68a', dark: '#78350f' },
            { id: 'slate_dark',     bg: '#f1f5f9', primary: '#334155', primaryHover: '#1e293b', secondary: '#cbd5e1', dark: '#0f172a' },
            { id: 'ocean_blue',    bg: '#eff6ff', primary: '#0369a1', primaryHover: '#075985', secondary: '#bae6fd', dark: '#0c4a6e' },
            { id: 'rose_blush',    bg: '#fff1f2', primary: '#e11d48', primaryHover: '#be123c', secondary: '#fecdd3', dark: '#881337' },
            { id: 'violet_dream',  bg: '#f5f3ff', primary: '#7c3aed', primaryHover: '#6d28d9', secondary: '#ddd6fe', dark: '#4c1d95' },
            { id: 'teal_fresh',    bg: '#f0fdfa', primary: '#0d9488', primaryHover: '#0f766e', secondary: '#99f6e4', dark: '#134e4a' },
            { id: 'sunset',        bg: '#fff7ed', primary: '#ea580c', primaryHover: '#c2410c', secondary: '#fed7aa', dark: '#7c2d12' },
            { id: 'fuchsia_pop',   bg: '#fdf4ff', primary: '#c026d3', primaryHover: '#a21caf', secondary: '#f5d0fe', dark: '#701a75' },
            { id: 'lime_garden',   bg: '#f7fee7', primary: '#4d7c0f', primaryHover: '#3f6212', secondary: '#d9f99d', dark: '#1a2e05' },
            { id: 'coffee_mocha',  bg: '#f5ebe0', primary: '#6f4e37', primaryHover: '#5a3e2b', secondary: '#d6ccc2', dark: '#3b2a1e' },
            { id: 'midnight_navy', bg: '#e2e8f0', primary: '#1e3a8a', primaryHover: '#172554', secondary: '#bfdbfe', dark: '#0b1437' },
            { id: 'cherry_red',    bg: '#fef2f2', primary: '#dc2626', primaryHover: '#b91c1c', secondary: '#fecaca', dark: '#7f1d1d' }
        ];

        function getDefWH() {
            return {
                0: { active: false, start: '09:00', end: '13:00' }, 
                1: { active: true,  start: '09:00', end: '18:00' },
                2: { active: true,  start: '09:00', end: '18:00' }, 
                3: { active: true,  start: '09:00', end: '18:00' },
                4: { active: true,  start: '09:00', end: '18:00' }, 
                5: { active: true,  start: '09:00', end: '18:00' }, 
                6: { active: true,  start: '09:00', end: '14:00' }
            };
        }

        window.esc = function(v) {
            return String(v === undefined || v === null ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        };
        function toList(v) { return Array.isArray(v) ? v.filter(x => x) : (v ? Object.values(v) : []); }
        window.localDateStr = function(d = new Date()) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        const isDepositExpired = (a) => !!a && a.status === 'pendente' && !!a.depositDeadline && new Date(a.depositDeadline) < new Date();
        const isBusyStatus = (a) => a.status !== 'cancelado' && a.status !== 'nao_compareceu' && !isDepositExpired(a);

        const urlParams = new URLSearchParams(window.location.search);
        const orgSlug = urlParams.get('org');
        const slugInvalid = !orgSlug || /[.$#\[\]\/]/.test(orgSlug);

        if (slugInvalid) {
            document.getElementById('app').innerHTML = `<div class="bg-white p-8 rounded-3xl shadow-xl border text-center max-w-md w-full m-auto"><h2 class="text-xl font-bold text-rose-600 mb-2">Link Inválido</h2><p class="text-slate-500 text-sm">Nenhuma organização válida foi especificada no link de agendamento.</p></div>`;
        } else {
            const basePath = 'agendapro_saas/tenants/' + orgSlug;
            const tenantRef = ref(rtdb, basePath);
            const storageKey = 'agendaProClient_' + orgSlug;

            window.t = null;
            window.tenantRef = tenantRef;
            window.clientAuthMode = 'login';
            window.clientActiveTab = 'book';
            window.clientBooking = { step: null, date: null, procedures: [], employeeId: null, time: null, isForOther: false, beneficiaryName: '' };
            window.clientCalYear = new Date().getFullYear();
            window.clientCalMonth = new Date().getMonth();
            window.showHistoryApps = false;
            window.hasRendered = false;
            window.clientBusy = false;

            function saveClientId(id) { localStorage.setItem(storageKey, JSON.stringify({ id })); }

            window.currentClient = null;

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    saveClientId(user.uid);
                    // Ter conta no Firebase NÃO basta (ex.: administrador/profissional de outra organização).
                    // O acesso só vale se existir cadastro de cliente DESTA organização.
                    const freshClient = (window.t && window.t.clients) ? window.t.clients.find(c => c.id === user.uid || (c.email && c.email.toLowerCase() === (user.email || '').toLowerCase())) : null;
                    if (freshClient) { freshClient.id = user.uid; currentClient = freshClient; }
                    else currentClient = null;
                    if (window.hasRendered) safeRender();
                } else {
                    currentClient = null;
                    localStorage.removeItem(storageKey);
                    if (window.hasRendered) safeRender();
                }
            });

            let pendingRender = false;
            function isUserTyping() {
                const el = document.activeElement;

            window.createAppointment = function(newApp) {

                    conflict = false;
                    const list = toList(cur);
                    const s = timeToMins(newApp.time), e = s + newApp.totalDuration;
                    const clash = list.some(a => a.employeeId === newApp.employeeId && a.date === newApp.date && isBusyStatus(a)
                        && s < timeToMins(a.time) + a.totalDuration && e > timeToMins(a.time));
                    if (clash) { conflict = true; return; }
                    list.push(newApp);
                    return list;
                }).then(res => ({ ok: res.committed, conflict }));

            window.formatDateBR = function(dateStr) { return dateStr.split('-').reverse().join('/'); };
            window.timeToMins = function(t) { const [h,m] = t.split(':'); return parseInt(h)*60 + parseInt(m); };
            window.minsToTime = function(m) { const h = Math.floor(m/60).toString().padStart(2,'0'); const mins = (m%60).toString().padStart(2,'0'); return `${h}:${mins}`; };

            window.formatPhoneInput = function(input) {
                let v = input.value.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                
                if (v.length > 10) {
                    v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
                } else if (v.length > 6) {
                    v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
                } else if (v.length > 2) {
                    v = v.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
                } else if (v.length > 0) {
                    v = v.replace(/^(\d*)$/, '($1');

            window.getEffectiveAppStatus = function(appItem) {
                if (appItem.status === 'cancelado') return 'cancelado';
                if (appItem.status === 'nao_compareceu') return 'nao_compareceu';
                if (appItem.status === 'realizado') return 'realizado';
                if (appItem.status === 'pendente') return (isDepositExpired(appItem) || new Date(appItem.date + 'T' + appItem.time) < new Date()) ? 'expirado' : 'pendente';
                const appDateTime = new Date(appItem.date + 'T' + appItem.time);
                if (appDateTime < new Date()) return 'realizado';

            window.doesEmployeeWorkOnDate = function(emp, dateStr) {
                if (!emp) return false;
                if (emp.exceptions && emp.exceptions[dateStr]) {
                    if (emp.exceptions[dateStr].type === 'folga') return false;
                    if (emp.exceptions[dateStr].type === 'plantao') return true;
                }
                if (t.admin && t.admin.exceptions && t.admin.exceptions[dateStr]) {
                    if (t.admin.exceptions[dateStr].type === 'folga') return false;
                    if (t.admin.exceptions[dateStr].type === 'plantao') return true;
                }
                const [y, m, d] = dateStr.split('-'); 
                const dayOfWeek = new Date(y, m - 1, d).getDay(); 
                const whSource = emp.workingHours || (t.admin ? t.admin.workingHours : null) || getDefWH();
                return whSource?.[dayOfWeek]?.active !== false;
            };

            window.legacyDateAllowed = function(cellDate) {
                const today = new Date();
                today.setHours(0,0,0,0);
                if (cellDate < today) return false;
                const currentYear = today.getFullYear();
                const currentMonth = today.getMonth();
                const cellYear = cellDate.getFullYear();
                const cellMonth = cellDate.getMonth();
                const cellDay = cellDate.getDate();

                const totalDaysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
                const isLastWeekOfCurrentMonth = today.getDate() > (totalDaysInCurrentMonth - 7);

                if (cellYear === currentYear && cellMonth === currentMonth) return true;
                const nextMonthDate = new Date(currentYear, currentMonth + 1, 1);
                if (cellYear === nextMonthDate.getFullYear() && cellMonth === nextMonthDate.getMonth()) {
                    if (!isLastWeekOfCurrentMonth) return false;
                    const totalDaysInNextMonth = new Date(cellYear, cellMonth + 1, 0).getDate();
                    if (cellDay > (totalDaysInNextMonth - 7)) return false;
                    return true;
                }
                return false;
            };

            window.isCompanyOpenOnDate = function(dateStr) {
                const cellDate = new Date(dateStr + 'T00:00:00');
                if (!isDateAllowedByMonthlyRule(cellDate)) return false;

                if (t.employees && t.employees.length > 0) {
                    return t.employees.some(emp => doesEmployeeWorkOnDate(emp, dateStr));
                }
                return doesEmployeeWorkOnDate(t.admin, dateStr);
            };

            window.hasAnyFreeSlot = function(dateStr) {
                const ids = (t.employees && t.employees.length > 0) ? t.employees.map(e => e.id) : (t.admin?.id ? [t.admin.id] : ['admin']);
                return ids.some(id => getAvailableTimeSlots(id, dateStr, 30).length > 0);
            };

            window.doesClientHaveCollision = function(dateStr, startMins, durationMins) {
                if (!currentClient) return false;
                const reschedId = clientBooking.resched ? clientBooking.resched.id : null;
                const clientApps = t.appointments.filter(a => a.clientId === currentClient.id && a.date === dateStr && isBusyStatus(a) && a.id !== reschedId);
                const endMins = startMins + durationMins;

                for (let a of clientApps) {
                    const aStart = timeToMins(a.time);
                    const aEnd = aStart + a.totalDuration;
                    if (startMins < aEnd && endMins > aStart) return true;
                }
                return false;
            };

            window.getAvailableTimeSlots = function(empId, dateStr, durationMins) {
                const emp = (t.admin && empId === t.admin.id) ? t.admin : ((t.employees || []).find(e => e.id === empId) || t.admin);
                if(!emp || !doesEmployeeWorkOnDate(emp, dateStr)) return [];
                
                let start = '09:00', end = '18:00';
                const excEmp = emp.exceptions?.[dateStr];
                const excAdmin = t.admin?.exceptions?.[dateStr];

                if (excEmp && excEmp.type === 'plantao') { start = excEmp.start; end = excEmp.end; }
                else if (excAdmin && excAdmin.type === 'plantao') { start = excAdmin.start; end = excAdmin.end; }
                else {
                    const [y, m, d] = dateStr.split('-'); 
                    const dayOfWeek = new Date(y, m - 1, d).getDay();
                    const def = getDefWH();
                    const wh = emp.workingHours?.[dayOfWeek] || (t.admin ? t.admin.workingHours?.[dayOfWeek] : null) || def[dayOfWeek];
                    if(wh && wh.active) { start = wh.start; end = wh.end; } else return [];
                }

                const startMins = timeToMins(start); 
                const endMins = timeToMins(end);
                const reschedId = clientBooking.resched ? clientBooking.resched.id : null;
                const empApps = (t.appointments || []).filter(a => a.employeeId === empId && a.date === dateStr && isBusyStatus(a) && a.id !== reschedId);
                const slots = [];

                const now = new Date();
                const isToday = dateStr === localDateStr(now);
                const nowMins = now.getHours() * 60 + now.getMinutes();

                for(let m = startMins; m <= endMins - durationMins; m += 30) {
                    if (isToday && m <= nowMins) continue;

                    let overlap = false;
                    const slotEnd = m + durationMins;
                    
                    for(let a of empApps) {
                        const aStart = timeToMins(a.time); 
                        const aEnd = aStart + a.totalDuration;
                        if(m < aEnd && slotEnd > aStart) { overlap = true; break; }
                    }

                    if(!overlap) {
                        slots.push({
                            time: minsToTime(m),
                            hasClientCollision: doesClientHaveCollision(dateStr, m, durationMins)
                        });
                    }
                }
                return slots;
            };

            window.getEmployeeById = function(id) {
                return (t.admin && id === t.admin.id) ? t.admin : (t.employees || []).find(e => e.id === id);
            };

            function capableEmployees(dateStr, procIds) {
                return (t.employees || []).filter(e =>
                    procIds.every(pid => e.procedures && e.procedures.includes(pid)) && doesEmployeeWorkOnDate(e, dateStr));
            }

            window.getBookingSlots = function(empId, dateStr, durationMins, procIds) {
                if (empId !== 'any') return getAvailableTimeSlots(empId, dateStr, durationMins);
                const map = new Map();
                capableEmployees(dateStr, procIds || []).forEach(e => {
                    getAvailableTimeSlots(e.id, dateStr, durationMins).forEach(s => { if (!map.has(s.time)) map.set(s.time, s); });
                });
                return Array.from(map.values()).sort((a, b) => timeToMins(a.time) - timeToMins(b.time));
            };

            window.resolveEmployeeForTime = function(dateStr, durationMins, procIds, time) {
                const found = capableEmployees(dateStr, procIds || []).find(e =>
                    getAvailableTimeSlots(e.id, dateStr, durationMins).some(s => s.time === time));
                return found ? found.id : null;
            };

            // ================= REGRAS DA ORGANIZAÇÃO (configuradas no painel: t.rules) =================
            const LEGACY_FLOW = ['date', 'procedure', 'professional', 'time'];
            const PIX_LABELS = { cpf: 'CPF', cnpj: 'CNPJ', email: 'E-mail', telefone: 'Telefone', aleatoria: 'Chave aleatória' };

            // só aceita links do WhatsApp (evita qualquer outro tipo de link vindo dos dados)
            function safeWaLink(v) {
                try {
                    const u = new URL(String(v || '').trim());
                    return (u.protocol === 'https:' && /(^|\.)(wa\.me|whatsapp\.com)$/i.test(u.hostname)) ? u.href : '';
                } catch (_) { return ''; }
            }
            window.getRules = function() {
                const r = t.rules || {}, dep = r.deposit || {}, win = r.openingWindow || {}, flow = r.bookingFlow || {};
                return {
                    deposit: {
                        enabled: dep.enabled === true, all: dep.all === true,
                        procedureIds: toList(dep.procedureIds).map(String),
                        percent: Number(dep.percent) > 0 ? Number(dep.percent) : 30,
                        pixKeyType: dep.pixKeyType || 'cpf', pixKey: String(dep.pixKey || '').trim(),
                        whatsappLink: safeWaLink(dep.whatsappLink),
                        expiryHours: (dep.expiryHours === undefined || dep.expiryHours === null || dep.expiryHours === '' || isNaN(Number(dep.expiryHours))) ? 2 : Math.max(0, Number(dep.expiryHours))
                    },
                    openingWindow: {
                        enabled: win.enabled === true,
                        mode: ['weekly', 'monthly', 'yearly', 'always'].includes(win.mode) ? win.mode : 'weekly',
                        amount: Number(win.amount) > 0 ? Math.floor(Number(win.amount)) : 2
                    },
                    bookingFlow: { enabled: flow.enabled === true, steps: toList(flow.steps) }
                };
            };

            // ---- janela de abertura da agenda ----
            window.winEndDate = function(w) {
                const d = new Date(); d.setHours(0, 0, 0, 0);
                if (w.mode === 'weekly') d.setDate(d.getDate() + 7 * w.amount);
                else if (w.mode === 'monthly') d.setMonth(d.getMonth() + w.amount);
                else if (w.mode === 'yearly') d.setFullYear(d.getFullYear() + w.amount);
                return d;
            };
            window.isDateAllowedByMonthlyRule = function(cellDate) {
                const w = getRules().openingWindow;
                if (!w.enabled) return legacyDateAllowed(cellDate);   // sem regra: comportamento antigo (mês atual + mês seguinte na última semana)
                const today = new Date(); today.setHours(0, 0, 0, 0);
                if (cellDate < today) return false;
                if (w.mode === 'always') return true;
                return cellDate <= winEndDate(w);
            };
            window.getCalLimit = function() {   // último mês navegável no calendário
                const w = getRules().openingWindow, now = new Date();
                if (!w.enabled) { const n = new Date(now.getFullYear(), now.getMonth() + 1, 1); return { y: n.getFullYear(), m: n.getMonth() }; }
                if (w.mode === 'always') { const n = new Date(now.getFullYear(), now.getMonth() + 60, 1); return { y: n.getFullYear(), m: n.getMonth() }; }
                const e = winEndDate(w); return { y: e.getFullYear(), m: e.getMonth() };
            };
            window.calendarHint = function() {
                const w = getRules().openingWindow;
                const base = 'Dias em cinza estão fechados, sem horários livres ou ainda não liberados.';
                if (!w.enabled) return base + ' O mês seguinte abre para agendamento na última semana do mês atual.';
                if (w.mode === 'always') return base;
                const unit = { weekly: 'semana(s)', monthly: 'mês(es)', yearly: 'ano(s)' }[w.mode];
                return `${base} A agenda está aberta para os próximos ${w.amount} ${unit} (até ${formatDateBR(localDateStr(winEndDate(w)))}).`;
            };

            // ---- ordem das etapas ----
            window.bookingOrder = function() {
                if (clientBooking.resched) return ['date', 'time'];
                const rules = getRules();
                let steps = (rules.bookingFlow.enabled ? rules.bookingFlow.steps : LEGACY_FLOW).filter(s => LEGACY_FLOW.includes(s));
                steps = steps.filter((s, i) => steps.indexOf(s) === i);
                LEGACY_FLOW.forEach(s => { if (!steps.includes(s)) steps.push(s); });
                if (!(t.employees && t.employees.length)) steps = steps.filter(s => s !== 'professional');
                const di = steps.indexOf('date'), ti = steps.indexOf('time');
                if (ti < di) { steps.splice(ti, 1); steps.splice(steps.indexOf('date') + 1, 0, 'time'); }   // o horário depende do dia
                return steps;
            };
            window.clientNext = function() {
                const o = bookingOrder(), i = o.indexOf(clientBooking.step);
                clientBooking.step = (i >= 0 && i < o.length - 1) ? o[i + 1] : 'confirm';
                render();
            };
            window.clientBack = function() {
                const o = bookingOrder();
                if (clientBooking.step === 'confirm') clientBooking.step = o[o.length - 1];
                else { const i = o.indexOf(clientBooking.step); if (i > 0) clientBooking.step = o[i - 1]; }
                render();
            };
            window.backToTime = function() { clientBooking.time = null; clientBooking.step = 'time'; render(); };

            // ---- contexto do agendamento em andamento (as etapas podem vir em qualquer ordem) ----
            function bkProcs() { return (t.procedures || []).filter(p => clientBooking.procedures.includes(p.id)); }
            function bkEmp() { return (t.employees && t.employees.length) ? clientBooking.employeeId : t.admin.id; }
            function bkDuration() {
                if (clientBooking.resched) return clientBooking.resched.totalDuration;
                const sel = bkProcs();
                return sel.length ? sel.reduce((s, p) => s + p.duration, 0) : 30;   // sem serviço escolhido ainda: menor bloco (30 min)
            }
            function bkSlots() {
                let slots = getBookingSlots(bkEmp() || 'any', clientBooking.date, bkDuration(), clientBooking.procedures);
                if (clientBooking.resched) slots = slots.filter(s => !s.hasClientCollision);
                return slots;
            }
            function bkDayOpen(dateStr) {
                const resched = clientBooking.resched;
                const d = new Date(dateStr + 'T00:00:00');
                if (resched) { const e = getEmployeeById(resched.employeeId); return !!e && isDateAllowedByMonthlyRule(d) && doesEmployeeWorkOnDate(e, dateStr); }
                if (!isDateAllowedByMonthlyRule(d)) return false;
                if (!(t.employees && t.employees.length)) return doesEmployeeWorkOnDate(t.admin, dateStr);
                const chosen = clientBooking.employeeId;
                if (chosen && chosen !== 'any') {
                    const e = getEmployeeById(chosen);
                    return !!e && doesEmployeeWorkOnDate(e, dateStr) && clientBooking.procedures.every(pid => e.procedures && e.procedures.includes(pid));
                }
                return capableEmployees(dateStr, clientBooking.procedures).length > 0;
            }
            function bkDayFull(dateStr) {
                const resched = clientBooking.resched, dur = bkDuration();
                let ids;
                if (resched) ids = [resched.employeeId];
                else if (!(t.employees && t.employees.length)) ids = [t.admin.id];
                else if (clientBooking.employeeId && clientBooking.employeeId !== 'any') ids = [clientBooking.employeeId];
                else ids = capableEmployees(dateStr, clientBooking.procedures).map(e => e.id);
                return !ids.some(id => getAvailableTimeSlots(id, dateStr, dur).filter(sl => !resched || !sl.hasClientCollision).length > 0);
            }

            // ---- sinal ----
            window.providerActive = function() {
                return !!(window.providerInfo && window.providerInfo.active === true && window.providerInfo.type === 'mercadopago');
            };
            window.getDepositInfo = function(procs) {
                const dep = getRules().deposit;
                const auto = providerActive();
                if (!dep.enabled || (!auto && !dep.pixKey)) return null;
                const req = procs.filter(p => dep.all || dep.procedureIds.includes(String(p.id)));
                if (!req.length) return null;
                const base = req.reduce((s, p) => s + (Number(p.price) || 0), 0);
                const amount = Math.round(base * dep.percent) / 100;
                if (!(amount > 0)) return null;
                return { amount, percent: dep.percent, base, auto, pixKeyType: dep.pixKeyType, pixKey: dep.pixKey, whatsappLink: dep.whatsappLink, expiryHours: dep.expiryHours };
            };
            // ---- Pix "copia e cola" (BR Code estático, padrão do Banco Central) ----
            function crc16(str) {
                let crc = 0xFFFF;
                for (let i = 0; i < str.length; i++) {
                    crc ^= str.charCodeAt(i) << 8;
                    for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
                }
                return crc.toString(16).toUpperCase().padStart(4, '0');
            }
            function emv(id, value) { value = String(value); return id + String(value.length).padStart(2, '0') + value; }
            function pixClean(txt, max) {
                return String(txt || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);
            }
            function pixKeyNormalize(type, key) {
                key = String(key || '').trim();
                if (type === 'cpf' || type === 'cnpj') return key.replace(/\D/g, '');
                if (type === 'telefone') {
                    const d = key.replace(/\D/g, '');
                    if (key.startsWith('+')) return '+' + d;
                    return (d.length >= 12 && d.startsWith('55')) ? '+' + d : '+55' + d;
                }
                if (type === 'email') return key.toLowerCase();
                return key;
            }
            window.buildPixPayload = function(type, key, amount, merchantName) {
                const k = pixKeyNormalize(type, key);
                if (!k) return '';
                const value = Number(amount);
                const acc = emv('00', 'br.gov.bcb.pix') + emv('01', k);
                let p = emv('00', '01') + emv('26', acc) + emv('52', '0000') + emv('53', '986');
                if (value > 0) p += emv('54', value.toFixed(2));

            // QR + copia e cola (a chave Pix principal não é mostrada ao cliente)

            window.rescheduleAppointment = function(id, newDate, newTime) {
                let reason = 'ok';
                return runTransaction(ref(rtdb, basePath + '/appointments'), (cur) => {
                    reason = 'ok';
                    if (!cur) { reason = 'missing'; return; }
                    const list = toList(cur);
                    const item = list.find(a => a.id === id);
                    if (!item || !isBusyStatus(item) || item.status === 'realizado') { reason = 'missing'; return; }
                    const s = timeToMins(newTime), e = s + item.totalDuration;
                    const clash = list.some(a => a.id !== id && a.employeeId === item.employeeId && a.date === newDate && isBusyStatus(a)
                        && s < timeToMins(a.time) + a.totalDuration && e > timeToMins(a.time));
                    if (clash) { reason = 'conflict'; return; }
                    item.date = newDate;
                    item.time = newTime;

            function renderClientAuth() {

                            <button type="submit" class="w-full btn-theme-primary font-bold py-3.5 rounded-xl shadow-md mt-4">${clientAuthMode==='login'?'Entrar na Conta':'Criar Minha Conta'}</button>

            // Se já existe cadastro nesta organização (ex.: criado pelo painel) só vincula o login (uid). NUNCA cria cadastro sozinho.
            async function linkExistingClient(user) {
                const email = (user.email || '').toLowerCase();
                await runTransaction(ref(rtdb, basePath + '/clients'), (cur) => {
                    if (!cur) return;
                    const list = toList(cur);
                    if (list.some(c => c.id === user.uid)) return;
                    const byEmail = list.find(c => c.email && c.email.toLowerCase() === email);
                    if (!byEmail) return;
                    byEmail.id = user.uid;
                    return list;
                });
            }

            window.handleClientGoogleAuth = async function() {
                try {
                    window.clientBusy = true;
                    const result = await signInWithPopup(auth, googleProvider);
                    await linkExistingClient(result.user);
                } catch (err) {
                    showModal('Erro no Google', err.message, 'error');
                } finally {
                    window.clientBusy = false;
                    safeRender();

            window.clientForgotPassword = async function() {
                const el = document.getElementById('c-auth-email');
                const email = el ? el.value.trim().toLowerCase() : '';
                if (!email || !email.includes('@')) return showModal('Informe seu e-mail', 'Digite seu e-mail no campo acima e toque em "Esqueci minha senha" de novo.', 'info');
                try { await sendPasswordResetEmail(auth, email); } catch (err) { if (err && err.code === 'auth/too-many-requests') return showModal('Muitas tentativas', 'Aguarde alguns minutos e tente de novo.', 'error'); }
                showModal('Verifique seu e-mail', 'Se existir uma conta com este e-mail, enviamos um link para criar uma nova senha. Olhe também a caixa de spam.', 'success');

            window.handleClientAuthSubmit = async function(e) {
                e.preventDefault();
                const email = document.getElementById('c-auth-email').value.trim().toLowerCase();
                const pass = document.getElementById('c-auth-pass').value.trim();

                if (clientAuthMode === 'register') {
                    const name = document.getElementById('c-auth-name').value.trim();
                    const phoneRaw = document.getElementById('c-auth-phone').value;
                    const digitsPhone = cleanPhone(phoneRaw);

                    if (!name || name.length < 3) return showModal('Aviso', 'Por favor, informe seu nome completo.', 'error');
                    if (digitsPhone.length !== 11) return showModal('Telefone Inválido', 'Informe um telefone/WhatsApp válido com DDD e 9 dígitos. Exemplo: (11) 98765-4321', 'error');
                    if (!email || !email.includes('@')) return showModal('Aviso', 'Informe um e-mail válido.', 'error');
                    if (!pass || pass.length < 6) return showModal('Aviso', 'A senha deve ter no mínimo 6 caracteres.', 'error');

                    window.clientBusy = true;
                    try {
                        let user;
                        try {
                            const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                            user = userCred.user;
                        } catch(err) {
                            if(err.code === 'auth/email-already-in-use') {
                                try {
                                    const userCred = await signInWithEmailAndPassword(auth, email, pass);
                                    user = userCred.user;
                                } catch(err2) {
                                    return showModal('Acesso Negado', 'Este e-mail já tem conta, mas a senha está incorreta. Se você já agendou antes, use a senha que criou.', 'error');
                                }
                            } else {
                                return showModal('Erro no Registo', err.message, 'error');
                            }
                        }
                        await addClientRecord(user, name, phoneRaw);
                    } finally {
                        window.clientBusy = false;
                        safeRender();
                    }
                } else {
                    window.clientBusy = true;
                    try {
                        const userCred = await signInWithEmailAndPassword(auth, email, pass);
                        await linkExistingClient(userCred.user);
                    } catch (err) {
                        showModal('Acesso Negado', 'E-mail ou senha incorretos.', 'error');
                    } finally {
                        window.clientBusy = false;
                        safeRender();
                    }
                }
            };

            // cria o cadastro de cliente desta organização (sempre com telefone)
            async function addClientRecord(user, name, phoneRaw) {
                const email = (user.email || '').toLowerCase();
                const newClient = { id: user.uid, name, email, phone: phoneRaw, avatar: user.photoURL || '' };
                await runTransaction(ref(rtdb, basePath + '/clients'), (cur) => {
                    const list = toList(cur);
                    const existing = list.find(c => c.id === user.uid || (c.email && c.email.toLowerCase() === email));
                    if (existing) { existing.id = user.uid; if (!existing.phone) existing.phone = phoneRaw; if (!existing.name) existing.name = name; }
                    else list.push(newClient);
                    return list;
                });
            }

            // usuário já logado (ex.: administrador de outra organização) que ainda não tem cadastro aqui

            // ==========================================
            // LÓGICA DO CROPPER ESTILO WHATSAPP (VANILLA)
            // ==========================================
            let cropScale = 1;
            let cropX = 0;
            let cropY = 0;
            let isDraggingCrop = false;
            let startX, startY;

            window.handleClientAvatarUpload = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = document.getElementById('cropper-img');
                    img.src = event.target.result;
                    
                    img.onload = () => {
                        cropScale = 1; 
                        cropX = 0; 
                        cropY = 0;
                        document.getElementById('cropper-zoom').value = 1;
                        
                        const container = document.getElementById('cropper-container');
                        const iRatio = img.naturalWidth / img.naturalHeight;
                        const cRatio = container.offsetWidth / container.offsetHeight;
                        
                        if (iRatio > cRatio) {
                            img.style.height = '100%';
                            img.style.width = 'auto';
                        } else {
                            img.style.width = '100%';
                            img.style.height = 'auto';
                        }

                        updateCropperTransform();
                        document.getElementById('cropper-modal').classList.remove('hidden');
                        if(window.lucide) lucide.createIcons();
                    }
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            window.updateCropperTransform = function() {
                const img = document.getElementById('cropper-img');
                img.style.transform = `translate(${cropX}px, ${cropY}px) scale(${cropScale})`;
            };

            const zoomInput = document.getElementById('cropper-zoom');
            if(zoomInput) {
                zoomInput.addEventListener('input', (e) => {
                    cropScale = parseFloat(e.target.value);
                    updateCropperTransform();
                });
            }

            const cropperContainer = document.getElementById('cropper-container');
            
            function startDragCrop(clientX, clientY) {
                isDraggingCrop = true;
                startX = clientX - cropX;
                startY = clientY - cropY;
            }
            
            function dragCrop(clientX, clientY) {
                if(!isDraggingCrop) return;
                cropX = clientX - startX;
                cropY = clientY - startY;
                updateCropperTransform();
            }

            function stopDragCrop() { 
                isDraggingCrop = false; 
            }

            if(cropperContainer) {
                cropperContainer.addEventListener('mousedown', e => startDragCrop(e.clientX, e.clientY));
                window.addEventListener('mousemove', e => dragCrop(e.clientX, e.clientY));
                window.addEventListener('mouseup', stopDragCrop);

                cropperContainer.addEventListener('touchstart', e => startDragCrop(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
                cropperContainer.addEventListener('touchmove', e => { 
                    if(isDraggingCrop) {
                        e.preventDefault();
                        dragCrop(e.touches[0].clientX, e.touches[0].clientY); 
                    }
                }, {passive: false});
                cropperContainer.addEventListener('touchend', stopDragCrop);
            }

            window.closeCropper = function() {
                document.getElementById('cropper-modal').classList.add('hidden');
            };

            window.applyCrop = function() {
                const mask = document.querySelector('.cropper-mask');
                const img = document.getElementById('cropper-img');
                
                const cRect = mask.getBoundingClientRect();
                const iRect = img.getBoundingClientRect();
                
                const canvas = document.createElement('canvas');
                const SIZE = 400;
                canvas.width = SIZE;
                canvas.height = SIZE;
                const ctx = canvas.getContext('2d');
                
                const scaleX = img.naturalWidth / iRect.width;
                const scaleY = img.naturalHeight / iRect.height;
                
                let cropX_img = (cRect.left - iRect.left) * scaleX;
                let cropY_img = (cRect.top - iRect.top) * scaleY;
                let cropW_img = cRect.width * scaleX;
                let cropH_img = cRect.height * scaleY;
                
                ctx.fillStyle = '#ffffff'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, cropX_img, cropY_img, cropW_img, cropH_img, 0, 0, SIZE, SIZE);
                
                const base64 = canvas.toDataURL('image/jpeg', 0.85);
                currentClient.avatar = base64;
                
                delete currentClient.avatarScale; 
                delete currentClient.avatarPosX;
                delete currentClient.avatarPosY;
                
                updateClientInDatabase()
                    .then(() => {
                        closeCropper();
                        render();
                        showModal('Foto Atualizada!', 'Sua foto de perfil foi ajustada e salva com sucesso.', 'success');
                    })
                    .catch(() => showModal('Erro', 'Não foi possível salvar a foto. Tente novamente.', 'error'));
            };

            window.handleSaveClientProfile = async function(e) {
                e.preventDefault();
                const newName = document.getElementById('c-prof-name').value.trim();
                const phoneRaw = document.getElementById('c-prof-phone').value;

                const digitsPhone = cleanPhone(phoneRaw);

                if (!newName || newName.length < 3) return showModal('Aviso', 'Informe seu nome completo.', 'error');
                if (digitsPhone.length !== 11) return showModal('Telefone Inválido', 'Informe um telefone/WhatsApp válido com DDD e 9 dígitos.', 'error');

                const oldPassEl = document.getElementById('c-prof-old-pass');
                const newPassEl = document.getElementById('c-prof-new-pass');
                const confirmPassEl = document.getElementById('c-prof-confirm-pass');

                if (oldPassEl && newPassEl && confirmPassEl) {
                    const oldPass = oldPassEl.value.trim();
                    const newPass = newPassEl.value.trim();
                    const confirmPass = confirmPassEl.value.trim();

                    if (oldPass || newPass || confirmPass) {
                        if (!oldPass) return showModal('Erro de Senha', 'Digite sua senha atual para autorizar a alteração.', 'error');
                        if (newPass.length < 6) return showModal('Erro de Senha', 'A nova senha deve possuir pelo menos 6 caracteres.', 'error');
                        if (newPass !== confirmPass) return showModal('Erro de Senha', 'A confirmação da nova senha não confere.', 'error');

                        try {
                            const user = auth.currentUser;
                            const cred = EmailAuthProvider.credential(user.email, oldPass);
                            await reauthenticateWithCredential(user, cred);
                            await updatePassword(user, newPass);
                        } catch (errAuth) {
                            return showModal('Erro ao alterar senha', 'Senha atual incorreta ou tempo de sessão expirado.', 'error');
                        }
                    }
                }

                currentClient = { ...currentClient, name: newName, phone: phoneRaw };

                updateClientInDatabase()
                    .then(() => showModal('Sucesso!', 'Seu perfil foi atualizado com sucesso.', 'success', () => { render(); }))
                    .catch(() => showModal('Erro', 'Não foi possível salvar o perfil. Tente novamente.', 'error'));
            };

                                    return `
                                        <div class="bg-white/90 backdrop-blur-md p-4 sm:p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-center gap-4 hover:border-slate-300 transition-colors">
                                            <div class="w-full md:w-auto text-left">
                                                <div class="flex items-center space-x-2 mb-1">
                                                    <span class="bg-theme-secondary text-theme-primary text-xs font-bold px-2.5 py-1 rounded-lg">${formatDateBR(a.date)} às ${esc(a.time)}</span>

                                                <p class="text-xs sm:text-sm text-slate-500 mt-1">Com <b>${esc(emp ? emp.name : 'Profissional')}</b> ${isDependent ? `<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded ml-2">Para: ${esc(a.beneficiaryName)}</span>` : ''}</p>
                                            </div>
                                            <div class="flex md:flex-col items-center md:items-end justify-between w-full md:w-auto border-t md:border-0 pt-3 md:pt-0">
                                                <span class="font-black text-emerald-600 text-base sm:text-lg mb-0 md:mb-2">R$ ${a.totalPrice.toFixed(2)}</span>
                                                <div class="flex items-center gap-2">
                                                    ${a.status === 'pendente' && (a.pixKey || a.pixProvider) ? `<button onclick="showPixInfo('${a.id}')" class="text-xs bg-amber-50 text-amber-800 font-bold px-4 py-2 rounded-xl border border-amber-300 transition-colors">Ver Pix</button>` : ''}<button onclick="startReschedule('${a.id}')" class="text-xs bg-theme-secondary text-theme-primary font-bold px-4 py-2 rounded-xl border transition-colors">Reagendar</button>
