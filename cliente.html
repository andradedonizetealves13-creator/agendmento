    <style>
        :root {
            --theme-bg: #f8fafc;
            --theme-primary: #4f46e5;
            --theme-primary-hover: #4338ca;
            --theme-secondary: #e0e7ff;
            --theme-text-primary: #1e1b4b;

            --bg-image: none;
            --bg-opacity: 0.15;
            --bg-blur: 0px;
            --bg-pos: 50% 50%;
            --bg-zoom: 1;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--theme-bg) !important;
            transition: background-color 0.3s ease;
            overflow: hidden;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;

            font-size: clamp(13px, 4.1vw, 16px);
        }
        @media (min-width: 390px) { html { font-size: 16px; } }

        @supports (height: 100dvh) { html, body { height: 100dvh; } }
        @supports (height: 100lvh) { #custom-bg-layer { height: calc(100lvh + var(--bg-blur) * 4 + 4px); } }
        html, body { overscroll-behavior: none; }

        #app {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }
        #app { overflow-x: hidden; overflow-wrap: break-word; }
        img, svg, video, iframe, canvas { max-width: 100%; }
        @media (max-width: 380px) {
            #mode-toggle { width: 2.1rem; height: 2.1rem; top: calc(.5rem + env(safe-area-inset-top, 0px)); right: calc(.5rem + env(safe-area-inset-right, 0px)); }
        }
        #custom-bg-layer {
            position: fixed;

            left: calc(var(--bg-blur) * -2 - 2px);
            right: calc(var(--bg-blur) * -2 - 2px);
            top: calc(var(--bg-blur) * -2 - 2px);
            bottom: auto;
            width: auto;
            height: calc(100vh + var(--bg-blur) * 4 + 4px);
            background-image: var(--bg-image);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: var(--bg-pos);
            transform: scale(var(--bg-zoom));
            transform-origin: var(--bg-pos);
            opacity: var(--bg-opacity);
            filter: blur(var(--bg-blur));
            pointer-events: none;
            z-index: 0;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .btn-theme-primary {
            background-color: var(--theme-primary) !important;
            color: #ffffff !important;
        }
        .btn-theme-primary:hover {
            background-color: var(--theme-primary-hover) !important;
        }
        .bg-theme-secondary {
            background-color: var(--theme-secondary) !important;
        }
        .text-theme-primary {
            color: var(--theme-primary) !important;
        }
        .border-theme-primary {
            border-color: var(--theme-primary) !important;
        }

        .text-indigo-600, .text-indigo-700 { color: var(--theme-primary) !important; }
        .bg-indigo-600 { background-color: var(--theme-primary) !important; }
        .hover\:bg-indigo-700:hover { background-color: var(--theme-primary-hover) !important; }
        .bg-indigo-50, .bg-indigo-100 { background-color: var(--theme-secondary) !important; }
        .border-indigo-600, .hover\:border-indigo-600:hover, .focus\:border-indigo-500:focus { border-color: var(--theme-primary) !important; }
        .border-t-transparent { border-top-color: transparent !important; }

        #cropper-img {
            max-width: none;
            touch-action: none;
        }
        .cropper-mask {
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.75);
        }

        #mode-toggle { position: fixed; top: calc(.75rem + env(safe-area-inset-top, 0px)); right: calc(.75rem + env(safe-area-inset-right, 0px)); z-index: 60; width: 2.5rem; height: 2.5rem; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: var(--theme-primary); background: rgba(255,255,255,.75); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.7); box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--theme-primary) 45%, transparent); transition: transform .2s; }
        #mode-toggle:hover { transform: scale(1.08) rotate(-8deg); }
        html[data-mode="dark"] { color-scheme: dark; --dk-bg: color-mix(in srgb, var(--theme-primary) 8%, #07070a); }
        html[data-mode="dark"] #mode-toggle { color: #fcd34d; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); box-shadow: 0 6px 18px -6px rgba(0,0,0,.6); }
        html[data-mode="dark"], html[data-mode="dark"] body { background-color: var(--dk-bg) !important; }
        html[data-mode="dark"] body { color: #e4e4e7; }
        html[data-mode="dark"] body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(60% 50% at 80% 10%, color-mix(in srgb, var(--theme-primary) 40%, transparent), transparent 70%), radial-gradient(50% 45% at 10% 95%, color-mix(in srgb, var(--theme-primary) 28%, transparent), transparent 70%); }
        html[data-mode="dark"] :is(.text-slate-900, .text-slate-800, .text-slate-700) { color: #f4f4f5; }
        html[data-mode="dark"] :is(.text-slate-600, .text-slate-500) { color: #a1a1aa; }
        html[data-mode="dark"] .text-slate-400 { color: #8b8b94; }
        html[data-mode="dark"] :is(.text-theme-primary, .text-indigo-600, .text-indigo-700) { color: color-mix(in srgb, var(--theme-primary) 45%, #fff) !important; }
        html[data-mode="dark"] :is(.text-rose-600, .text-rose-700, .text-red-600, .text-red-700, .text-red-500) { color: #fda4af; }
        html[data-mode="dark"] :is(.text-emerald-600, .text-emerald-700, .text-green-600, .text-green-700) { color: #6ee7b7; }
        html[data-mode="dark"] :is(.text-amber-600, .text-amber-700, .text-amber-800, .text-amber-900, .text-yellow-700) { color: #fde68a; }
        html[data-mode="dark"] .bg-amber-100 { background-color: rgba(245,158,11,.22); }
        html[data-mode="dark"] :is(.border-amber-200, .border-amber-300, .border-amber-400) { border-color: rgba(252,211,77,.45); }
        html[data-mode="dark"] #app .bg-white { background-color: rgba(255,255,255,.06) !important; border-color: rgba(255,255,255,.12) !important; -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
        html[data-mode="dark"] #app .bg-white.rounded-2xl, html[data-mode="dark"] #app .bg-white.rounded-3xl { box-shadow: 0 30px 90px -25px color-mix(in srgb, var(--theme-primary) 45%, transparent), 0 10px 30px rgba(0,0,0,.5); }
        html[data-mode="dark"] :is(.bg-white\/80, .bg-white\/95, .bg-white\/90) { background-color: rgba(20,20,26,.8) !important; }
        html[data-mode="dark"] aside { background-color: rgba(12,12,16,.84) !important; border-color: rgba(255,255,255,.1) !important; }
        html[data-mode="dark"] .bg-slate-50 { background-color: rgba(255,255,255,.05); }
        html[data-mode="dark"] .bg-slate-100 { background-color: rgba(255,255,255,.08); }
        html[data-mode="dark"] .bg-slate-200 { background-color: rgba(255,255,255,.14); }
        html[data-mode="dark"] :is(.bg-rose-50, .bg-red-50) { background-color: rgba(244,63,94,.14); }
        html[data-mode="dark"] :is(.bg-emerald-50, .bg-green-50) { background-color: rgba(16,185,129,.14); }
        html[data-mode="dark"] :is(.bg-amber-50, .bg-yellow-50) { background-color: rgba(245,158,11,.14); }
        html[data-mode="dark"] .bg-blue-50 { background-color: rgba(59,130,246,.14); }
        html[data-mode="dark"] :is(.bg-theme-secondary, .bg-indigo-50, .bg-indigo-100) { background-color: color-mix(in srgb, var(--theme-primary) 30%, #0b0b0f) !important; }
        html[data-mode="dark"] :is(.border, .border-slate-100, .border-slate-200, .border-slate-300) { border-color: rgba(255,255,255,.12); }
        html[data-mode="dark"] :is(input, select, textarea) { background-color: rgba(255,255,255,.07); color: #fff; border-color: rgba(255,255,255,.15); }
        html[data-mode="dark"] :is(input, textarea)::placeholder { color: #71717a; }
        html[data-mode="dark"] select option { background: #18181b; color: #fff; }
        html[data-mode="dark"] :is(.btn-theme-primary, .bg-indigo-600) { box-shadow: 0 0 0 1px rgba(255,255,255,.22), 0 8px 22px -8px color-mix(in srgb, var(--theme-primary) 70%, #fff); }
        html[data-mode="dark"] #custom-modal .bg-white { background-color: #1c1c22 !important; border: 1px solid rgba(255,255,255,.12); }
        html[data-mode="dark"] .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); }

        html[data-mode="dark"] #app .grid-cols-7 > div.select-none { background: transparent !important; border: 1px dashed rgba(255,255,255,.08); color: #4a4a55 !important; }
        html[data-mode="dark"] #app .grid-cols-7 > button:not(.btn-theme-primary) { background-color: rgba(255,255,255,.12) !important; border-color: color-mix(in srgb, var(--theme-primary) 60%, transparent) !important; color: #fff !important; font-weight: 800; box-shadow: 0 0 14px -6px color-mix(in srgb, var(--theme-primary) 70%, transparent); transition: background-color .15s, transform .15s; }
        html[data-mode="dark"] #app .grid-cols-7 > button:not(.btn-theme-primary):hover { background-color: color-mix(in srgb, var(--theme-primary) 30%, transparent) !important; transform: translateY(-1px); }

        @keyframes riseIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
        @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes shine { to { transform: translateX(260%) skewX(-18deg); } }
        @keyframes pulseDot { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.6); } 100% { box-shadow: 0 0 0 10px rgba(16,185,129,0); } }
        .rise { opacity: 0; animation: riseIn .6s cubic-bezier(.2,.8,.2,1) forwards; }
        .co-hero { position: relative; overflow: hidden; border-radius: 2rem; min-height: 280px; background: linear-gradient(135deg, var(--theme-primary), color-mix(in srgb, var(--theme-primary) 55%, #000)); box-shadow: 0 30px 70px -30px color-mix(in srgb, var(--theme-primary) 70%, transparent); }
        .co-hero img.cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 6s ease, opacity 1s ease; }
        .co-hero img.co-slide { opacity: 0; } .co-hero img.co-slide.on { opacity: 1; }
        #co-dots { position: absolute; z-index: 11; top: 1rem; right: 1rem; display: flex; gap: 6px; }
        #co-dots button { width: 8px; height: 8px; border-radius: 9999px; background: rgba(255,255,255,.5); border: 0; padding: 0; transition: all .3s; }
        #co-dots button.on { background: #fff; width: 22px; }
        .co-about { --co-about-bg: rgba(255,255,255,.97); } html[data-mode="dark"] .co-about { --co-about-bg: #14141a; }
        .soc-btn { display: inline-flex; align-items: center; gap: .5rem; padding: .6rem 1rem; border-radius: 9999px; font-weight: 800; font-size: .8rem; color: #fff; box-shadow: 0 8px 18px -8px rgba(0,0,0,.45); transition: transform .2s; }
        .soc-btn:hover { transform: translateY(-2px); }
        .co-hero:hover img.cover { transform: scale(1.08); }
        .co-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.15) 55%, rgba(0,0,0,.05)); pointer-events: none; }
        .co-hero .orb { position: absolute; border-radius: 9999px; background: rgba(255,255,255,.14); filter: blur(2px); animation: floatY 6s ease-in-out infinite; }
        .co-open-dot { width: 8px; height: 8px; border-radius: 9999px; background: #10b981; animation: pulseDot 1.6s infinite; }
        .co-stat { transition: transform .25s ease, box-shadow .25s ease; }
        .co-stat:hover { transform: translateY(-4px); }
        .cat-card { position: relative; overflow: hidden; border-radius: 1.5rem; cursor: pointer; aspect-ratio: 4/5; background: linear-gradient(135deg, var(--theme-secondary), color-mix(in srgb, var(--theme-primary) 35%, #fff)); box-shadow: 0 14px 34px -16px rgba(0,0,0,.35); transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease; border: 0; padding: 0; text-align: left; width: 100%; }
        .cat-card:hover { transform: translateY(-6px) scale(1.015); box-shadow: 0 28px 50px -18px color-mix(in srgb, var(--theme-primary) 60%, transparent); }
        .cat-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .7s ease; }
        .cat-card:hover img { transform: scale(1.1); }
        .cat-card::before { content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: skewX(-18deg); z-index: 3; pointer-events: none; }
        .cat-card:hover::before { animation: shine .9s ease; }
        .cat-card .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.25) 45%, transparent 70%); z-index: 1; }
        .cat-card .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 1rem; z-index: 2; color: #fff; }
        .cat-card .price-tag { position: absolute; top: .75rem; right: .75rem; z-index: 2; background: rgba(255,255,255,.92); color: #047857; font-weight: 800; font-size: .75rem; padding: .3rem .65rem; border-radius: 9999px; box-shadow: 0 6px 16px -6px rgba(0,0,0,.4); }
        .cat-chip { white-space: nowrap; transition: all .2s ease; }
        #cat-detail { position: fixed; inset: 0; z-index: 120; display: flex; align-items: flex-end; justify-content: center; background: rgba(15,23,42,.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fadeIn .25s ease; padding: 0; }
        @media (min-width: 640px) { #cat-detail { align-items: center; padding: 1rem; } }
        #cat-detail .cd-card { width: 100%; max-width: 30rem; max-height: 92vh; overflow-y: auto; background: #fff; color: #1e293b; border-radius: 2rem 2rem 0 0; box-shadow: 0 40px 100px -20px rgba(0,0,0,.6); animation: riseIn .45s cubic-bezier(.2,.8,.2,1) both; }
        @media (min-width: 640px) { #cat-detail .cd-card { border-radius: 2rem; } }
        html[data-mode="dark"] #cat-detail .cd-card { background: #1c1c22; color: #e4e4e7; border: 1px solid rgba(255,255,255,.12); }
        html[data-mode="dark"] #cat-detail .cd-muted { color: #a1a1aa; }
        html[data-mode="dark"] #cat-detail .cd-box { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.12); }
        html[data-mode="dark"] .cat-card .price-tag { background: rgba(20,20,26,.9); color: #6ee7b7; }
    
        .px-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
        .px-loader .px-mark{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
        .px-loader .px-mark img{width:58px;height:58px;object-fit:contain;animation:pxBeat 1.6s ease-in-out infinite}
        .px-loader .px-track{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(249,115,22,.15)}
        .px-loader .px-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(249,115,22,0) 0deg,rgba(249,115,22,0) 90deg,#f97316 330deg,rgba(249,115,22,0) 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:pxSpin 1.1s linear infinite}
        .px-loader .px-msg{margin-top:18px;font-size:13px;font-weight:600;color:#64748b;min-height:20px;transition:opacity .25s}
        .px-loader .px-bar{margin-top:14px;width:130px;height:4px;border-radius:99px;background:rgba(100,116,139,.18);overflow:hidden}
        .px-loader .px-bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#f97316,#fdba74);animation:pxBar 1.4s ease-in-out infinite}
        @keyframes pxSpin{to{transform:rotate(360deg)}}
        @keyframes pxBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
        @keyframes pxBar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
        @media (prefers-reduced-motion:reduce){.px-loader *{animation-duration:.01ms!important}}

/* Tela de carregamento Primstav */
#loader,.ld-screen{--bg:#0b0b0c;--tx:#f4f1ec;--mut:#9a968f;--or:#ff6314;--am:#ffb347;--off:#55524c;color:var(--tx);font-family:"DM Sans",system-ui,sans-serif}#loader *,.ld-screen *{box-sizing:border-box}
.ld-screen{opacity:1;visibility:visible}.ld-msg{transition:opacity .25s}
/* ===== TELA DE CARREGAMENTO ===== */
#loader,.ld-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
#loader.on{opacity:1;visibility:visible;transition:opacity .25s ease}
.ld-screen{opacity:1;visibility:visible;transition:opacity .25s ease}   /* precisa vir DEPOIS da regra que esconde #loader, senão a tela some */
#loader::before,.ld-screen::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(55% 45% at 50% 42%,rgba(255,99,20,.24),transparent 70%),radial-gradient(45% 40% at 10% 100%,rgba(255,99,20,.14),transparent 70%)}
.ld-bar{position:absolute;top:0;left:0;right:0;height:2px;overflow:hidden}
.ld-bar i{position:absolute;top:0;bottom:0;width:38%;background:linear-gradient(90deg,transparent,var(--or),var(--am),transparent);animation:ldBar 1.3s cubic-bezier(.6,0,.4,1) infinite}
@keyframes ldBar{from{left:-40%}to{left:102%}}
.ld-core{position:relative;display:grid;justify-items:center;gap:26px}
.ld-mark{position:relative;width:92px;height:92px;display:grid;place-items:center}
.ld-mark::before,.ld-mark::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,179,71,.5);animation:ldRing 2.4s ease-out infinite}
.ld-mark::after{animation-delay:1.2s}
@keyframes ldRing{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.ld-tile{position:relative;width:76px;height:76px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);
  box-shadow:0 0 44px -6px rgba(255,99,20,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ld-tile svg{width:40px;height:40px;fill:none;stroke:var(--am);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ld-tile .chk{stroke-dasharray:22;stroke-dashoffset:22;animation:ldChk 1.8s ease-in-out infinite}
@keyframes ldChk{0%{stroke-dashoffset:22}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-22}}
.ld-txt{font-size:13px;color:var(--mut);letter-spacing:.01em;min-height:18px}
.ld-txt b{display:inline-block;width:1.2em;text-align:left;font-weight:700;color:var(--or)}

/* fileira de ícones acendendo em sequência */
.ld-ico{display:flex;gap:16px;align-items:center}
.ld-ico span{display:block;width:28px;height:28px;animation:ldIco 2.5s ease-in-out infinite}
.ld-ico span:nth-child(2){animation-delay:.5s}.ld-ico span:nth-child(3){animation-delay:1s}
.ld-ico span:nth-child(4){animation-delay:1.5s}.ld-ico span:nth-child(5){animation-delay:2s}
.ld-ico .ic{width:100%;height:100%;background:var(--off);animation:ldIcoC 2.5s ease-in-out infinite;animation-delay:inherit}
@keyframes ldIco{0%,100%{transform:translateY(0);filter:none}18%,32%{transform:translateY(-5px);filter:drop-shadow(0 6px 8px rgba(255,99,20,.55))}50%{transform:translateY(0);filter:none}}
@keyframes ldIcoC{0%,100%{background:var(--off)}18%,32%{background:var(--am)}50%{background:var(--off)}}
@media(prefers-reduced-motion:reduce){
  .ld-mark::before,.ld-mark::after,.ld-bar i,.ld-ico span,.ld-ico .ic{animation:none}
  .ld-tile .chk{animation:none;stroke-dashoffset:0}
  .ld-bar i{left:31%}

    <script type="module">

        if (window.location.pathname.endsWith('.html')) {
            window.history.replaceState(null, '', window.location.pathname.replace(/\.html$/, '') + window.location.search);
        }

        import {
            auth,
            rtdb,
            googleProvider,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signInWithPopup,
            signOut,
            onAuthStateChanged,
            ref,
            onValue,
            runTransaction
        } from './firebase-config.js';
        import {
            updatePassword,
            reauthenticateWithCredential,
            EmailAuthProvider,
            sendPasswordResetEmail,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";

        const THEME_PALETTES = [
            { id: 'indigo_classic', bg: '#f8fafc', primary: '#4f46e5', primaryHover: '#4338ca', secondary: '#e0e7ff', dark: '#1e1b4b' },
            { id: 'wine_velvet',    bg: '#E8C5D0', primary: '#4A0E2E', primaryHover: '#2D081B', secondary: '#B56B82', dark: '#2A0515' },
            { id: 'emerald_nature', bg: '#e6f4ea', primary: '#059669', primaryHover: '#047857', secondary: '#a7f3d0', dark: '#064e3b' },
            { id: 'amber_gold',     bg: '#fef3c7', primary: '#d97706', primaryHover: '#b45309', secondary: '#fde68a', dark: '#78350f' },
            { id: 'slate_dark',     bg: '#f1f5f9', primary: '#334155', primaryHover: '#1e293b', secondary: '#cbd5e1', dark: '#0f172a' },
            { id: 'ocean_blue',    bg: '#eff6ff', primary: '#0369a1', primaryHover: '#075985', secondary: '#bae6fd', dark: '#0c4a6e' },
            { id: 'rose_blush',    bg: '#fff1f2', primary: '#e11d48', primaryHover: '#be123c', secondary: '#fecdd3', dark: '#881337' },
            { id: 'violet_dream',  bg: '#f5f3ff', primary: '#7c3aed', primaryHover: '#6d28d9', secondary: '#ddd6fe', dark: '#4c1d95' },
            { id: 'teal_fresh',    bg: '#f0fdfa', primary: '#0d9488', primaryHover: '#0f766e', secondary: '#99f6e4', dark: '#134e4a' },
            { id: 'sunset',        bg: '#fff7ed', primary: '#ea580c', primaryHover: '#c2410c', secondary: '#fed7aa', dark: '#7c2d12' },
            { id: 'fuchsia_pop',   bg: '#fdf4ff', primary: '#c026d3', primaryHover: '#a21caf', secondary: '#f5d0fe', dark: '#701a75' },
            { id: 'lime_garden',   bg: '#f7fee7', primary: '#4d7c0f', primaryHover: '#3f6212', secondary: '#d9f99d', dark: '#1a2e05' },
            { id: 'coffee_mocha',  bg: '#f5ebe0', primary: '#6f4e37', primaryHover: '#5a3e2b', secondary: '#d6ccc2', dark: '#3b2a1e' },
            { id: 'midnight_navy', bg: '#e2e8f0', primary: '#1e3a8a', primaryHover: '#172554', secondary: '#bfdbfe', dark: '#0b1437' },
            { id: 'cherry_red',    bg: '#fef2f2', primary: '#dc2626', primaryHover: '#b91c1c', secondary: '#fecaca', dark: '#7f1d1d' },
            { id: 'primstav',       bg: '#fffbeb', primary: '#d97706', primaryHover: '#b45309', secondary: '#fde68a', dark: '#78350f' }
        ];

        function getDefWH() {
            return {
                0: { active: false, start: '09:00', end: '13:00' },
                1: { active: true,  start: '09:00', end: '18:00' },
                2: { active: true,  start: '09:00', end: '18:00' },
                3: { active: true,  start: '09:00', end: '18:00' },
                4: { active: true,  start: '09:00', end: '18:00' },
                5: { active: true,  start: '09:00', end: '18:00' },
                6: { active: true,  start: '09:00', end: '14:00' }
            };
        }

        window.esc = function(v) {
            return String(v === undefined || v === null ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        };
        function toList(v) { return Array.isArray(v) ? v.filter(x => x) : (v ? Object.values(v) : []); }
        window.localDateStr = function(d = new Date()) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        const isDepositExpired = (a) => !!a && a.status === 'pendente' && !!a.depositDeadline && new Date(a.depositDeadline) < new Date();
        const isBusyStatus = (a) => a.status !== 'cancelado' && a.status !== 'nao_compareceu' && !isDepositExpired(a);

        const urlParams = new URLSearchParams(window.location.search);
        const orgSlug = urlParams.get('org');
        const slugInvalid = !orgSlug || /[.$#\[\]\/]/.test(orgSlug);

        if (slugInvalid) {
            document.getElementById('app').innerHTML = `<div class="bg-white p-5 sm:p-8 rounded-3xl shadow-xl border text-center max-w-md w-full m-auto"><h2 class="text-xl font-bold text-rose-600 mb-2">Link Inválido</h2><p class="text-slate-500 text-sm">Nenhuma organização válida foi especificada no link de agendamento.</p></div>`;
        } else {
            const basePath = 'agendapro_saas/tenants/' + orgSlug;
            const tenantRef = ref(rtdb, basePath);
            const storageKey = 'agendaProClient_' + orgSlug;

            window.t = null;
            window.tenantRef = tenantRef;
            window.clientAuthMode = 'login';
            window.clientAuthWanted = false;
            window.authNotice = '';
            window.clientActiveTab = 'book';
            window.clientBooking = { step: null, date: null, procedures: [], employeeId: null, time: null, isForOther: false, beneficiaryName: '' };
            window.clientCalYear = new Date().getFullYear();
            window.clientCalMonth = new Date().getMonth();
            window.showHistoryApps = false;
            window.hasRendered = false;
            window.clientBusy = false;

            function saveClientId(id) { localStorage.setItem(storageKey, JSON.stringify({ id })); }

            window.currentClient = null;

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    saveClientId(user.uid);

                    const freshClient = (window.t && window.t.clients) ? window.t.clients.find(c => c.id === user.uid || (c.email && c.email.toLowerCase() === (user.email || '').toLowerCase())) : null;
                    if (freshClient) { freshClient.id = user.uid; currentClient = freshClient; }
                    else currentClient = null;
                    if (window.hasRendered) safeRender();
                } else {
                    currentClient = null;
                    localStorage.removeItem(storageKey);
                    if (window.hasRendered) safeRender();
                }
            });

            let pendingRender = false;
            function isUserTyping() {
                const el = document.activeElement;
                const appEl = document.getElementById('app');
                return !!(el && appEl && appEl.contains(el) && ['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName));
            }
            function safeRender() {
                if (window.hasRendered && isUserTyping()) { pendingRender = true; return; }
                pendingRender = false;
                render();
            }
            document.getElementById('app').addEventListener('focusout', () => {
                if (!pendingRender) return;
                setTimeout(() => { if (pendingRender && !isUserTyping()) safeRender(); }, 250);
            });

            window.providerInfo = null;
            window.watchPayId = null;
            onValue(ref(rtdb, 'agendapro_saas/providers/' + orgSlug), (snap) => {
                window.providerInfo = snap.val();
                if (window.hasRendered && window.t) safeRender();
            }, () => {});

            onValue(tenantRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    document.getElementById('app').innerHTML = `<div class="bg-white p-5 sm:p-8 rounded-3xl shadow-xl border text-center max-w-md w-full m-auto"><h2 class="text-xl font-bold text-rose-600 mb-2">Empresa não encontrada</h2><p class="text-slate-500 text-sm">A empresa informada não existe no sistema.</p></div>`;
                    return;
                }
                window.t = data;
                if (!t.admin) t.admin = { id: 'admin', name: 'Administrador' };
                if (!t.admin.workingHours) t.admin.workingHours = getDefWH();
                if (!t.admin.exceptions) t.admin.exceptions = {};
                t.clients = toList(t.clients);
                t.appointments = toList(t.appointments);
                t.procedures = toList(t.procedures);
                t.employees = toList(t.employees);
                t.employees.forEach(e => {
                    if (!e.workingHours) e.workingHours = t.admin.workingHours || getDefWH();
                    if (!e.exceptions) e.exceptions = {};
                });

                applyThemeCSS(t.themePalette || 'primstav');
                applyBgImageSettings();
                if (window.checkPaymentConfirmed) window.checkPaymentConfirmed();

                if (auth.currentUser) {
                    const freshClient = t.clients.find(c => c.id === auth.currentUser.uid || (c.email && c.email.toLowerCase() === (auth.currentUser.email || '').toLowerCase()));
                    if (freshClient) {
                        freshClient.id = auth.currentUser.uid;
                        currentClient = freshClient;
                    } else {
                        currentClient = null;
                    }
                }

                safeRender();
            }, (error) => {
                document.getElementById('app').innerHTML = `<div class="bg-white p-5 sm:p-8 rounded-3xl shadow-xl border text-center max-w-md w-full m-auto"><h2 class="text-xl font-bold text-rose-600 mb-2">Não foi possível carregar</h2><p class="text-slate-500 text-sm mb-4">Verifique sua conexão e tente novamente.</p><button onclick="location.reload()" class="btn-theme-primary font-bold px-6 py-3 rounded-xl">Tentar novamente</button></div>`;
            });

            window.addEventListener('resize', () => {
                if (window.t) applyBgImageSettings();
            });

            function applyThemeCSS(paletteId) {
                const palette = THEME_PALETTES.find(p => p.id === paletteId) || THEME_PALETTES[0];
                document.documentElement.style.setProperty('--theme-bg', palette.bg);
                document.documentElement.style.setProperty('--theme-primary', palette.primary);
                document.documentElement.style.setProperty('--theme-primary-hover', palette.primaryHover);
                document.documentElement.style.setProperty('--theme-secondary', palette.secondary);
                document.documentElement.style.setProperty('--theme-text-primary', palette.dark);
                document.documentElement.setAttribute('data-palette', palette.id);
                if (window.__autoMode) window.__autoMode(palette.id === 'primstav' && !(window.t && window.t.themePalette));
            }

            function applyBgImageSettings() {
                const isMobile = window.innerWidth <= 768;
                const useMobile = isMobile && !!t.bgMobileImage;
                const pre = useMobile ? 'bgMobile' : 'bgCustom';
                const img = useMobile ? t.bgMobileImage : (t.bgCustomImage || t.bgMobileImage);
                const op = t[pre + 'Opacity'] !== undefined && t[pre + 'Opacity'] !== null ? t[pre + 'Opacity'] : 0.15;
                const blur = t[pre + 'Blur'] || 0;
                const px = t[pre + 'PosX'] !== undefined && t[pre + 'PosX'] !== null ? t[pre + 'PosX'] : 50;
                const py = t[pre + 'PosY'] !== undefined && t[pre + 'PosY'] !== null ? t[pre + 'PosY'] : 50;
                const zoom = t[pre + 'Zoom'] || 100;

                if (img) {
                    document.documentElement.style.setProperty('--bg-image', `url("${img}")`);
                    document.documentElement.style.setProperty('--bg-opacity', op);
                    document.documentElement.style.setProperty('--bg-blur', blur + 'px');
                    document.documentElement.style.setProperty('--bg-pos', `${px}% ${py}%`);
                    document.documentElement.style.setProperty('--bg-zoom', zoom / 100);
                } else {
                    document.documentElement.style.setProperty('--bg-image', 'none');
                }
            }

            window.createAppointment = function(newApp) {
                let conflict = false;
                return runTransaction(ref(rtdb, basePath + '/appointments'), (cur) => {
                    conflict = false;
                    const list = toList(cur);
                    const s = timeToMins(newApp.time), e = s + newApp.totalDuration;
                    const clash = list.some(a => a.employeeId === newApp.employeeId && a.date === newApp.date && isBusyStatus(a)
                        && s < timeToMins(a.time) + a.totalDuration && e > timeToMins(a.time));
                    if (clash) { conflict = true; return; }
                    list.push(newApp);
                    return list;
                }).then(res => ({ ok: res.committed, conflict }));
            };

            window.setAppointmentStatus = function(id, status) {
                return runTransaction(ref(rtdb, basePath + '/appointments'), (cur) => {
                    if (!cur) return;
                    const list = toList(cur);
                    const item = list.find(a => a.id === id);
                    if (!item) return;
                    item.status = status;
                    return list;
                });
            };

            window.updateClientInDatabase = function() {
                const me = currentClient;
                return runTransaction(ref(rtdb, basePath + '/clients'), (cur) => {
                    const list = toList(cur);
                    const i = list.findIndex(c => c.id === me.id);
                    if (i === -1) {
                        list.push(me);
                    } else {
                        list[i] = me;
                    }
                    return list;
                }).then(() => { saveClientId(me.id); });
            };

            window.formatDateBR = function(dateStr) { return dateStr.split('-').reverse().join('/'); };
            window.timeToMins = function(t) { const [h,m] = t.split(':'); return parseInt(h)*60 + parseInt(m); };
            window.minsToTime = function(m) { const h = Math.floor(m/60).toString().padStart(2,'0'); const mins = (m%60).toString().padStart(2,'0'); return `${h}:${mins}`; };

            window.formatPhoneInput = function(input) {
                let v = input.value.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);

                if (v.length > 10) {
                    v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
                } else if (v.length > 6) {
                    v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
                } else if (v.length > 2) {
                    v = v.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
                } else if (v.length > 0) {
                    v = v.replace(/^(\d*)$/, '($1');
                }
                input.value = v;
            };

            window.cleanPhone = function(p) {
                return (p || '').replace(/\D/g, '');
            };

            window.getEffectiveAppStatus = function(appItem) {
                if (appItem.status === 'cancelado') return 'cancelado';
                if (appItem.status === 'nao_compareceu') return 'nao_compareceu';
                if (appItem.status === 'realizado') return 'realizado';
                if (appItem.status === 'pendente') return (isDepositExpired(appItem) || new Date(appItem.date + 'T' + appItem.time) < new Date()) ? 'expirado' : 'pendente';
                const appDateTime = new Date(appItem.date + 'T' + appItem.time);
                if (appDateTime < new Date()) return 'realizado';
                return 'agendado';
            };

            window.doesEmployeeWorkOnDate = function(emp, dateStr) {
                if (!emp) return false;
                if (emp.exceptions && emp.exceptions[dateStr]) {
                    if (emp.exceptions[dateStr].type === 'folga') return false;
                    if (emp.exceptions[dateStr].type === 'plantao') return true;
                }
                if (t.admin && t.admin.exceptions && t.admin.exceptions[dateStr]) {
                    if (t.admin.exceptions[dateStr].type === 'folga') return false;
                    if (t.admin.exceptions[dateStr].type === 'plantao') return true;
                }
                const [y, m, d] = dateStr.split('-');
                const dayOfWeek = new Date(y, m - 1, d).getDay();
                const whSource = emp.workingHours || (t.admin ? t.admin.workingHours : null) || getDefWH();
                return whSource?.[dayOfWeek]?.active !== false;
            };

            window.legacyDateAllowed = function(cellDate) {
                const today = new Date();
                today.setHours(0,0,0,0);
                if (cellDate < today) return false;
                const currentYear = today.getFullYear();
                const currentMonth = today.getMonth();
                const cellYear = cellDate.getFullYear();
                const cellMonth = cellDate.getMonth();
                const cellDay = cellDate.getDate();

                const totalDaysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
                const isLastWeekOfCurrentMonth = today.getDate() > (totalDaysInCurrentMonth - 7);

                if (cellYear === currentYear && cellMonth === currentMonth) return true;
                const nextMonthDate = new Date(currentYear, currentMonth + 1, 1);
                if (cellYear === nextMonthDate.getFullYear() && cellMonth === nextMonthDate.getMonth()) {
                    if (!isLastWeekOfCurrentMonth) return false;
                    const totalDaysInNextMonth = new Date(cellYear, cellMonth + 1, 0).getDate();
                    if (cellDay > (totalDaysInNextMonth - 7)) return false;
                    return true;
                }
                return false;
            };

            window.isCompanyOpenOnDate = function(dateStr) {
                const cellDate = new Date(dateStr + 'T00:00:00');
                if (!isDateAllowedByMonthlyRule(cellDate)) return false;

                if (t.employees && t.employees.length > 0) {
                    return t.employees.some(emp => doesEmployeeWorkOnDate(emp, dateStr));
                }
                return doesEmployeeWorkOnDate(t.admin, dateStr);
            };

            window.hasAnyFreeSlot = function(dateStr) {
                const ids = (t.employees && t.employees.length > 0) ? t.employees.map(e => e.id) : (t.admin?.id ? [t.admin.id] : ['admin']);
                return ids.some(id => getAvailableTimeSlots(id, dateStr, 30).length > 0);
            };

            window.doesClientHaveCollision = function(dateStr, startMins, durationMins) {
                if (!currentClient) return false;
                const reschedId = clientBooking.resched ? clientBooking.resched.id : null;
                const clientApps = t.appointments.filter(a => a.clientId === currentClient.id && a.date === dateStr && isBusyStatus(a) && a.id !== reschedId);
                const endMins = startMins + durationMins;

                for (let a of clientApps) {
                    const aStart = timeToMins(a.time);
                    const aEnd = aStart + a.totalDuration;
                    if (startMins < aEnd && endMins > aStart) return true;
                }
                return false;
            };

            window.getAvailableTimeSlots = function(empId, dateStr, durationMins) {
                const emp = (t.admin && empId === t.admin.id) ? t.admin : ((t.employees || []).find(e => e.id === empId) || t.admin);
                if(!emp || !doesEmployeeWorkOnDate(emp, dateStr)) return [];

                let start = '09:00', end = '18:00';
                const excEmp = emp.exceptions?.[dateStr];
                const excAdmin = t.admin?.exceptions?.[dateStr];

                if (excEmp && excEmp.type === 'plantao') { start = excEmp.start; end = excEmp.end; }
                else if (excAdmin && excAdmin.type === 'plantao') { start = excAdmin.start; end = excAdmin.end; }
                else {
                    const [y, m, d] = dateStr.split('-');
                    const dayOfWeek = new Date(y, m - 1, d).getDay();
                    const def = getDefWH();
                    const wh = emp.workingHours?.[dayOfWeek] || (t.admin ? t.admin.workingHours?.[dayOfWeek] : null) || def[dayOfWeek];
                    if(wh && wh.active) { start = wh.start; end = wh.end; } else return [];
                }

                const startMins = timeToMins(start);
                const endMins = timeToMins(end);
                const reschedId = clientBooking.resched ? clientBooking.resched.id : null;
                const empApps = (t.appointments || []).filter(a => a.employeeId === empId && a.date === dateStr && isBusyStatus(a) && a.id !== reschedId);
                const slots = [];

                const now = new Date();
                const isToday = dateStr === localDateStr(now);
                const nowMins = now.getHours() * 60 + now.getMinutes();

                for(let m = startMins; m <= endMins - durationMins; m += 30) {
                    if (isToday && m <= nowMins) continue;

                    let overlap = false;
                    const slotEnd = m + durationMins;

                    for(let a of empApps) {
                        const aStart = timeToMins(a.time);
                        const aEnd = aStart + a.totalDuration;
                        if(m < aEnd && slotEnd > aStart) { overlap = true; break; }
                    }

            /* ---- animação do card (mesmo motor do entrar.html) ---- */
            function initAuthCard(intro) {
                const c = document.getElementById('ac-card'); if (!c) return;
                if (window.__acRO) { try { window.__acRO.disconnect(); } catch (e) {} }
                const p = document.getElementById('ac-ring-path'), g = document.getElementById('ac-rg'),
                    tl = document.getElementById('ac-tab-tl'), br = document.getElementById('ac-tab-br'), tfs = c.querySelectorAll('#ac-tabs .tf'),
                    rip = c.querySelector('.ac-ripple'), reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
                const TAB = 38, GO = 81, S = 240, SHRINK = 480, SLIDE = 340;
                let K = 0;
                function place() {
                    const W = c.offsetWidth, H = c.offsetHeight, o = GO * K;
                    if (tl) tl.setAttribute('transform', 'translate(' + o.toFixed(2) + ' ' + o.toFixed(2) + ')');
                    if (br) br.setAttribute('transform', 'translate(' + (W - TAB - o).toFixed(2) + ' ' + (H - TAB - o).toFixed(2) + ')');
                    for (let i = 0; i < tfs.length; i++) tfs[i].style.opacity = (.9 * K).toFixed(3);
                }
                function draw() {
                    const W = c.offsetWidth, H = c.offsetHeight, C0 = 46, R = 24, d = .6;
                    p.setAttribute('d', 'M' + d + ' ' + C0 + 'L' + C0 + ' ' + d + 'L' + (W - R) + ' ' + d + 'A' + (R - d) + ' ' + (R - d) + ' 0 0 1 ' + (W - d) + ' ' + R + 'L' + (W - d) + ' ' + (H - C0) + 'L' + (W - C0) + ' ' + (H - d) + 'L' + R + ' ' + (H - d) + 'A' + (R - d) + ' ' + (R - d) + ' 0 0 1 ' + d + ' ' + (H - R) + 'Z');
                    g.setAttribute('x2', W); g.setAttribute('y2', H);
                    place();
                }
                draw();
                if (window.ResizeObserver) { window.__acRO = new ResizeObserver(draw); window.__acRO.observe(c); }
                const T = { set: function(k) { K = k; place(); }, get: function() { return K; } };
                const C = { busy: false, tk: 0 };
                const wait = ms => new Promise(r => setTimeout(r, ms));
                const reflow = () => void c.offsetWidth;
                const fix = (w, h) => { c.style.maxWidth = 'none'; c.style.width = w + 'px'; c.style.height = h + 'px'; };
                const release = () => { c.style.width = ''; c.style.height = ''; c.style.maxWidth = ''; c.classList.remove('morphing'); };
                function natural() {
                    const s0 = [c.style.width, c.style.height, c.style.maxWidth, c.style.transition];
                    c.style.transition = 'none'; c.style.width = ''; c.style.height = ''; c.style.maxWidth = '';
                    const r = { w: c.offsetWidth, h: c.offsetHeight };
                    c.style.width = s0[0]; c.style.height = s0[1]; c.style.maxWidth = s0[2]; c.style.transition = s0[3];
                    return r;
                }
                function ripple() { if (!rip) return; rip.classList.remove('go'); void rip.offsetWidth; rip.classList.add('go'); }
                function settle() {
                    return new Promise(res => {
                        let done = false, tm;
                        function fin() { if (done) return; done = true; c.removeEventListener('transitionend', on); clearTimeout(tm); requestAnimationFrame(() => res()); }
                        function on(e) { if (e.target === c && e.propertyName === 'height') fin(); }
                        c.addEventListener('transitionend', on);
                        tm = setTimeout(fin, SHRINK + 400);
                    });
                }
                const ease = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
                function reset() { release(); c.classList.remove('card-closed', 'icon'); T.set(0); }
                function slide(to, ms) {
                    return new Promise(res => {
                        if (reduce) { T.set(to); res(); return; }
                        const from = T.get(); let t0 = null, done = false;
                        function fin() { if (done) return; done = true; T.set(to); res(); }
                        function f(ts) { if (done) return; if (t0 === null) t0 = ts; const u = Math.min(1, (ts - t0) / ms); T.set(from + (to - from) * ease(u)); if (u < 1) requestAnimationFrame(f); else fin(); }
                        requestAnimationFrame(f); setTimeout(fin, ms + 150);
                    });
                }
                C.close = function() {
                    if (reduce) return Promise.resolve();
                    fix(c.offsetWidth, c.offsetHeight); reflow();
                    c.classList.add('morphing', 'card-closed');
                    c.style.width = S + 'px'; c.style.height = S + 'px';
                    return settle().then(() => { c.classList.add('icon'); return slide(1, SLIDE); });
                };
                C.open = function() {
                    if (reduce) { release(); c.classList.remove('card-closed', 'icon'); return Promise.resolve(); }
                    c.classList.remove('icon');
                    return slide(0, SLIDE).then(() => {
                        const n = natural(); ripple();
                        c.classList.add('morphing'); c.classList.remove('card-closed');
                        c.style.width = n.w + 'px'; c.style.height = n.h + 'px';
                        return settle().then(release);
                    });
                };
                C.run = function(fn) {
                    if (C.busy) return Promise.resolve();
                    C.busy = true;
                    return C.close().then(() => { try { fn(); } catch (e) { console.error(e); } return wait(60); }).then(C.open).then(() => { C.busy = false; }, () => { C.busy = false; reset(); });
                };

                if (intro && !reduce) {
                    try {
                        c.classList.add('init', 'card-closed', 'icon'); fix(S, S); T.set(1); C.busy = true;
                        requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove('init')));
                        setTimeout(() => { C.open().then(() => { C.busy = false; }); }, 350);
                    } catch (e) { reset(); C.busy = false; }
                    setTimeout(() => { if (C.busy) { C.busy = false; reset(); } }, 5000);
                }
            }

            async function linkExistingClient(user) {
                const email = (user.email || '').toLowerCase();
                await runTransaction(ref(rtdb, basePath + '/clients'), (cur) => {
                    if (!cur) return;
                    const list = toList(cur);
                    if (list.some(c => c.id === user.uid)) return;
                    const byEmail = list.find(c => c.email && c.email.toLowerCase() === email);
                    if (!byEmail) return;
                    byEmail.id = user.uid;
                    return list;
                });
            }

            const SOCIAL = {
                google:   { provider: googleProvider,   nome: 'Google' },
            };

            function erroSocial(err, nome) {
                const c = (err && err.code) || '';
                if (c === 'auth/account-exists-with-different-credential') return 'Já existe uma conta com o e-mail do seu ' + nome + ', criada de outra forma (e-mail e senha ou outro botão). Entre pelo método que você usou antes.';
                if (c === 'auth/operation-not-allowed') return 'O login com ' + nome + ' ainda não está ativado. Fale com o estabelecimento.';
                if (c === 'auth/popup-blocked') return 'O navegador bloqueou a janela de login. Libere pop-ups para este site e tente de novo.';
                if (c === 'auth/unauthorized-domain') return 'Este endereço do site ainda não foi autorizado para o login com ' + nome + '.';
                return 'Não foi possível entrar com ' + nome + '. Tente novamente.';
            }

            window.handleClientSocialAuth = async function(tipo) {
                const cfg = SOCIAL[tipo]; if (!cfg || window.clientBusy) return;
                acHide(); acClear();
                let ok = false, msg = '';
                try {
                    window.clientBusy = true;
                    try { await setPersistence(auth, acRemember() ? browserLocalPersistence : browserSessionPersistence); } catch (x) {}
                    const result = await signInWithPopup(auth, cfg.provider);
                    await linkExistingClient(result.user);
                    ok = true;
                } catch (err) {
                    if (!(err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request'))) msg = erroSocial(err, cfg.nome);
                } finally {
                    window.clientBusy = false;
                }
                if (ok) { try { document.activeElement && document.activeElement.blur(); } catch (e) {} safeRender(); return; }
                if (!document.getElementById('ac-card')) safeRender();
                if (msg) acNotify(msg, 'err');
            };

            window.clientForgotPassword = async function() {
                acHide(); acClear();

            };

            window.handleClientAuthSubmit = async function(e) {

                const gv = id => { const x = document.getElementById(id); return x ? x.value : ''; };
                const reg = clientAuthMode === 'register';
                const email = gv('c-auth-email').trim().toLowerCase();
                const pass = gv('c-auth-pass').trim();
                let name = '', phoneRaw = '';

                if (reg) {
                    name = gv('c-auth-name').trim(); phoneRaw = gv('c-auth-phone');
                    if (!name || name.length < 3) return acFail('Por favor, informe seu nome completo.', ['c-auth-name']);
                    if (cleanPhone(phoneRaw).length !== 11) return acFail('Informe um telefone/WhatsApp válido com DDD e 9 dígitos. Exemplo: (11) 98765-4321', ['c-auth-phone']);
                }
                if (!email) return acFail('Digite o seu e-mail.', ['c-auth-email']);
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return acFail('O e-mail digitado não é válido. Exemplo: nome@gmail.com.', ['c-auth-email']);
                if (!pass) return acFail('Digite a sua senha.', ['c-auth-pass']);
                if (reg && pass.length < 6) return acFail('A senha deve ter no mínimo 6 caracteres.', ['c-auth-pass']);
                if (reg && !document.getElementById('c-auth-aceite').checked) return acFail('Para criar a conta, marque a confirmação de que você leu a Política de Privacidade.', ['ac-terms']);

                const btn = document.getElementById('ac-submit'), label = btn ? btn.textContent : '';
                if (btn) { btn.disabled = true; btn.textContent = 'Aguarde...'; }
                window.clientBusy = true;
                let ok = false, msg = '', ids = [];
                try {
                    try { await setPersistence(auth, acRemember() ? browserLocalPersistence : browserSessionPersistence); } catch (x) {}
                    if (reg) {
                        let user;
                        try {
                            user = (await createUserWithEmailAndPassword(auth, email, pass)).user;
                        } catch (err) {
                            const c = (err && err.code) || '';
                            if (c === 'auth/email-already-in-use') {
                                try { user = (await signInWithEmailAndPassword(auth, email, pass)).user; }
                                catch (err2) { throw acErr('Este e-mail já tem conta, mas a senha está incorreta. Se você já agendou antes, use a senha que criou.', ['c-auth-pass']); }
                            } else {
                                throw acErr(window.traduzErroAuth(err, 'cadastro'), /email/.test(c) ? ['c-auth-email'] : /password/.test(c) ? ['c-auth-pass'] : []);
                            }
                        }
                        await addClientRecord(user, name, phoneRaw);
                    } else {
                        let user;
                        try {
                            user = (await signInWithEmailAndPassword(auth, email, pass)).user;
                        } catch (err) {
                            const c = (err && err.code) || '';
                            throw acErr((c === 'auth/too-many-requests' || c === 'auth/network-request-failed') ? window.traduzErroAuth(err, 'login') : 'E-mail ou senha incorretos.', ['c-auth-email', 'c-auth-pass']);
                        }
                        await linkExistingClient(user);
                    }
                    ok = true;
                } catch (err) {
                    msg = err.acMsg || window.traduzErroAuth(err, 'cadastro'); ids = err.acIds || [];
                } finally {
                    window.clientBusy = false;
                }
                if (ok) { try { document.activeElement && document.activeElement.blur(); } catch (x) {} safeRender(); return; }
                const b2 = document.getElementById('ac-submit'); if (b2) { b2.disabled = false; b2.textContent = label; }
                acFail(msg, ids);
            };

            async function addClientRecord(user, name, phoneRaw) {
                const email = (user.email || '').toLowerCase();
                const newClient = { id: user.uid, name, email, phone: phoneRaw, avatar: user.photoURL || '' };
                await runTransaction(ref(rtdb, basePath + '/clients'), (cur) => {
                    const list = toList(cur);
                    const existing = list.find(c => c.id === user.uid || (c.email && c.email.toLowerCase() === email));
                    if (existing) { existing.id = user.uid; if (!existing.phone) existing.phone = phoneRaw; if (!existing.name) existing.name = name; }
                    else list.push(newClient);
                    return list;
                });
            }

                        const logo = t.logo ? `<img src="${esc(t.logo)}" alt="">` : `<span>${esc((t.name || 'O').charAt(0).toUpperCase())}</span>`;
                        nav.innerHTML = `
                            <div class="cn-bar">
                                <div class="cn-glass"></div>
                                <svg class="cn-stroke" aria-hidden="true"><defs><linearGradient id="cn-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--cn-rim1)"/><stop offset="1" style="stop-color:var(--cn-rim2)"/></linearGradient></defs><path d=""/></svg>
                                <div class="cn-items">
                                    <button type="button" class="cn-head" data-k="company" aria-label="Início"><span class="cn-logo">${logo}</span><span class="cn-txt" style="--i:0"><b>${esc(t.name || '')}</b><small>Área de agendamento</small></span></button>
                                    <span class="cn-pill"></span><span class="cn-hov"></span>
                                    ${ORDER.map((key, i) => `<button type="button" class="cn-it${key === 'profile' ? ' pf' : ''}" data-k="${key}" style="--i:${i + 1}" aria-label="${LB[key]}" title="${LB[key]}"><span class="cn-ic"><span class="cn-chip${key === 'profile' && !guest ? ' av' : ''}">${slot(key)}</span></span><span class="cn-txt"><b>${LB[key]}</b>${key === 'profile' ? `<small>${guest ? 'Entre ou crie sua conta' : esc(me.name)}</small>` : ''}</span></button>`).join('')}
                                </div>
                                <div class="cn-bub"><div class="cn-bub-in">${ORDER.map(key => `<span class="cn-bi" data-k="${key}">${key === 'profile' ? (guest ? '<i data-lucide="log-in"></i>' : (me.avatar ? `<img src="${esc(me.avatar)}" alt="">` : `<b>${inicial}</b>`)) : `<i data-lucide="${IC[key]}"></i>`}</span>`).join('')}</div></div>
                            </div>`;
                        S.sig = sig;
                    }

                    const bar = nav.firstElementChild;
                    const bub = nav.querySelector('.cn-bub');
                    const glass = nav.querySelector('.cn-glass');
                    const stroke = nav.querySelector('.cn-stroke');
                    const sp = stroke.querySelector('path');
                    const pill = nav.querySelector('.cn-pill');
                    const hov = nav.querySelector('.cn-hov');

                    const mark = key => items().forEach(b => { const on = b.dataset.k === key; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
                    const bubbleOn = key => nav.querySelectorAll('.cn-bi').forEach(s => s.classList.toggle('on', s.dataset.k === key));
                    const centerX = key => { const b = itemOf(key); return b ? b.offsetLeft + b.offsetWidth / 2 : 0; };

                    // desenha a barra com o "recorte" onde a bolha encaixa
                    const draw = x => {
                        const W = bar.clientWidth, H = bar.clientHeight;
                        if (!W || !H) return;
                        bub.style.setProperty('--bx', x + 'px');
                        const hw = 34, dp = 29, R = H / 2, a = x - hw, b = x + hw;
                        const rl = Math.max(2, Math.min(R, a)), rr = Math.max(2, Math.min(R, W - b));
                        const d = `M${rl},0 L${a},0 C${a + hw * .52},0 ${x - hw * .62},${dp} ${x},${dp} C${x + hw * .62},${dp} ${b - hw * .52},0 ${b},0 L${W - rr},0 A${rr},${rr} 0 0 1 ${W},${rr} L${W},${H - R} A${R},${R} 0 0 1 ${W - R},${H} L${R},${H} A${R},${R} 0 0 1 0,${H - R} L0,${rl} A${rl},${rl} 0 0 1 ${rl},0 Z`;
                        glass.style.clipPath = `path("${d}")`;
                        glass.style.webkitClipPath = `path("${d}")`;
                        stroke.setAttribute('width', W); stroke.setAttribute('height', H);
                        sp.setAttribute('d', d);
                    };
                    const run = (x0, x1, mid) => {
                        cancelAnimationFrame(S.raf);
                        const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
                        const dur = reduce ? 1 : Math.min(720, 430 + Math.abs(x1 - x0) * .55), t0 = performance.now();
                        let did = false;
                        nav.classList.add('cn-moving');
                        const step = now => {
                            const p = Math.min(1, (now - t0) / dur);
                            const e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
                            S.x = x0 + (x1 - x0) * e;
                            draw(S.x);
                            if (!did && p >= .45) { did = true; mid(); }
                            if (p < 1) S.raf = requestAnimationFrame(step);
                            else { if (!did) mid(); nav.classList.remove('cn-moving'); }
                        };
                        S.raf = requestAnimationFrame(step);
                    };
                    // pílula que desliza entre os itens (PC)
                    const movePill = (el, key, instant) => {
                        const b = itemOf(key);
                        if (!b) return;
                        if (instant) el.style.transition = 'none';
                        el.style.setProperty('--py', b.offsetTop + 'px');
                        el.style.height = b.offsetHeight + 'px';
                        if (instant) { void el.offsetWidth; el.style.transition = ''; }
                    };

                    if (!S.bound) {
                        S.bound = true;
                        nav.addEventListener('click', e => {
                            const b = e.target.closest('[data-k]');
                            if (!b || !nav.contains(b) || b.classList.contains('cn-bi')) return;
                            const key = b.dataset.k, g = !currentClient;

                            if (key === 'appointments') { if (g) return requestAuth('Entre ou crie sua conta para ver seus horários.'); clientActiveTab = 'appointments'; return render(); }
                            clientActiveTab = key; render();
                        });
                        nav.addEventListener('mouseover', e => {
                            const b = e.target.closest('.cn-it'), h = nav.querySelector('.cn-hov');
                            if (!h || !isDesk()) return;
                            if (!b || b.classList.contains('on')) { h.classList.remove('show'); return; }
                            const wasOn = h.classList.contains('show');
                            const bt = b.offsetTop;
                            if (!wasOn) h.style.transition = 'none';
                            h.style.setProperty('--py', bt + 'px'); h.style.height = b.offsetHeight + 'px';
                            if (!wasOn) { void h.offsetWidth; h.style.transition = ''; }
                            h.classList.add('show');
                        });
                        nav.addEventListener('mouseleave', () => { const h = nav.querySelector('.cn-hov'); if (h) h.classList.remove('show'); });
                        const relayout = () => {
                            if (!S.shown || !nav.firstElementChild) return;
                            if (isDesk()) movePill(nav.querySelector('.cn-pill'), S.key, true);
                            else { cancelAnimationFrame(S.raf); nav.classList.remove('cn-moving'); S.x = centerX(S.key); (S.draw || (() => {}))(S.x); }
                        };
                        if (window.ResizeObserver) new ResizeObserver(relayout).observe(nav);
                        window.addEventListener('resize', relayout);
                    }
                    S.draw = draw;

                    const prev = S.key;
                    S.key = k;
                    const animate = !first && !rebuilt && prev && prev !== k && !isDesk();
                    if (animate) {
                        items().forEach(b => b.classList.remove('on'));       // o ícone antigo volta pra barra
                        run(S.x == null ? centerX(prev) : S.x, centerX(k), () => { mark(k); bubbleOn(k); });
                    } else {
                        cancelAnimationFrame(S.raf); nav.classList.remove('cn-moving');
                        mark(k); bubbleOn(k);
                        if (isDesk()) movePill(pill, k, first || rebuilt);
                        else { S.x = centerX(k); draw(S.x); }
                    }
                } catch (err) { console.warn('cnav', err); }
            }

            function coPhoto() { return t.companyPhoto || t.coverImage || t.companyImage || ''; }
            function coAbout() { return t.companyAbout || t.about || t.description || ''; }
            function coAddress() { return t.companyAddress || t.address || t.location || ''; }
            function coPhone() { return t.companyPhone || t.phone || t.whatsapp || ''; }
            function procPhoto(p) { return p.photo || p.image || p.catalogPhoto || p.img || ''; }
            function procDesc(p) { return p.description || p.desc || p.details || ''; }
            function procCat(p) { return (p.category || p.categoria || '').toString().trim(); }
            function brl(v) { return 'R$ ' + (Number(v) || 0).toFixed(2).replace('.', ','); }
            function fmtDur(m) { m = Number(m) || 0; if (m < 60) return m + ' min'; const h = Math.floor(m / 60), r = m % 60; return h + 'h' + (r ? String(r).padStart(2, '0') : ''); }

            const CO_DAYS_LONG = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
            function coFmt(m) { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
            function coDateOffset(off, base) { const b = base ? new Date(base) : new Date(); const d = new Date(b.getFullYear(), b.getMonth(), b.getDate() + off); return localDateStr(d); }
            function coToMins(v) { return /^\d{1,2}:\d{2}$/.test(String(v || '')) ? timeToMins(v) : null; }

            function coDayIntervals(dateStr) {
                const admin = t.admin || {};
                const provs = (t.employees && t.employees.length) ? t.employees : [admin];
                const [y, m, d] = dateStr.split('-');
                const dow = new Date(y, m - 1, d).getDay();
                const def = getDefWH();
                const raw = []; let usedPlantao = false, sawFolga = false;
                if (admin.exceptions && admin.exceptions[dateStr] && admin.exceptions[dateStr].type === 'folga') sawFolga = true;
                provs.forEach(pv => {
                    if (pv && pv.exceptions && pv.exceptions[dateStr] && pv.exceptions[dateStr].type === 'folga') sawFolga = true;
                    if (!doesEmployeeWorkOnDate(pv, dateStr)) return;
                    const excE = pv.exceptions && pv.exceptions[dateStr], excA = admin.exceptions && admin.exceptions[dateStr];
                    let st, en, plant = false;
                    if (excE && excE.type === 'plantao') { st = excE.start; en = excE.end; plant = true; }
                    else if (excA && excA.type === 'plantao') { st = excA.start; en = excA.end; plant = true; }
                    else {
                        const wh = (pv.workingHours && pv.workingHours[dow]) || (admin.workingHours && admin.workingHours[dow]) || def[dow];
                        if (!wh || !wh.active) return;
                        st = wh.start; en = wh.end;
                    }
                    let a = coToMins(st), b = coToMins(en);
                    if (a === null || b === null) return;
                    if (b <= a) b += 1440;
                    raw.push([a, b]); if (plant) usedPlantao = true;
                });
                raw.sort((x, y) => x[0] - y[0]);
                const iv = [];
                raw.forEach(r => { const last = iv[iv.length - 1]; if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else iv.push([r[0], r[1]]); });
                return { iv, tag: iv.length ? (usedPlantao ? 'plantao' : null) : (sawFolga ? 'folga' : null) };
            }
            function coStatus(now) {
                now = now || new Date();
                const nowM = now.getHours() * 60 + now.getMinutes();

                const prev = coDayIntervals(coDateOffset(-1, now)).iv;
                for (const x of prev) if (x[1] > 1440 && nowM < x[1] - 1440) return { open: true, closes: x[1] - 1440 };
                const today = coDayIntervals(coDateOffset(0, now)).iv;
                let upcoming = null;
                for (const x of today) {
                    if (nowM >= x[0] && nowM < x[1]) return { open: true, closes: x[1] };
                    if (x[0] > nowM && (upcoming === null || x[0] < upcoming)) upcoming = x[0];
                }
                if (upcoming !== null) return { open: false, off: 0, start: upcoming, dateStr: coDateOffset(0, now) };
                for (let k = 1; k <= 60; k++) {
                    const ds = coDateOffset(k, now), iv = coDayIntervals(ds).iv;
                    if (iv.length) return { open: false, off: k, start: iv[0][0], dateStr: ds };
                }
                return { open: false, off: null };
            }
            function coWhen(st) {
                if (st.off === 0) return 'hoje';
                if (st.off === 1) return 'amanhã';
                const [y, m, d] = st.dateStr.split('-');
                if (st.off <= 6) { const w = new Date(y, m - 1, d).getDay(); return (w === 0 || w === 6 ? 'no ' : 'na ') + CO_DAYS_LONG[w]; }
                return 'dia ' + d + '/' + m;
            }
            window.coStatusHtml = function () {
                let st; try { st = coStatus(); } catch (e) { return ''; }
                if (st.open) {
                    const nowM = new Date().getHours() * 60 + new Date().getMinutes();
                    const left = st.closes - nowM;
                    return left > 0 && left <= 60
                        ? '<span class="w-2 h-2 rounded-full bg-amber-400"></span> Fecha em breve · às ' + coFmt(st.closes)
                        : '<span class="co-open-dot"></span> Aberto agora · fecha às ' + coFmt(st.closes);
                }
                if (st.off === null) return '<span class="w-2 h-2 rounded-full bg-rose-400"></span> Fechado no momento';

            window.handleClientAvatarUpload = function(e) {

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = document.getElementById('cropper-img');
                    img.src = event.target.result;

                    img.onload = () => {
                        cropScale = 1;
                        cropX = 0;
                        cropY = 0;
                        document.getElementById('cropper-zoom').value = 1;

                        const container = document.getElementById('cropper-container');
                        const iRatio = img.naturalWidth / img.naturalHeight;
                        const cRatio = container.offsetWidth / container.offsetHeight;

                        if (iRatio > cRatio) {
                            img.style.height = '100%';
                            img.style.width = 'auto';
                        } else {
                            img.style.width = '100%';
                            img.style.height = 'auto';
                        }

                        updateCropperTransform();
                        document.getElementById('cropper-modal').classList.remove('hidden');

            window.updateCropperTransform = function() {
                const img = document.getElementById('cropper-img');
                img.style.transform = `translate(${cropX}px, ${cropY}px) scale(${cropScale})`;
            };

            const zoomInput = document.getElementById('cropper-zoom');
            if(zoomInput) {
                zoomInput.addEventListener('input', (e) => {
                    cropScale = parseFloat(e.target.value);
                    updateCropperTransform();
                });
            }

            const cropperContainer = document.getElementById('cropper-container');

            function startDragCrop(clientX, clientY) {
                isDraggingCrop = true;
                startX = clientX - cropX;
                startY = clientY - cropY;
            }

            function dragCrop(clientX, clientY) {
                if(!isDraggingCrop) return;
                cropX = clientX - startX;
                cropY = clientY - startY;
                updateCropperTransform();
            }

            function stopDragCrop() {
                isDraggingCrop = false;
            }

            if(cropperContainer) {
                cropperContainer.addEventListener('mousedown', e => startDragCrop(e.clientX, e.clientY));
                window.addEventListener('mousemove', e => dragCrop(e.clientX, e.clientY));
                window.addEventListener('mouseup', stopDragCrop);

                cropperContainer.addEventListener('touchstart', e => startDragCrop(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
                cropperContainer.addEventListener('touchmove', e => {
                    if(isDraggingCrop) {
                        e.preventDefault();
                        dragCrop(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }, {passive: false});
                cropperContainer.addEventListener('touchend', stopDragCrop);
            }

            window.closeCropper = function() {
                document.getElementById('cropper-modal').classList.add('hidden');
            };

            window.applyCrop = function() {
                const mask = document.querySelector('.cropper-mask');
                const img = document.getElementById('cropper-img');

                const cRect = mask.getBoundingClientRect();
                const iRect = img.getBoundingClientRect();

                const canvas = document.createElement('canvas');
                const SIZE = 400;
                canvas.width = SIZE;
                canvas.height = SIZE;
                const ctx = canvas.getContext('2d');

                const scaleX = img.naturalWidth / iRect.width;
                const scaleY = img.naturalHeight / iRect.height;

                let cropX_img = (cRect.left - iRect.left) * scaleX;
                let cropY_img = (cRect.top - iRect.top) * scaleY;
                let cropW_img = cRect.width * scaleX;
                let cropH_img = cRect.height * scaleY;

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, cropX_img, cropY_img, cropW_img, cropH_img, 0, 0, SIZE, SIZE);

                const base64 = canvas.toDataURL('image/jpeg', 0.85);
                currentClient.avatar = base64;

                delete currentClient.avatarScale;
                delete currentClient.avatarPosX;
                delete currentClient.avatarPosY;

                updateClientInDatabase()
                    .then(() => {
                        closeCropper();
                        render();
                        showModal('Foto Atualizada!', 'Sua foto de perfil foi ajustada e salva com sucesso.', 'success');
                    })
                    .catch(() => showModal('Erro', 'Não foi possível salvar a foto. Tente novamente.', 'error'));
            };

                const newName = document.getElementById('c-prof-name').value.trim();
                const phoneRaw = document.getElementById('c-prof-phone').value;

                const digitsPhone = cleanPhone(phoneRaw);

                if (!newName || newName.length < 3) return showModal('Aviso', 'Informe seu nome completo.', 'error');
                if (digitsPhone.length !== 11) return showModal('Telefone Inválido', 'Informe um telefone/WhatsApp válido com DDD e 9 dígitos.', 'error');

                const oldPassEl = document.getElementById('c-prof-old-pass');
                const newPassEl = document.getElementById('c-prof-new-pass');
                const confirmPassEl = document.getElementById('c-prof-confirm-pass');

                if (oldPassEl && newPassEl && confirmPassEl) {
                    const oldPass = oldPassEl.value.trim();
                    const newPass = newPassEl.value.trim();
                    const confirmPass = confirmPassEl.value.trim();

                    if (oldPass || newPass || confirmPass) {
                        if (!oldPass) return showModal('Erro de Senha', 'Digite sua senha atual para autorizar a alteração.', 'error');

                            const user = auth.currentUser;
                            const cred = EmailAuthProvider.credential(user.email, oldPass);
                            await reauthenticateWithCredential(user, cred);
                            await updatePassword(user, newPass);

                        }
                    }

                currentClient = { ...currentClient, name: newName, phone: phoneRaw };

                updateClientInDatabase()
                    .then(() => showModal('Sucesso!', 'Seu perfil foi atualizado com sucesso.', 'success', () => { render(); }))
