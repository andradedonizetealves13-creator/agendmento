                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="pt-2 text-center">
                            <button onclick="showHistoryApps = !showHistoryApps; render()" class="bg-white/90 backdrop-blur-md hover:bg-slate-50 text-slate-700 border font-bold px-6 py-3 rounded-2xl text-xs shadow-sm transition-all flex items-center justify-center mx-auto space-x-2">
                                <i data-lucide="${showHistoryApps ? 'chevron-up' : 'history'}" class="w-4 h-4"></i>
                                <span>${showHistoryApps ? 'Ocultar Histórico' : 'Carregar Agendamentos Antigos / Histórico'}</span>
                            </button>
                        </div>

                        ${showHistoryApps ? `
                            <div class="pt-4 border-t border-slate-200/60 fade-in">
                                <h3 class="text-base sm:text-lg font-bold text-slate-700 mb-3 flex items-center">
                                    <i data-lucide="archive" class="w-5 h-5 mr-2 text-slate-400"></i>
                                    Histórico (Concluídos, Cancelados ou Faltas)
                                </h3>
                                <div class="space-y-3">
                                    ${historyApps.length === 0 ? `
                                        <p class="text-xs text-slate-400 text-center py-4 bg-white/60 rounded-xl border">Nenhum histórico de agendamentos antigos registrado.</p>
                                    ` : historyApps.map(a => {
                                        const st = getEffectiveAppStatus(a);
                                        const emp = a.employeeId === t.admin.id ? t.admin : (t.employees || []).find(e=>e.id===a.employeeId);
                                        
                                        let statusTag = `<span class="bg-emerald-50 text-emerald-700 border-emerald-200 border text-[10px] font-bold px-2.5 py-1 rounded-full">Concluído</span>`;
                                        if (st === 'cancelado') statusTag = `<span class="bg-rose-50 text-rose-700 border-rose-200 border text-[10px] font-bold px-2.5 py-1 rounded-full">Cancelado</span>`;
                                        else if (st === 'expirado') statusTag = `<span class="bg-slate-100 text-slate-600 border-slate-200 border text-[10px] font-bold px-2.5 py-1 rounded-full">Não confirmado</span>`;
                                        else if (st === 'nao_compareceu') statusTag = `<span class="bg-amber-50 text-amber-700 border-amber-200 border text-[10px] font-bold px-2.5 py-1 rounded-full">Não Compareceu</span>`;

                                        return `
                                            <div class="bg-white/80 p-4 rounded-2xl border shadow-xs flex justify-between items-center opacity-85">
                                                <div class="text-left">
                                                    <div class="flex items-center space-x-2 mb-1">
                                                        <span class="text-xs font-bold text-slate-600">${formatDateBR(a.date)} às ${esc(a.time)}</span>
                                                        ${statusTag}
                                                    </div>
                                                    <p class="font-bold text-slate-800 text-sm">${esc(a.proceduresNames.join(', '))}</p>
                                                    <p class="text-xs text-slate-500 mt-0.5">Com ${esc(emp ? emp.name : 'Profissional')}</p>
                                                </div>
                                                <div class="text-right">
                                                    <span class="font-bold text-slate-700 text-sm">R$ ${a.totalPrice.toFixed(2)}</span>
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            window.cancelClientApp = function(id) {
                showModal('Cancelar Agendamento', 'Tem certeza que deseja cancelar este agendamento?', 'error', () => {
                    setAppointmentStatus(id, 'cancelado')
                        .then(() => showModal('Sucesso', 'O agendamento foi cancelado.', 'success'))
                        .catch(() => showModal('Erro', 'Não foi possível cancelar. Tente novamente.', 'error'));
                });
            };

            function renderClientBookingWizard() {
                const resched = clientBooking.resched;
                const order = bookingOrder();
                if (clientBooking.step !== 'confirm' && !order.includes(clientBooking.step)) clientBooking.step = order[0];
                if (!resched && !(t.employees && t.employees.length)) clientBooking.employeeId = t.admin.id;
                const step = clientBooking.step;
                const backBtn = (step === 'confirm' || order.indexOf(step) > 0)
                    ? `<button onclick="clientBack()" class="text-slate-400 mb-4"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>` : '';

                if (step === 'date') {
                    const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
                    const weekShortDays = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
                    const today = new Date(); today.setHours(0,0,0,0);
                    const currentYear = today.getFullYear();
                    const currentMonth = today.getMonth();
                    const lim = getCalLimit();

                    const canGoPrev = clientCalYear > currentYear || (clientCalYear === currentYear && clientCalMonth > currentMonth);
                    const canGoNext = (clientCalYear * 12 + clientCalMonth) < (lim.y * 12 + lim.m);

                    if (clientBooking.date && !bkDayOpen(clientBooking.date)) { clientBooking.date = null; clientBooking.time = null; }

                    const firstDay = new Date(clientCalYear, clientCalMonth, 1).getDay();
                    const daysInMonth = new Date(clientCalYear, clientCalMonth + 1, 0).getDate();
                    const cells = [];
                    for (let i = 0; i < firstDay; i++) cells.push({ empty: true });
                    for (let d = 1; d <= daysInMonth; d++) {
                        const dateStr = `${clientCalYear}-${String(clientCalMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        const isOpen = bkDayOpen(dateStr);
                        const isFull = isOpen && bkDayFull(dateStr);
                        cells.push({ empty: false, day: d, dateStr, isBlocked: !isOpen || isFull, isFull, isSelected: clientBooking.date === dateStr });
                    }
                    return `
                        <div class="max-w-lg mx-auto bg-white/90 backdrop-blur-md p-5 sm:p-8 rounded-[2rem] shadow-xl border fade-in">${backBtn}<h2 class="text-xl sm:text-2xl font-black text-center mb-6">${resched ? 'Escolha o Novo Dia' : 'Escolha o Dia'}</h2>
                            ${resched ? `<div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 mb-4 text-xs text-left"><p class="font-bold text-amber-900">Reagendando: ${esc(resched.proceduresNames.join(', '))}</p><p class="text-amber-800 mt-0.5">Horário atual: ${formatDateBR(resched.date)} às ${esc(resched.time)}</p><button onclick="resetBooking(); clientActiveTab='appointments'; render()" class="mt-2 font-bold text-amber-900 underline">Cancelar reagendamento</button></div>` : ''}
                            <div class="flex justify-between items-center mb-6 bg-slate-50 p-2.5 rounded-2xl border">
                                <button onclick="if(${canGoPrev}) { clientCalMonth--; if(clientCalMonth<0){clientCalMonth=11; clientCalYear--;} render(); }" class="${canGoPrev ? 'text-slate-700 hover:bg-slate-200' : 'text-slate-300 cursor-not-allowed'} p-1.5 rounded-xl"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                                <span class="text-sm font-black">${monthNames[clientCalMonth]} ${clientCalYear}</span>
                                <button onclick="if(${canGoNext}) { clientCalMonth++; if(clientCalMonth>11){clientCalMonth=0; clientCalYear++;} render(); }" class="${canGoNext ? 'text-slate-700 hover:bg-slate-200' : 'text-slate-300 cursor-not-allowed'} p-1.5 rounded-xl"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                            </div>
                            <div class="grid grid-cols-7 gap-1 text-center mb-2">${weekShortDays.map(w => `<span class="text-[11px] font-bold text-slate-400 uppercase">${w}</span>`).join('')}</div>
                            <div class="grid grid-cols-7 gap-1.5">${cells.map(c => c.empty ? `<div></div>` : c.isBlocked ? `<div class="h-10 sm:h-11 flex items-center justify-center rounded-xl bg-slate-100 text-slate-300 text-xs select-none" title="${c.isFull ? 'Sem horários livres' : 'Indisponível'}">${c.day}</div>` : `<button onclick="clientBooking.date='${c.dateStr}'; clientBooking.time=null; render()" class="h-10 sm:h-11 flex items-center justify-center rounded-xl text-xs font-bold ${c.isSelected?'btn-theme-primary':'bg-white border text-slate-700 hover:bg-slate-50'}">${c.day}</button>`).join('')}</div>
                            <p class="text-[11px] text-slate-400 text-center mt-4">${calendarHint()}</p>
                            ${clientBooking.date ? `<button onclick="clientNext()" class="w-full btn-theme-primary font-bold py-3.5 rounded-xl shadow-lg mt-6">Continuar</button>` : ''}
                        </div>`;
                }
                else if (step === 'procedure') {
                    const date = clientBooking.date, empId = clientBooking.employeeId;
                    const emps = t.employees || [];
                    const availableProcedures = t.procedures.filter(p => {
                        if (emps.length === 0) return date ? doesEmployeeWorkOnDate(t.admin, date) : true;
                        const pool = (empId && empId !== 'any') ? emps.filter(e => e.id === empId) : emps;
                        return pool.some(e => e.procedures && e.procedures.includes(p.id) && (!date || doesEmployeeWorkOnDate(e, date)));
                    });

                    return `
                        <div class="max-w-md mx-auto bg-white/90 backdrop-blur-md p-5 sm:p-8 rounded-[2rem] shadow-xl border fade-in">
                            ${backBtn}
                            <h2 class="text-xl sm:text-2xl font-black text-center mb-2">Escolha os Serviços</h2>
                            <p class="text-xs text-slate-400 text-center mb-6">${date ? `Disponíveis para ${formatDateBR(date)}` : 'Escolha o que você quer fazer'}</p>
                            ${availableProcedures.length === 0 ? `
                                <div class="text-center py-8 bg-amber-50 rounded-2xl border border-amber-200 p-4">
                                    <p class="text-sm text-amber-800 font-bold">Nenhum serviço disponível ${date ? 'para esta data' : 'com esta escolha'}.</p>
                                </div>
                            ` : `
                                <div class="space-y-3 max-h-[50vh] overflow-y-auto custom-scrollbar pr-1">${availableProcedures.map(p => {
                                    const dep = getDepositInfo([p]);
                                    return `
                                    <label class="flex justify-between items-center p-4 border rounded-2xl cursor-pointer hover:bg-slate-50"><div class="flex items-center space-x-3"><input type="checkbox" value="${p.id}" ${clientBooking.procedures.includes(p.id)?'checked':''} class="c-proc-check w-5 h-5 text-indigo-600 rounded"><div><p class="font-bold text-sm text-left">${esc(p.name)}</p><p class="text-xs text-slate-500 text-left">${p.duration} min${dep ? ` • <span class="text-amber-700 font-bold">sinal R$ ${dep.amount.toFixed(2)}</span>` : ''}</p></div></div><span class="font-bold text-emerald-600 text-sm">R$ ${p.price.toFixed(2)}</span></label>
                                `; }).join('')}</div>
                                <button onclick="clientGoProcedures()" class="w-full btn-theme-primary font-bold py-4 rounded-2xl shadow-lg mt-6">Continuar</button>
                            `}
                        </div>`;
                }
                else if (step === 'professional') {
                    const date = clientBooking.date, time = clientBooking.time, dur = bkDuration();
                    let empsAvailable = t.employees.filter(emp =>
                        clientBooking.procedures.every(pid => emp.procedures && emp.procedures.includes(pid)) &&
                        (!date || doesEmployeeWorkOnDate(emp, date))
                    );
                    if (date && time) empsAvailable = empsAvailable.filter(e => getAvailableTimeSlots(e.id, date, dur).some(s => s.time === time));

                    return `
                        <div class="max-w-xl mx-auto bg-white/90 backdrop-blur-md p-5 sm:p-8 rounded-[2rem] shadow-xl border fade-in">
                            ${backBtn}
                            <h2 class="text-xl sm:text-2xl font-black text-center mb-6">Quem vai te atender?</h2>
                            ${empsAvailable.length === 0 ? `
                                <div class="text-center py-8 bg-rose-50 rounded-2xl border border-rose-100 p-4">
                                    <p class="text-sm text-rose-800 font-bold">Nenhum profissional disponível com as escolhas feitas.</p>
                                    <p class="text-xs text-rose-700 mt-1">Volte e escolha outros serviços, outro dia ou outro horário.</p>
                                </div>
                            ` : `
                                <div class="grid grid-cols-2 gap-4">${empsAvailable.length > 1 ? `<div onclick="clientBooking.employeeId='any'; clientNext()" class="col-span-2 p-4 border-2 border-dashed rounded-2xl flex items-center justify-center space-x-3 cursor-pointer hover:border-indigo-600 bg-white transition-all"><i data-lucide="users" class="w-6 h-6 text-theme-primary"></i><div class="text-left"><p class="font-bold text-sm">Qualquer profissional</p><p class="text-xs text-slate-500">Mostra todos os horários livres</p></div></div>` : ''}${empsAvailable.map(item => `
                                    <div onclick="clientBooking.employeeId='${item.id}'; clientNext()" class="p-4 border rounded-2xl flex flex-col items-center cursor-pointer hover:border-indigo-600 bg-slate-50 transition-all">
                                        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-xl mb-2 overflow-hidden shrink-0 border border-slate-200">
                                            ${item.avatar ? `<img src="${esc(item.avatar)}" class="w-full h-full object-cover">` : `<span>${esc(item.name.charAt(0))}</span>`}
                                        </div>
                                        <p class="font-bold text-sm text-center truncate w-full">${esc(item.name)}</p>
                                    </div>
                                `).join('')}</div>
                            `}
                        </div>`;
                }
                else if (step === 'time' || step === 'confirm') {
                    const isLast = order[order.length - 1] === step || step === 'confirm';
                    const showSlots = step === 'time';
                    const selectedProcs = bkProcs();
                    const hasProcs = !!resched || selectedProcs.length > 0;
                    const totalDuration = resched ? resched.totalDuration : selectedProcs.reduce((s, p) => s + p.duration, 0);
                    const totalPrice = resched ? resched.totalPrice : selectedProcs.reduce((s, p) => s + p.price, 0);
                    const slots = bkSlots();
                    const empRaw = bkEmp();
                    const emp = (empRaw && empRaw !== 'any') ? getEmployeeById(empRaw) : null;
                    const empLabel = empRaw === 'any' ? 'Qualquer profissional' : (emp ? emp.name : null);
                    const serviceNames = resched ? resched.proceduresNames : selectedProcs.map(p => p.name);

                    if (clientBooking.time && !slots.some(s => s.time === clientBooking.time)) {
                        clientBooking.time = null;
                        if (step === 'confirm') {
                            clientBooking.step = 'time';
                            setTimeout(() => showModal('Horário não comporta', 'Com as escolhas feitas esse horário não está mais livre. Escolha outro horário.', 'info'), 0);
                            return renderClientBookingWizard();
                        }
                    }

                    const selectedSlotObj = slots.find(s => s.time === clientBooking.time);
                    const isColliding = selectedSlotObj && selectedSlotObj.hasClientCollision;
                    const dep = resched ? null : getDepositInfo(selectedProcs);

                    const summary = `<div class="bg-slate-50 p-4 rounded-2xl border mb-6 text-xs sm:text-sm text-left"><p><b>Data:</b> ${formatDateBR(clientBooking.date)}</p>${clientBooking.time && !showSlots ? `<p><b>Horário:</b> ${esc(clientBooking.time)}</p>` : ''}${empLabel ? `<p><b>Profissional:</b> ${esc(empLabel)}</p>` : ''}${serviceNames.length ? `<p><b>Serviços:</b> ${esc(serviceNames.join(', '))}</p>` : ''}${resched ? `<p><b>Horário atual:</b> ${formatDateBR(resched.date)} às ${esc(resched.time)}</p>` : ''}${hasProcs ? `<p class="mt-2 text-emerald-600 font-bold text-sm sm:text-base">Total: R$ ${totalPrice.toFixed(2)} (${totalDuration} min)</p>` : ''}</div>`;

                    const slotsHtml = !showSlots ? '' : `
                            <p class="text-xs font-bold text-slate-500 uppercase mb-2 text-left">Horários Livres:</p>
                            ${slots.length === 0 ? `
                                <div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl mb-4 text-center">
                                    <p class="text-sm font-bold text-amber-900">Não há horários livres neste dia com as escolhas feitas.</p>
                                    <p class="text-xs text-amber-800 mt-1 mb-3">Tente outro dia ou outro profissional.</p>
                                    <button onclick="clientBooking.step='date'; clientBooking.time=null; render()" class="btn-theme-primary font-bold px-5 py-2.5 rounded-xl text-xs">Escolher outro dia</button>
                                </div>
                            ` : `
                                <div class="grid grid-cols-3 gap-2 mb-6 max-h-40 overflow-y-auto custom-scrollbar pr-1">${slots.map(s => `
                                    <button onclick="clientBooking.time='${s.time}'; render()" class="py-2.5 border rounded-xl text-xs font-bold relative ${clientBooking.time===s.time?'btn-theme-primary':'bg-white hover:bg-slate-50'}">
                                        ${s.time}${s.hasClientCollision ? `<span class="absolute top-1 right-1 w-2 h-2 bg-amber-500 rounded-full" title="Você já tem agendamento neste horário"></span>` : ''}
                                    </button>
                                `).join('')}</div>
                            `}`;

                    const depHtml = dep ? `
                                <div class="p-4 bg-amber-50 border-2 border-dashed border-amber-300 rounded-2xl mb-4 text-xs text-left fade-in">
                                    <p class="font-black text-amber-900 flex items-center mb-1"><i data-lucide="wallet" class="w-4 h-4 mr-1.5"></i> Este agendamento exige sinal</p>
                                    <p class="text-amber-800">Sinal de <b>R$ ${dep.amount.toFixed(2)}</b> (${dep.percent}%). ${dep.auto ? 'Ao confirmar, você verá o QR Code e o Pix copia e cola. O horário fica reservado e é <b>confirmado automaticamente</b> assim que o pagamento for identificado.' : 'Ao confirmar, você verá o QR Code e o Pix copia e cola. O horário fica reservado como <b>pendente</b> até o profissional confirmar o pagamento.'}${dep.expiryHours > 0 ? ` Pague em até <b>${dep.expiryHours}h</b> ou o horário é liberado.` : ''}</p>
                                </div>` : '';

                    const confirmHtml = !clientBooking.time ? '' : `
                                ${(!resched && !isColliding) ? `<label class="flex items-center space-x-2 mb-3 text-xs font-bold text-slate-700 cursor-pointer text-left"><input type="checkbox" ${clientBooking.isForOther ? 'checked' : ''} onchange="clientBooking.isForOther=this.checked; render()" class="w-4 h-4 rounded"><span>Este agendamento é para outra pessoa</span></label>${clientBooking.isForOther ? `<div class="mb-4 text-left fade-in"><label class="block text-xs font-bold text-slate-700 mb-1">Nome Completo do Atendido *</label><input type="text" id="beneficiary-name-inp" value="${esc(clientBooking.beneficiaryName)}" oninput="clientBooking.beneficiaryName = this.value" placeholder="Ex: João da Silva" class="w-full px-3 py-2 bg-white border rounded-xl outline-none focus:border-indigo-500 text-slate-800 font-semibold text-sm"></div>` : ''}` : ''}
                                ${(!resched && isColliding) ? `
                                    <div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl mb-4 text-xs fade-in text-left">
                                        <p class="font-bold text-amber-900 mb-1 flex items-center"><i data-lucide="alert-circle" class="w-4 h-4 mr-1 text-amber-600"></i> Você já possui um agendamento neste horário/faixa de tempo!</p>
                                        <p class="text-amber-800 mb-3">Para prosseguir, confirme se este agendamento é para outra pessoa (filho, acompanhante, etc.):</p>
                                        <label class="block font-bold text-slate-700 mb-1">Nome Completo do Atendido *</label>
                                        <input type="text" id="beneficiary-name-inp" value="${esc(clientBooking.beneficiaryName)}" oninput="clientBooking.beneficiaryName = this.value" placeholder="Ex: João da Silva" class="w-full px-3 py-2 bg-white border rounded-xl outline-none focus:border-indigo-500 text-slate-800 font-semibold">
                                    </div>
                                ` : ''}
                                ${depHtml}
                                ${isLast
                                    ? `<button onclick="clientFinalize()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl shadow-lg transition-all">${resched ? 'Confirmar Reagendamento' : (dep ? 'Confirmar e pagar o sinal' : 'Confirmar Agendamento')}</button>`
                                    : `<button onclick="clientNext()" class="w-full btn-theme-primary font-bold py-4 rounded-2xl shadow-lg">Continuar</button>`}`;

                    return `
                        <div class="max-w-md mx-auto bg-white/90 backdrop-blur-md p-5 sm:p-8 rounded-[2rem] shadow-xl border fade-in">
                            ${backBtn}
                            <h2 class="text-xl sm:text-2xl font-black text-center mb-6">${step === 'time' ? (isLast ? (resched ? 'Confirmar Novo Horário' : 'Confirmar Horário') : 'Escolha o Horário') : 'Confirmar Agendamento'}</h2>
                            ${summary}
                            ${slotsHtml}
                            ${confirmHtml}
                        </div>`;
                }
            }

            window.clientGoProcedures = function() {
                const checks = Array.from(document.querySelectorAll('.c-proc-check:checked')).map(c => c.value);
                if (checks.length === 0) return showModal('Aviso', 'Selecione pelo menos um serviço.', 'info');

                if (t.employees && t.employees.length > 0) {
                    const date = clientBooking.date, empId = clientBooking.employeeId;
                    const pool = (empId && empId !== 'any') ? t.employees.filter(e => e.id === empId) : t.employees;
                    const someoneDoesAll = pool.some(emp =>
                        checks.every(pid => emp.procedures && emp.procedures.includes(pid)) &&
                        (!date || doesEmployeeWorkOnDate(emp, date))
                    );
                    if (!someoneDoesAll) {
                        return showModal('Combinação indisponível',
                            'Nenhum profissional faz todos esses serviços juntos' + (date ? ' neste dia' : '') + '. Tente marcar menos serviços' + (date ? ' ou escolher outro dia' : '') + '.', 'info');
                    }
                }

                clientBooking.procedures = checks;
                clientNext();
            };

            window.clientFinalize = function() {
                if (!clientBooking.time) return showModal('Aviso', 'Selecione um horário.', 'info');
                if (!clientBooking.resched && !(t.employees && t.employees.length)) clientBooking.employeeId = t.admin.id;
                if (!clientBooking.resched && !isDateAllowedByMonthlyRule(new Date(clientBooking.date + 'T00:00:00'))) {
                    clientBooking.date = null; clientBooking.time = null; clientBooking.step = 'date'; render();
                    return showModal('Data indisponível', 'Essa data não está mais aberta para agendamento. Escolha outro dia.', 'error');
                }

                const resched = clientBooking.resched;
                const selectedProcs = resched ? [] : t.procedures.filter(p => clientBooking.procedures.includes(p.id));
                const totalDuration = resched ? resched.totalDuration : selectedProcs.reduce((s, p) => s + p.duration, 0);
                const totalPrice = resched ? resched.totalPrice : selectedProcs.reduce((s, p) => s + p.price, 0);
                const serviceNames = resched ? resched.proceduresNames : selectedProcs.map(p => p.name);

                const slot = getBookingSlots(clientBooking.employeeId, clientBooking.date, totalDuration, clientBooking.procedures).find(s => s.time === clientBooking.time);
                if (!slot || (resched && slot.hasClientCollision)) {
                    backToTime();
                    return showModal('Horário indisponível', 'Esse horário acabou de ser ocupado ou já passou. Escolha outro horário.', 'error');
                }

                const bookedDate = clientBooking.date, bookedTime = clientBooking.time;

                if (resched) {
                    const reschedEmp = getEmployeeById(resched.employeeId);
                    rescheduleAppointment(resched.id, bookedDate, bookedTime).then(res => {
                        if (!res.ok) {
                            backToTime();
                            if (res.reason === 'missing') return showModal('Não foi possível reagendar', 'Este agendamento não está mais ativo. Confira a aba Meus horários.', 'error');
                            return showModal('Horário indisponível', 'Esse horário acabou de ser ocupado por outra pessoa. Escolha outro horário.', 'error');
                        }
                        const link = calendarLinkHtml(serviceNames.join(', ') + ' - ' + t.name, bookedDate, bookedTime, totalDuration, 'Profissional: ' + (reschedEmp ? reschedEmp.name : ''));
                        showModal('Reagendado!', `Seu agendamento foi movido para ${formatDateBR(bookedDate)} às ${esc(bookedTime)}.<br>${link}`, 'success', () => {
                            resetBooking();
                            clientActiveTab = 'appointments';
                            render();
                        });
                    }).catch(() => showModal('Erro de conexão', 'Não foi possível reagendar. Verifique sua internet e tente de novo.', 'error'));
                    return;
                }

                let finalBeneficiary = currentClient.name;
                if (slot.hasClientCollision || clientBooking.isForOther) {
                    const inpVal = document.getElementById('beneficiary-name-inp')?.value.trim();
                    if (!inpVal || inpVal.length < 3) {
                        return showModal('Aviso Necessário', 'Por favor, informe o Nome Completo da pessoa que receberá o atendimento.', 'error');
                    }
                    finalBeneficiary = inpVal;
                }

                let finalEmpId = clientBooking.employeeId;
                if (finalEmpId === 'any') finalEmpId = resolveEmployeeForTime(clientBooking.date, totalDuration, clientBooking.procedures, clientBooking.time);
                if (!finalEmpId) {
                    backToTime();
                    return showModal('Horário indisponível', 'Esse horário acabou de ser ocupado. Escolha outro horário.', 'error');
                }
                const finalEmp = getEmployeeById(finalEmpId);
                if (finalEmp && t.employees && t.employees.length && !clientBooking.procedures.every(pid => finalEmp.procedures && finalEmp.procedures.includes(pid))) {
                    clientBooking.step = 'professional'; render();
                    return showModal('Profissional indisponível', 'Esse profissional não faz todos os serviços escolhidos. Escolha outro profissional.', 'error');
                }
                const depInfo = getDepositInfo(selectedProcs);

                const newApp = { 
                    id: 'app-' + Date.now(), 
                    clientId: currentClient.id, 
                    clientName: currentClient.name,
                    beneficiaryName: finalBeneficiary,
                    clientPhone: currentClient.phone || '', 
                    employeeId: finalEmpId, 
                    date: clientBooking.date, 
                    time: clientBooking.time, 
                    proceduresNames: serviceNames, 
                    totalDuration, 
                    totalPrice, 
                    createdAt: new Date().toISOString(),
                    procedureIds: clientBooking.procedures.map(String),
                    ...(depInfo ? { status: 'pendente', depositRequired: true, depositAmount: depInfo.amount, depositPercent: depInfo.percent, ...(depInfo.auto ? { pixProvider: 'mercadopago' } : { pixKeyType: depInfo.pixKeyType, pixKey: depInfo.pixKey, whatsappLink: depInfo.whatsappLink || '' }), ...(depInfo.expiryHours > 0 ? { depositDeadline: new Date(Date.now() + depInfo.expiryHours * 3600000).toISOString() } : {}) } : {})
                };
                const forOther = finalBeneficiary !== currentClient.name;

                createAppointment(newApp).then(result => {
                    if (!result.ok) {
                        backToTime();
                        return showModal('Horário indisponível', 'Esse horário acabou de ser ocupado por outra pessoa. Escolha outro horário.', 'error');
                    }
                    const link = calendarLinkHtml(serviceNames.join(', ') + ' - ' + t.name, bookedDate, bookedTime, totalDuration, 'Profissional: ' + (finalEmp ? finalEmp.name : ''));
                    if (depInfo && depInfo.auto) {
                        const goList = () => { resetBooking(); clientActiveTab = 'appointments'; render(); };
                        showModal('Gerando seu Pix...', 'Aguarde um instante.', 'info');
                        createMpPix(newApp.id).then(r => {
                            window.watchPayId = newApp.id;
                            showModal('Quase lá! Falta o sinal', pixAutoHtml(bookedDate, bookedTime, r.amount, r.pixCode, r.deadline) + link, 'success', goList);
                        }).catch(err => {
                            goList();
                            showModal('Horário reservado, mas o Pix não foi gerado', 'Seu horário está reservado como pendente. Toque em <b>Ver Pix</b> abaixo para tentar gerar o Pix de novo.<br><span class="text-xs text-slate-400">' + esc((err && err.message) || '') + '</span>', 'error');
                        });
                        return;
                    }
                    if (depInfo) return showModal('Quase lá! Falta o sinal', pixHtml(bookedDate, bookedTime, depInfo.amount, depInfo.pixKeyType, depInfo.pixKey, depInfo.whatsappLink, newApp.depositDeadline) + link, 'success', () => { resetBooking(); clientActiveTab = 'appointments'; render(); });
                    showModal('Sucesso!', `Agendamento confirmado para ${formatDateBR(bookedDate)} às ${esc(bookedTime)}${forOther ? ` (Para: ${esc(finalBeneficiary)})` : ''}!<br>${link}`, 'success', () => {
                        resetBooking();
                        clientActiveTab = 'appointments'; 
                        render();
                    });
                }).catch(() => showModal('Erro de conexão', 'Não foi possível confirmar o agendamento. Verifique sua internet e tente de novo.', 'error'));
            };
            // desenha o QR Code do Pix sempre que um modal for aberto
            const _showModalBase = window.showModal;
            window.showModal = function() { _showModalBase.apply(this, arguments); setTimeout(window.drawPixQr, 0); };
        }
    </script>
<script>
/* mostrar/ocultar senha — decora os campos de senha a cada renderização, sem alterar a lógica */
(function () {
    var OPEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    var SHUT = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/></svg>';
    function deco() {
        document.querySelectorAll('#app input[type="password"]:not([data-eye])').forEach(function (i) {
            i.setAttribute('data-eye', '1');
            var p = i.offsetParent || i.parentElement; if (!p) return;
            if (getComputedStyle(p).position === 'static') p.style.position = 'relative';
            i.style.paddingRight = '2.75rem';
            var b = document.createElement('button'); b.type = 'button'; b.className = 'eye-btn'; b.innerHTML = OPEN; b.setAttribute('aria-label', 'Mostrar senha');
            b.style.top = (i.offsetTop + i.offsetHeight / 2 - 18) + 'px'; b.style.left = (i.offsetLeft + i.offsetWidth - 40) + 'px';
            b.onclick = function () { var show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.innerHTML = show ? SHUT : OPEN; b.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha'); };
            i.insertAdjacentElement('afterend', b);
        });
    }
    var app = document.getElementById('app'), t;
    if (app) new MutationObserver(function () { cancelAnimationFrame(t); t = requestAnimationFrame(deco); }).observe(app, { childList: true, subtree: true });
    deco();
})();
</script>
<script>
/* alternar claro/escuro: lua (vai para o escuro) e sol (volta para o claro) */
(function () {
    var H = document.documentElement, b = document.createElement('button'); b.id = 'mode-toggle'; b.type = 'button';
    var A = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
    var MOON = A + '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    var SUN = A + '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
    function paint() { var d = H.getAttribute('data-mode') === 'dark'; b.innerHTML = d ? SUN : MOON; b.title = b.ariaLabel = d ? 'Modo claro' : 'Modo escuro'; b.setAttribute('aria-label', b.title); }
    b.onclick = function () { var d = H.getAttribute('data-mode') === 'dark'; if (d) H.removeAttribute('data-mode'); else H.setAttribute('data-mode', 'dark'); try { localStorage.setItem('cliente_mode', d ? 'light' : 'dark'); } catch (e) {} paint(); };
    document.body.appendChild(b); paint();
})();
</script>
